長期於歐洲研究生院、紐約大學等機構任教，講學與出版產量驚人。"], "core_concepts": ["意識形態的崇高客體：人們往往清楚知道意識形態的運作邏輯是虛構的，卻仍然按照它行動，因為意識形態真正抓住主體的方式是透過「享樂」的結構性投注。", "享樂的政治：意識形態鬥爭的真正戰場往往不在理性論證的層次，而在誰的享樂方式被承認。", "視差：某些根本的哲學與意識形態對立不是有待綜合的假對立，而是同一個實在從結構性不同視角觀察必然產生的視差落差。", "黑格爾式辯證法的拉岡式重讀：每一次「否定之否定」揭露的都是原初矛盾本身無法被克服、只能被重新配置。", "犬儒理性：保持一種嘲諷式的、對意識形態運作心知肚明的距離，卻絲毫不妨礙繼續按照這套邏輯行動。"], "relations": [{"type": "對話", "name": "巴迪歐", "text": "長期親密的思想盟友，兩人共享黑格爾與拉岡的理論裝備"}, {"type": "批判", "name": "德勒茲", "text": "批判德勒茲的欲望生產理論迴避了拉岡意義上欲望的根本匱乏結構與否定性"}, {"type": "呼應", "name": "阿多諾與霍克海默", "text": "意識形態批判計畫在方法論精神上高度呼應法蘭克福學派"}, {"type": "批判", "name": "哈伯瑪斯", "text": "對哈伯瑪斯式的溝通理性與審議民主模型抱持根本懷疑"}], "intro_reading": ["《意識形態的崇高客體》——奠定他理論地位的代表作", "《傅萊迪的電影指南》——用電影案例解釋精神分析概念"], "advanced_reading": ["《視差之見》——視差概念最系統性的哲學展開", "《少於無》——對黑格爾最龐大、最系統性的拉岡式重讀"]}, {"id": "phil-24", "name_zh": "巴特勒", "name_orig": "Judith Butler", "dates": "1956–（仍在世）", "traditions": ["性別理論"], "date": "2026-08-22", "status": "定稿", "intro": "美國哲學家，當代性別與酷兒理論最具影響力的奠基者之一。1990 年《性別麻煩》提出「展演性」理論，主張性別不是內在本質的表現，而是透過不斷重複的規範性行為被生產出來的效果，徹底改寫了性別作為「本質」還是「建構」的傳統辯論框架。採用 they/them 代名詞。", "background": ["1956 年生於美國俄亥俄州克里夫蘭，1984 年於耶魯大學取得哲學博士學位。1993 年起長期任教於加州大學柏克萊分校比較文學系與批判理論學程。", "1990 年出版代表作《性別麻煩》，此書意外引爆遠超學院範圍的廣泛論戰。2000 年代後思想關注日益轉向政治哲學與倫理學，2020 年當選現代語言協會主席。"], "core_concepts": ["展演性：性別不是先於行動而存在的內在本質，而是透過不斷重複的規範性言說與身體行動被生產、被自然化的效果。", "性／性別的建構性：即使是看似前文化、純生物性的「性」本身，也已經是透過特定的論述框架被範疇化的產物。", "可悼念性：不同生命在特定的權力與話語框架下被賦予不同程度的「可被哀悼」資格，這個差異分配本身就是一種深刻的政治暴力運作。", "框架：媒體與話語如何預先框限、篩選我們能夠感知、承認為「生命」與「暴力」的範圍。", "主體形成的心理生活：主體並非先於權力運作而存在，而是權力運作本身生產出主體。"], "relations": [{"type": "繼承", "name": "傅柯", "text": "權力/話語生產主體性的框架是巴特勒理論的核心裝備"}, {"type": "繼承", "name": "德希達", "text": "展演性概念直接借用德希達對奧斯汀言語行為理論的解構式重讀"}, {"type": "呼應", "name": "阿岡本", "text": "晚近著作都深入處理脆弱性、可悼念性、裸命等主題"}, {"type": "批判", "name": "拉岡", "text": "透過黑格爾式的閱讀路徑批判性地挪用精神分析的主體形成理論"}, {"type": "批判", "name": "弗雷澤", "text": "弗雷澤曾批評巴特勒式的展演性理論過度聚焦於文化與話語層面的性別政治"}], "intro_reading": ["《性別麻煩》——奠定其理論地位的代表作", "《消解性別》——文集形式，語言相對平易"], "advanced_reading": ["《身體之重》——回應對展演性理論常見誤讀的重要澄清", "《危脆生命》——政治哲學轉向後最重要的著作"]}, {"id": "phil-25", "name_zh": "布魯諾拉圖", "name_orig": "Bruno Latour", "dates": "1947–2022", "traditions": ["行動者網絡理論／科學研究"], "date": "2026-08-22", "status": "定稿", "intro": "法國哲學家、人類學家、社會學家，科學與技術研究領域最具影響力的理論家之一，行動者網絡理論的主要建構者。主張科學事實不是被「發現」的客觀真理，而是透過人類與非人類行動者交織成的網絡協商建構出來的。", "background": ["1947 年生於法國勃根地博訥一個釀酒世家。博士論文以神學與詮釋學為題，此後與塞荷共事，兩人後來合著《關於科學、文化與時間的對話》。1979 年出版《實驗室生活》。", "1991 年出版代表作《我們從未現代過》。晚年投入生態危機的政治哲學思考，2013 年獲頒霍爾堡國際紀念獎，2021 年獲頒京都獎，2022 年因胰臟癌病逝於巴黎。"], "core_concepts": ["行動者網絡理論：科學事實與技術物件的產生，是透過異質的行動者網絡彼此協商、結盟、對抗建構出來的。", "行動素與非人類能動性：物件、技術、動物、微生物同樣可以是網絡裡具有能動性的「行動素」。", "我們從未現代過：現代性的自我理解建立在「自然」與「社會」被徹底淨化分離的敘事之上，但實際運作卻不斷生產大量混雜物。", "新氣候體制：氣候變遷徹底改寫了政治的座標，要求一套全新的政治想像——不再是左右之分，而是「著陸於地球」與否之分。"], "relations": [{"type": "師承／對話", "name": "塞荷", "text": "早年與塞荷共事並深受影響，合著《關於科學、文化與時間的對話》"}, {"type": "批判", "name": "傅柯", "text": "行動者網絡理論隱含對傅柯權力分析方法論的批評"}, {"type": "呼應", "name": "德勒茲", "text": "兩人的本體論都拒絕預先給定的固定實體，強調關係性、生成性的存在方式"}, {"type": "批判", "name": "布希亞", "text": "拉圖式的「建構」始終保留了某種實在論的立場，與布希亞主張真實已不復存在的立場構成根本對立"}], "intro_reading": ["《我們從未現代過》——篇幅適中、論證清晰", "《巴斯德的實驗室》——以具體歷史案例展示行動者網絡理論如何運作"], "advanced_reading": ["《重組社會》——他自己對行動者網絡理論方法論最系統性的整理", "《面對蓋婭》——晚期生態政治哲學最重要的著作"]}, {"id": "phil-26", "name_zh": "葛蘭西", "name_orig": "Antonio Gramsci", "dates": "1891–1937", "traditions": ["西方馬克思主義"], "date": "2026-08-22", "status": "定稿", "intro": "義大利馬克思主義理論家與政治行動者，西方馬克思主義最重要的奠基者之一。畢生思考的核心問題是：為何西歐已開發資本主義國家沒有如馬克思預言般發生無產階級革命？答案是文化霸權——統治階級的世界觀被廣泛內化為「常識」，使得被統治者同意而非被迫接受既有秩序。", "background": ["1891 年生於義大利薩丁尼亞島一個中下階層家庭。1919 年參與創辦《新秩序》週刊，積極參與杜林工廠委員會運動。1921 年參與創立義大利共產黨，1924 年成為總書記。", "1926 年被墨索里尼政權逮捕入獄，獄中健康持續惡化，卻在極度受限的條件下寫成《獄中札記》，以隱晦語言躲避審查。1937 年出獄後不久即因腦溢血病逝於羅馬。"], "core_concepts": ["文化霸權：統治階級的世界觀透過教育、宗教、媒體、日常文化被廣泛內化為「常識」，使得被統治者對既有秩序表示同意而非被迫服從。", "有機知識分子與傳統知識分子：傳統知識分子自認超越階級利益，有機知識分子則有意識地與特定階級的世界觀與利益綁定。", "陣地戰與運動戰：運動戰是奪取國家機器的直接快速鬥爭，陣地戰是在市民社會裡進行的長期文化與意識形態爭奪戰。", "市民社會作為霸權戰場：現代國家的權力運作不能簡化為政治社會的強制力，市民社會同樣是霸權建構與爭奪的關鍵場域。"], "relations": [{"type": "呼應", "name": "阿圖塞", "text": "阿圖塞的意識形態國家機器理論明確承繼並系統化了葛蘭西對市民社會運作機制的洞察"}, {"type": "繼承", "name": "拉克勞與墨菲", "text": "《霸權與社會主義策略》以葛蘭西的霸權概念為出發點，主張把霸權徹底解構為話語建構"}, {"type": "呼應", "name": "傅柯", "text": "葛蘭西對霸權如何透過「同意」運作的分析，與傅柯對現代規訓權力的分析有值得對讀的親近性"}], "intro_reading": ["《獄中札記選集》（Hoare & Smith 英譯本）——優先讀〈國家與市民社會〉與〈知識分子〉兩節", "《葛蘭西讀本》（Forgacs 編）——作為補充，提供脈絡化導讀"], "advanced_reading": ["《獄中札記》全本——原文寫於獄中，密度極高", "Perry Anderson〈葛蘭西的二律背反〉——最尖銳的批判性導讀"]}, {"id": "phil-27", "name_zh": "阿圖塞", "name_orig": "Louis Althusser", "dates": "1918–1990", "traditions": ["西方馬克思主義"], "date": "2026-08-22", "status": "定稿", "intro": "法國馬克思主義哲學家，結構主義馬克思主義最重要的代表人物。以「意識形態國家機器」與「召喚」概念聞名。長期任教於巴黎高等師範學院，培養出包括傅柯、德希達、巴迪歐在內的一整代法國思想家，晚年因精神疾病發作殺害妻子。", "background": ["1918 年生於法屬阿爾及利亞。1939 年考入巴黎高等師範學院，隔年被德軍俘虜，戰俘營經驗讓他的立場逐漸轉向馬克思主義。1948 年加入法國共產黨，此後在 ENS 任教近三十年。", "1965 年出版《保衛馬克思》，1970 年發表〈意識形態與意識形態國家機器〉。1980 年在一次精神崩潰中勒死同居伴侶，被判定因精神失常而不需接受審判，1990 年因心臟病發病逝。"], "core_concepts": ["意識形態國家機器：鎮壓性國家機器主要透過暴力運作，意識形態國家機器（學校、教會、媒體）主要透過意識形態運作。", "召喚：意識形態透過把個人「招呼」成主體來運作，主體性本身不是先於意識形態存在的，而是被意識形態召喚的效果。", "認識論斷裂：馬克思的思想在 1845 年左右經歷了根本性的斷裂，從人道主義轉向科學性歷史唯物論。", "多元決定：社會結構裡的矛盾從不以單一形式運作，而是彼此疊層、中介的複雜配置。"], "relations": [{"type": "師承", "name": "傅柯", "text": "ENS 時期的老師，說服傅柯加入法國共產黨"}, {"type": "師承", "name": "巴迪歐", "text": "巴黎高師時期深受其結構主義馬克思主義影響"}, {"type": "同事", "name": "德希達", "text": "兩人一度在 ENS 共用辦公室"}, {"type": "呼應", "name": "葛蘭西", "text": "把葛蘭西對意識形態運作機制較為鬆散的文化滲透式描述，重新形式化為結構主義式的「召喚」機制"}, {"type": "呼應", "name": "拉岡", "text": "多元決定概念借用自佛洛伊德精神分析，召喚理論與拉岡鏡像階段理論高度呼應"}], "intro_reading": ["〈意識形態與意識形態國家機器〉——收錄於《列寧與哲學》，單獨的論文足夠作為入門", "Terry Eagleton《意識形態導論》——有清晰的阿圖塞章節"], "advanced_reading": ["《保衛馬克思》——確立結構主義馬克思主義立場的核心著作", "《讀〈資本論〉》——對《資本論》進行結構主義式重讀的代表作"]}, {"id": "phil-28", "name_zh": "哈維", "name_orig": "David Harvey", "dates": "1935–（仍在世）", "traditions": ["西方馬克思主義"], "date": "2026-08-22", "status": "定稿", "intro": "英裔美籍地理學家與社會理論家，當代最具影響力的馬克思主義地理學家。核心關切是把馬克思《資本論》的分析架構延伸至空間與地理層面——資本積累不是在抽象空間裡發生的，而是持續透過具體的地理擴張來解決自身的內在危機。", "background": ["1935 年生於英國肯特郡，1961 年取得地理學博士學位。1969 年赴美任教於約翰霍普金斯大學，親身經歷美國城市種族衝突後轉向馬克思主義政治經濟學。1982 年出版《資本的界限》。", "他自 1970 年代初期起持續在課堂上逐章講讀馬克思《資本論》，近五十年來未曾間斷。2005 年出版《新自由主義簡史》，2026 年新著《資本的故事》問世。"], "core_concepts": ["空間修補：資本積累內在地傾向於生產過剩，必須透過地理上的擴張來暫時吸收過剩資本。", "掠奪性積累：透過暴力、法律手段剝奪公共資源、將其轉化為私有資本的過程，是資本主義持續運作至今的常態機制。", "新自由主義作為階級計畫：新自由主義的真實歷史功能是恢復並鞏固資本相對於勞動的階級權力。", "城市權：城市空間的生產與分配過程本身就是階級鬥爭的核心場域。"], "relations": [{"type": "呼應", "name": "馬庫色", "text": "兩人都關切晚期資本主義如何透過收編中和批判性力量"}, {"type": "呼應", "name": "拉克勞與墨菲", "text": "三人同屬對正統馬克思主義經濟決定論展開修正的世代，但路徑截然不同"}, {"type": "對話", "name": "詹姆遜", "text": "兩人的分析都聚焦於晚期資本主義的文化與空間邏輯"}, {"type": "呼應", "name": "弗雷澤", "text": "兩人都關切晚期資本主義如何生產與掩蓋自身運作所依賴的隱藏條件"}], "intro_reading": ["《新自由主義簡史》——最易讀、最具即時相關性的入口", "《資本的故事》——他自己整理的最新普及讀本"], "advanced_reading": ["《新帝國主義》——空間修補與掠奪性積累的完整論述", "《資本的界限》——哈維最重要的學術著作"]}, {"id": "phil-29", "name_zh": "拉克勞", "name_orig": "Ernesto Laclau", "dates": "1935–2014", "traditions": ["後馬克思主義／激進民主"], "date": "2026-08-22", "status": "定稿", "intro": "阿根廷裔政治理論家，與墨菲共同開創後馬克思主義霸權理論。畢生關切：如何在拒絕馬克思主義經濟決定論的前提下，仍保留一套解釋政治認同如何形成的理論？答案是把霸權解構為透過話語建構起來的偶然性成就。", "background": ["1935 年生於阿根廷布宜諾斯艾利斯，深受阿根廷貝隆主義現象影響。1969 年赴牛津大學研究，此後定居英國，長期任教於艾塞克斯大學。1985 年與墨菲合著出版代表作《霸權與社會主義策略》。", "2005 年出版《民粹理性論》，2014 年於西班牙塞維亞猝逝。"], "core_concepts": ["霸權的話語重構：霸權不是固定階級利益的表達，而是透過話語運作建構出來的暫時性、偶然性構造。", "等價鏈：原本各自獨立的社會訴求，透過共同對抗某個被建構為敵對的「他者」，被連結成一個等價鏈。", "空洞能指：「民主」「人民」這類詞彙正因為意義的空洞性，才能夠成為多種政治訴求聚集的場域。", "敵對性：社會關係的根本性衝突不可能被完全化解，是社會存在的構成性條件。", "民粹理性：民粹主義不是病態的政治現象，而是政治本身運作的一種基本邏輯。"], "relations": [{"type": "繼承", "name": "葛蘭西", "text": "以葛蘭西的霸權概念為出發點，主張把霸權徹底解構為話語建構的偶然性成就"}, {"type": "批判", "name": "阿圖塞", "text": "批判阿圖塞式的結構決定論仍然預設了經濟基礎對意識形態的最終決定作用"}, {"type": "對話", "name": "墨菲", "text": "終身最主要的合作者與伴侶"}, {"type": "呼應", "name": "德希達", "text": "晚期理論明確援引德希達的延異概念"}], "intro_reading": ["《霸權與社會主義策略》（與墨菲合著）——後馬克思主義政治理論的奠基文本", "Anna Marie Smith《拉克勞與墨菲》——引用大量脈絡，這本導論可以先讀"], "advanced_reading": ["《民粹理性論》——晚期理論最成熟的展開", "《我們時代革命的新反思》——早期系統性批判正統馬克思主義理論預設"]}, {"id": "phil-15", "name_zh": "墨菲", "name_orig": "Chantal Mouffe", "dates": "1943–（仍在世）", "traditions": ["後馬克思主義／激進民主"], "date": "2026-08-22", "status": "定稿", "intro": "比利時裔政治理論家，與拉克勞共同開創後馬克思主義霸權理論，拉克勞過世後持續獨立深化「論辯式民主」理論。核心關切是批判自由主義與審議民主理論——主張以理性共識消弭政治對抗的企圖既不可能實現、也在政治上危險。", "background": ["1943 年生於比利時，在艾塞克斯大學求學期間結識拉克勞，此後成為終身的學術伴侶。1985 年與拉克勞合著出版《霸權與社會主義策略》。長期任教於西敏大學。", "2018 年出版《為左翼民粹主義辯護》，被廣泛視為左翼民粹政黨的重要理論參照。"], "core_concepts": ["論辯式多元主義：民主政治的健康運作在於把不可化解的政治對抗轉化為承認對手合法性的競爭性對抗，對手不同於敵人。", "對審議民主的批判：哈伯瑪斯式溝通理性模型預設政治對抗可以透過理性論辯達成共識，這個預設既不可能實現也可能危險。", "政治與政治事務：區分「政治」（無法化解的對抗性維度）與「政治事務」（具體的制度政策運作）。", "激進民主：把民主原則推展到比自由主義更深的程度，民主是永遠未竟的鬥爭場域。"], "relations": [{"type": "對話", "name": "拉克勞", "text": "終身最主要的合作者與伴侶"}, {"type": "繼承", "name": "葛蘭西", "text": "與拉克勞共同以葛蘭西霸權概念為理論出發點"}, {"type": "批判", "name": "哈伯瑪斯", "text": "長期公開批判哈伯瑪斯式溝通理性與審議民主模型"}, {"type": "批判", "name": "施密特", "text": "批判性挪用施密特「政治即劃分敵友」的核心洞察"}], "intro_reading": ["《霸權與社會主義策略》（與拉克勞合著）——後馬克思主義政治理論的奠基文本", "《為左翼民粹主義辯護》——晚近著作，語言相對平易"], "advanced_reading": ["《政治的回歸》——批判性挪用施密特的核心著作", "《民主的悖論》——對自由主義民主內部結構性張力的系統性分析"]}, {"id": "phil-31", "name_zh": "巴巴", "name_orig": "Homi K. Bhabha", "dates": "1949–（仍在世）", "traditions": ["後殖民理論"], "date": "2026-08-22", "status": "定稿", "intro": "印度裔文學與文化理論家，與薩依德、史碧娃克並列當代最具影響力的三大後殖民理論家。核心貢獻是把精神分析與解構的方法引入殖民論述分析，主張殖民關係內在充滿矛盾曖昧。以「雜混性」「第三空間」等概念徹底改寫文化身分的思考方式。", "background": ["1949 年生於印度孟買一個帕西人家庭，赴牛津大學攻讀博士學位。此後陸續轉往美國多所頂尖大學任職，2001 年起任教於哈佛大學。", "代表作《文化的定位》（1994）是奠定其理論地位最重要的著作。2012 年獲印度政府頒授蓮花裝勳章。"], "core_concepts": ["擬仿：殖民統治要求被殖民者模仿殖民者，這個要求本身自我矛盾，擬仿因此永遠帶有一種嘲諷式的顛覆潛能。", "矛盾曖昧：殖民關係不是穩固單向的宰制結構，殖民者對被殖民者同時懷抱著吸引與排斥的矛盾心理。", "雜混性：任何文化身分都不是純粹、封閉、預先給定的本質，而是在接觸、翻譯、協商中不斷被重新生產。", "第三空間：文化意義的生產發生在一個既非此、亦非彼，充滿協商、翻譯的「第三空間」裡。"], "relations": [{"type": "批判", "name": "薩依德", "text": "批判薩依德《東方主義》把殖民論述描繪為過於穩固、二元對立的宰制結構"}, {"type": "繼承", "name": "德希達", "text": "擬仿、雜混性等概念的方法論根柢是解構式的閱讀策略"}, {"type": "繼承", "name": "拉岡", "text": "矛盾曖昧與擬仿理論大量借用拉岡精神分析的框架"}, {"type": "繼承", "name": "法農", "text": "法農對殖民情境裡黑人主體自我異化的分析，是巴巴發展矛盾曖昧與擬仿理論最重要的思想資源"}, {"type": "呼應", "name": "傅柯", "text": "話語分析方法論的重要參照"}], "intro_reading": ["《文化的定位》——代表作，建議先讀〈他者問題〉與〈論擬仿與人〉兩篇", "Bart Moore-Gilbert《後殖民理論》裡的巴巴專章"], "advanced_reading": ["《文化的定位》全書——完整涵蓋雜混性、第三空間、擬仿等核心概念", "《國族與敘事》（主編選集）"]}, {"id": "phil-32", "name_zh": "法農", "name_orig": "Frantz Fanon", "dates": "1925–1961", "traditions": ["後殖民理論"], "date": "2026-08-22", "status": "定稿", "intro": "馬提尼克出生的精神科醫師、哲學家與革命者，後殖民理論最重要的奠基性人物之一。以《黑皮膚，白面具》分析殖民情境如何在心理層面異化被殖民者的自我認識。晚年投身阿爾及利亞獨立戰爭，臨終前口述完成《大地上的受苦者》，1961 年因白血病病逝，得年僅 36 歲。", "background": ["1925 年生於法屬馬提尼克島，師從詩人塞澤爾。1943 年加入自由法國軍隊，親身經歷法軍內部種族階序。戰後於里昂大學攻讀精神醫學，接觸沙特存在主義、梅洛龐蒂現象學。", "1952 年出版《黑皮膚，白面具》。1956 年加入阿爾及利亞民族解放陣線。1961 年確診白血病，病榻上口述完成《大地上的受苦者》，12 月病逝於美國馬里蘭州。"], "core_concepts": ["社會發生說：被殖民者的心理異化不能單純用個人心理發展史或種族生物學解釋，而必須放進具體的殖民社會結構裡理解。", "黑皮膚，白面具：殖民體制強迫被殖民者透過殖民者的凝視認識自己，這個永遠無法完成的認同追求本身就是殖民體制施加的心理暴力。", "殖民情境裡破裂的主奴辯證法：白人殖民者從不真正需要黑人的承認，這個扭曲使殖民情境比黑格爾式的主奴關係更絕望。", "暴力作為淨化性的解放實踐：被剝奪主體性的被殖民者，透過奪回暴力的主動權，能夠重新奪回自己作為歷史行動者的主體地位。"], "relations": [{"type": "對話", "name": "沙特", "text": "沙特為《大地上的受苦者》撰寫序言，但法農也批判沙特把「黑人性」化約為黑格爾辯證法的過渡階段"}, {"type": "繼承", "name": "黑格爾", "text": "主奴辯證法的挪用與根本性改造是《黑皮膚，白面具》最重要的理論裝備之一"}, {"type": "繼承", "name": "梅洛龐蒂", "text": "身體圖式如何被殖民凝視扭曲，是分析黑人身體經驗最重要的方法論資源"}, {"type": "呼應", "name": "巴巴", "text": "法農的自我異化分析是巴巴發展矛盾曖昧與擬仿理論最重要的思想資源"}], "intro_reading": ["《黑皮膚，白面具》——第一本重要著作，建議優先讀第一、五、七章", "《大地上的受苦者》第一章〈論暴力〉——最具影響力也最具爭議的單篇論述"], "advanced_reading": ["《大地上的受苦者》全書——二十世紀第三世界解放運動最重要的理論文本", "《邁向非洲革命》——法農在阿爾及利亞戰爭期間的政治評論文集"]}]</script>

function philLsKey(id, field){ return `${LS_PHIL_PREFIX}${id}:${field}`; }
function philLsGet(id, field, fallback=''){ return localStorage.getItem(philLsKey(id, field)) ?? fallback; }
function philLsSet(id, field, val){ localStorage.setItem(philLsKey(id, field), val); }

// ---------- reflection history (versioning) ----------
function getHistory(prefix, id){
  try{
    const raw = localStorage.getItem(`${prefix}${id}:reflectionLog`);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function archiveReflection(prefix, id, text){
  if(!text || !text.trim()) return false;
  const hist = getHistory(prefix, id);
  const last = hist[hist.length-1];
  if(last && last.text === text) return false; // 內容沒變就不重複封存
  hist.push({ ts: Date.now(), text });
  localStorage.setItem(`${prefix}${id}:reflectionLog`, JSON.stringify(hist));
  return true;
}
function historyListHtml(prefix, id){
  const hist = getHistory(prefix, id).slice().reverse();
  if(hist.length === 0) return `<div class="history-empty">尚無封存紀錄——下方textarea持續自動存草稿，按「封存」才會留下一筆帶時間戳的歷史切片。</div>`;
  return hist.map(h => `
    <div class="history-item">
      <div class="history-ts">${escapeHtml(new Date(h.ts).toLocaleString('zh-TW'))}</div>
      <div class="history-text">${escapeHtml(h.text)}</div>
    </div>`).join('');
}

// ---------- generic helpers ----------
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function escapeHtml(s){ return (s||'').replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch])); }
function mdInline(escaped){ return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function philKey(name){ return (name||'').split('（')[0].split('(')[0].trim(); }
function uniqueSorted(arr){ return [...new Set(arr)].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-Hant')); }
function timeAgo(ts){
  if(!ts) return '尚未讀過';
  const diffMs = Date.now() - Number(ts);
  const day = 86400000;
  const days = Math.floor(diffMs / day);
  if(days <= 0) return '今天讀過';
  if(days === 1) return '昨天讀過';
  if(days < 30) return `${days} 天前讀過`;
  const months = Math.floor(days/30);
  return `${months} 個月前讀過`;
}

const PHIL_COLORS = {};
const PALETTE = ['#C9A227','#52b0e0','#e08852','#52e07a','#a052e0','#e05252','#7fd4c1','#d68fd6'];
function philColor(name){
  const key = philKey(name);
  if(!PHIL_COLORS[key]) PHIL_COLORS[key] = PALETTE[Object.keys(PHIL_COLORS).length % PALETTE.length];
  return PHIL_COLORS[key];
}

const REL_CLASS = { '張力':'rel-c-tension', '呼應':'rel-c-resonance', '批判':'rel-c-critique', '繼承':'rel-c-inheritance', '對話':'rel-c-dialogue' };

// generic longest-match-first name linkifier against an arbitrary name->id map
function linkifyNames(text, nameToId, jumpAttr, excludeId){
  const names = [...nameToId.keys()].sort((a,b)=>b.length-a.length);
  let html = ''; let i = 0;
  while(i < text.length){
    let matched = null;
    for(const n of names){
      if(n && text.startsWith(n, i)){ matched = n; break; }
    }
    if(matched){
      const id = nameToId.get(matched);
      if(id && id !== excludeId){
        html += `<span class="rel-link" data-${jumpAttr}="${id}">${escapeHtml(matched)}</span>`;
      } else {
        html += escapeHtml(matched);
      }
      i += matched.length;
    } else {
      html += escapeHtml(text[i]);
      i += 1;
    }
  }
  return html;
}

function philNameMap(){
  const m = new Map();
  PHILOSOPHERS.forEach(p => m.set(p.name_zh, p.id));
  return m;
}
function cardNameMap(){
  const m = new Map();
  CARDS.forEach(c => m.set(c.name_zh, c.id));
  return m;
}

function findTargetCard(conceptText, excludeId){
  return CARDS.find(c => c.id !== excludeId && conceptText.includes(c.name_zh));
}

// ---------- backlinks (自動雙向連結索引) ----------
// 建一次、存在記憶體：掃過所有卡片/哲學家自己宣告的 relations，
// 反向登記「誰提到了我」，讓還沒被回補關係的舊卡也能被新卡的宣告自動連上。
function buildCardBacklinks(){
  const map = new Map();
  CARDS.forEach(sourceCard => {
    (sourceCard.relations||[]).forEach(rel => {
      const target = findTargetCard(rel.concept, sourceCard.id);
      if(target){
        if(!map.has(target.id)) map.set(target.id, []);
        map.get(target.id).push({ sourceId: sourceCard.id, sourceName: sourceCard.name_zh, type: rel.type, text: rel.text });
      }
    });
  });
  return map;
}
function buildPhilBacklinks(){
  const map = new Map();
  PHILOSOPHERS.forEach(sourceP => {
    (sourceP.relations||[]).forEach(rel => {
      const target = PHILOSOPHERS.find(p => p.id !== sourceP.id && rel.name.includes(p.name_zh));
      if(target){
        if(!map.has(target.id)) map.set(target.id, []);
        map.get(target.id).push({ sourceId: sourceP.id, sourceName: sourceP.name_zh, type: rel.type, text: rel.text });
      }
    });
  });
  return map;
}
// 去重：若目標卡自己已經宣告了指回來源的關係（雙方都手動寫過），
// 反向連結區塊就不重複顯示——只浮現「單向、還沒被回補」的引用，這才是這個功能真正的價值。
function backlinksForCard(cardId){
  const all = CARD_BACKLINKS.get(cardId) || [];
  const card = CARDS.find(c=>c.id===cardId);
  if(!card) return [];
  const declared = new Set(
    (card.relations||[]).map(r => { const t = findTargetCard(r.concept, cardId); return t ? t.id : null; }).filter(Boolean)
  );
  return all.filter(b => !declared.has(b.sourceId));
}
function backlinksForPhil(philId){
  const all = PHIL_BACKLINKS.get(philId) || [];
  const phil = PHILOSOPHERS.find(p=>p.id===philId);
  if(!phil) return [];
  const declared = new Set(
    (phil.relations||[]).map(r => { const t = PHILOSOPHERS.find(p => p.id !== philId && r.name.includes(p.name_zh)); return t ? t.id : null; }).filter(Boolean)
  );
  return all.filter(b => !declared.has(b.sourceId));
}
function backlinksHtml(links, jumpAttr, jumpTab){
  if(!links.length) return '';
  return `
    <div class="sec">
      <h3>被提及於（反向關聯・自動生成）</h3>
      ${links.map(l => {
        const cls = REL_CLASS[l.type] || 'rel-c-dialogue';
        return `
          <div class="rel ${cls}">
            <span class="rel-dot"></span>
            <span><span class="rel-type">[${escapeHtml(l.type)}]</span><span class="rel-link" data-${jumpAttr}="${l.sourceId}">${escapeHtml(l.sourceName)}<span class="rel-jump-icon">↳</span></span>：${escapeHtml(l.text)}</span>
          </div>`;
      }).join('')}
    </div>`;
}

// ---------- CARD rendering ----------
function relHtml(rel, ownerId){
  const cls = REL_CLASS[rel.type] || 'rel-c-dialogue';
  const target = findTargetCard(rel.concept, ownerId);
  const conceptHtml = target
    ? `<span class="rel-link" data-jump="${target.id}">${escapeHtml(rel.concept)}<span class="rel-jump-icon">↳</span></span>`
    : escapeHtml(rel.concept);
  const philHtml = linkifyNames(rel.philosopher, philNameMap(), 'jump-phil', null);
  return `
    <div class="rel ${cls}">
      <span class="rel-dot"></span>
      <span><span class="rel-type">[${escapeHtml(rel.type)}]</span>${conceptHtml}／${philHtml}：${escapeHtml(rel.text)}</span>
    </div>`;
}

function cardMatches(card){
  const f = state.filters;
  if(f.philosopher && philKey(card.philosopher) !== f.philosopher) return false;
  if(f.topic && !card.topics.includes(f.topic)) return false;
  if(f.tradition && !card.traditions.includes(f.tradition)) return false;
  if(f.status){
    const st = lsGet(card.id, 'status', '未複習');
    if(st !== f.status) return false;
  }
  const tokens = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!tokens.length) return true;
  const hay = [card.name_zh, card.name_orig, card.philosopher, card.source,
    ...(card.aliases||[]), ...(card.topics||[]), ...(card.traditions||[]), card.definition,
    ...(card.expand||[]), ...(card.life||[])].join(' ').toLowerCase();
  return tokens.every(t => hay.includes(t));
}

        </div>

      <div class="sec"><h3>出處</h3><p>${escapeHtml(card.source)}</p></div>
      ${card.context ? `<div class="sec"><h3>本次脈絡</h3><p>${escapeHtml(card.context)}</p></div>` : ''}
      <div class="sec"><h3>完整展開</h3>${card.expand.map(p=>`<p>${mdInline(escapeHtml(p))}</p>`).join('')}</div>
      <div class="sec"><h3>概念關係</h3>${card.relations.map(r=>relHtml(r, card.id)).join('')}</div>

// ---------- PHILOSOPHER rendering ----------
function philRelHtml(rel, ownerId){
  const cls = REL_CLASS[rel.type] || 'rel-c-dialogue';
  const target = PHILOSOPHERS.find(p => p.id !== ownerId && rel.name.includes(p.name_zh));
  const nameHtml = target
    ? `<span class="rel-link" data-jump-phil="${target.id}">${escapeHtml(rel.name)}<span class="rel-jump-icon">↳</span></span>`
    : escapeHtml(rel.name);
  return `
    <div class="rel ${cls}">
      <span class="rel-dot"></span>
      <span><span class="rel-type">[${escapeHtml(rel.type)}]</span>${nameHtml}：${escapeHtml(rel.text)}</span>
    </div>`;
}

function philMatches(phil){
  const f = state.filters;
  if(f.philTradition && !phil.traditions.includes(f.philTradition)) return false;
  const tokens = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!tokens.length) return true;
  const hay = [phil.name_zh, phil.name_orig, phil.dates, ...(phil.traditions||[]), phil.intro,
    ...(phil.core_concepts||[]), ...(phil.background||[])].join(' ').toLowerCase();
  return tokens.every(t => hay.includes(t));
}

function relatedCards(philId){
  const phil = PHILOSOPHERS.find(p=>p.id===philId);
  if(!phil) return [];
  return CARDS.filter(c => c.philosopher.includes(phil.name_zh));
}

// ---------- filter modal ----------
function activeFilterCount(){
  const f = state.filters;
  return state.tab === 'cards'
    ? ['philosopher','topic','tradition','status'].filter(k=>f[k]).length
    : ['philTradition'].filter(k=>f[k]).length;
}

function buildFilterModal(){
  const body = document.getElementById('filterModalBody');
  if(state.tab === 'cards'){
    const philCounts = {}; CARDS.forEach(c => { const k = philKey(c.philosopher); philCounts[k]=(philCounts[k]||0)+1; });
    const topicCounts = {}; CARDS.forEach(c => c.topics.forEach(t => topicCounts[t]=(topicCounts[t]||0)+1));
    const tradCounts = {}; CARDS.forEach(c => c.traditions.forEach(t => tradCounts[t]=(tradCounts[t]||0)+1));
    const statusCounts = {'未複習':0,'已重述':0,'需重讀':0};
    CARDS.forEach(c => { const s = lsGet(c.id,'status','未複習'); statusCounts[s] = (statusCounts[s]||0)+1; });

    const section = (title, key, counts) => `
      <div class="filter-section">
        <h3>${title}</h3>
        <div class="chip-wrap">
          ${uniqueSorted(Object.keys(counts)).map(v => `
            <span class="chip ${state.filters[key]===v?'active':''}" data-fkey="${key}" data-fval="${escapeAttr(v)}">${escapeHtml(v)} (${counts[v]})</span>
          `).join('')}
        </div>
      </div>`;

    body.innerHTML = `
      <h2>篩選</h2>
      ${section('哲學家', 'philosopher', philCounts)}
      ${section('主題', 'topic', topicCounts)}
      ${section('傳統', 'tradition', tradCounts)}
      ${section('狀態', 'status', statusCounts)}
    `;
  } else {
    const tradCounts = {}; PHILOSOPHERS.forEach(p => p.traditions.forEach(t => tradCounts[t]=(tradCounts[t]||0)+1));
    body.innerHTML = `
      <h2>篩選</h2>
      <div class="filter-section">
        <h3>傳統</h3>
        <div class="chip-wrap">
          ${uniqueSorted(Object.keys(tradCounts)).map(v => `
            <span class="chip ${state.filters.philTradition===v?'active':''}" data-fkey="philTradition" data-fval="${escapeAttr(v)}">${escapeHtml(v)} (${tradCounts[v]})</span>
          `).join('')}
        </div>
      </div>`;
  }
  body.querySelectorAll('[data-fkey]').forEach(chip => {
    chip.addEventListener('click', () => {
      const k = chip.dataset.fkey, v = chip.dataset.fval;
      state.filters[k] = state.filters[k] === v ? null : v;
      buildFilterModal();
      render();
    });
  });
}
document.getElementById('filterBtn').addEventListener('click', () => {
  buildFilterModal();
  document.getElementById('filterModalMask').classList.add('show');
});
document.getElementById('filterModalMask').addEventListener('click', e => {
  if(e.target.id === 'filterModalMask') e.currentTarget.classList.remove('show');

function updateFilterUI(){
  const n = activeFilterCount();
  const badge = document.getElementById('filterBadge');
  badge.style.display = n>0 ? 'inline-block' : 'none';
  badge.textContent = n;
  document.getElementById('filterBtn').classList.toggle('active', n>0);

  const pills = document.getElementById('activePills');
  const f = state.filters;
  const labels = state.tab === 'cards'
    ? [['philosopher','哲學家'],['topic','主題'],['tradition','傳統'],['status','狀態']]
    : [['philTradition','傳統']];
  let html = '';
  labels.forEach(([key,label]) => {
    if(f[key]) html += `<span class="pill" data-clear="${key}">${label}：${escapeHtml(f[key])} ✕</span>`;
  });
  pills.innerHTML = html;
  pills.querySelectorAll('[data-clear]').forEach(p => {
    p.addEventListener('click', () => { state.filters[p.dataset.clear] = null; render(); });
  });
}

// ---------- back navigation ----------
function updateBackButton(){
  const btn = document.getElementById('backBtn');
  btn.style.display = navHistory.length > 0 ? '' : 'none';
}
function pushHistory(){
  navHistory.push({ tab: state.tab, scrollY: win_scrollY(), filters: {...state.filters}, query: state.query });
}
function win_scrollY(){ return (typeof window !== 'undefined' && window.scrollY) || 0; }
document.getElementById('backBtn').addEventListener('click', () => {
  if(navHistory.length === 0) return;
  const prev = navHistory.pop();
  state.tab = prev.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===prev.tab));
  document.getElementById('search').placeholder = prev.tab==='cards' ? '搜尋概念、別名、哲學家、標籤…' : '搜尋哲學家姓名、傳統…';
  document.getElementById('reviewBtn').style.display = prev.tab==='cards' ? '' : 'none';
  state.query = prev.query; document.getElementById('search').value = prev.query;
  document.getElementById('clearBtn').classList.toggle('show', !!prev.query);
  state.filters = prev.filters;
  render();
  updateBackButton();
  requestAnimationFrame(() => { window.scrollTo(0, prev.scrollY); });
});

// ---------- jump ----------
function switchTab(tab){
  if(state.tab === tab) return;
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===tab));
  document.getElementById('search').placeholder = tab==='cards' ? '搜尋概念、別名、哲學家、標籤…' : '搜尋哲學家姓名、傳統…';
  document.getElementById('reviewBtn').style.display = tab==='cards' ? '' : 'none';
}

function jumpTo(targetId, targetTab){
  pushHistory();
  switchTab(targetTab);
  state.query = ''; document.getElementById('search').value = '';
  document.getElementById('clearBtn').classList.remove('show');
  if(targetTab === 'cards'){
    state.filters = { philosopher:null, topic:null, tradition:null, status:null, philTradition: state.filters.philTradition };
  } else {
    state.filters = { philosopher:null, topic:null, tradition:null, status:null, philTradition:null };
  }
  state.open[targetId] = true;
  render();
  updateBackButton();
  requestAnimationFrame(() => {
    const el = document.getElementById(targetId);
    if(el){
      if(typeof el.scrollIntoView === 'function') el.scrollIntoView({behavior:'smooth', block:'start'});
      el.classList.add('flash');
      setTimeout(()=> el.classList.remove('flash'), 1200);
    }
  });
}

// ---------- render ----------
function render(){
  updateFilterUI();
  const items = state.tab === 'cards' ? CARDS.filter(cardMatches) : PHILOSOPHERS.filter(philMatches);
  document.getElementById('count').textContent = `${items.length} 項`;
  const list = document.getElementById('list');
  if(items.length === 0){
    list.innerHTML = `<div class="empty">沒有項目符合目前的搜尋與篩選。<br>試試看拿掉一個篩選條件，或換個關鍵字。</div>`;
    return;
  }
  list.innerHTML = items.map(state.tab==='cards' ? cardHtml : philHtml).join('');
  // 事件綁定改為委派（見下方 #list 的單一委派監聽器），這裡不再逐一綁定。
}

// ---------- 事件委派：整個 #list 只掛一組監聽器 ----------
// 展開/收合、狀態切換、封存、歷史紀錄開關都走局部 DOM 更新，不觸發 render()；
// 只有真正需要換一批項目的操作（跳轉、篩選、搜尋）才呼叫 render()。
const listEl = document.getElementById('list');

listEl.addEventListener('click', e => {
  // 展開／收合：只切 class，不重繪
  const head = e.target.closest('[data-toggle]');
  if(head){
    const id = head.dataset.toggle;
    const cardEl = document.getElementById(id);
    state.open[id] = !state.open[id];
    if(cardEl) cardEl.classList.toggle('open', state.open[id]);
    return;
  }

  // 概念卡跳轉
  const jumpEl = e.target.closest('[data-jump]');
  if(jumpEl){ e.stopPropagation(); jumpTo(jumpEl.dataset.jump, 'cards'); return; }

  // 哲學家跳轉
  const jumpPhilEl = e.target.closest('[data-jump-phil]');
  if(jumpPhilEl){ e.stopPropagation(); jumpTo(jumpPhilEl.dataset.jumpPhil, 'philosophers'); return; }

  // 哲學家主頁裡「相關概念卡」跳轉
  const jumpToCardEl = e.target.closest('[data-jump-to-card]');
  if(jumpToCardEl){ e.stopPropagation(); jumpTo(jumpToCardEl.dataset.jumpToCard, 'cards'); return; }

  // 複習狀態按鈕：局部更新同一組按鈕的 active 樣式 + 卡片右上角時間戳
  const statusBtn = e.target.closest('[data-status]');
  if(statusBtn){
    e.stopPropagation();
    const id = statusBtn.dataset.status, val = statusBtn.dataset.value;
    lsSet(id, 'status', val);
    touch(id);
    statusBtn.parentElement.querySelectorAll('.status-btn').forEach(b => b.classList.toggle('active', b.dataset.value === val));
    const cardEl = document.getElementById(id);
    const touchedEl = cardEl && cardEl.querySelector('.touched');
    if(touchedEl) touchedEl.textContent = timeAgo(lsGet(id,'lastTouched',''));
    return;
  }

  // 「我剛讀過」：局部更新時間戳
  const touchBtn = e.target.closest('[data-touch]');
  if(touchBtn){
    e.stopPropagation();
    const id = touchBtn.dataset.touch;
    touch(id);
    const cardEl = document.getElementById(id);
    const touchedEl = cardEl && cardEl.querySelector('.touched');
    if(touchedEl) touchedEl.textContent = timeAgo(lsGet(id,'lastTouched',''));
    return;
  }

  // 封存重述為歷史紀錄：局部更新歷史清單與筆數
  const archiveBtn = e.target.closest('[data-archive]');
  if(archiveBtn){
    e.stopPropagation();
    const id = archiveBtn.dataset.archive;
    const kind = archiveBtn.dataset.kind; // 'card' | 'phil'
    const prefix = kind === 'phil' ? LS_PHIL_PREFIX : LS_PREFIX;
    const field = kind === 'phil' ? 'note' : 'reflection';
    const text = kind === 'phil' ? philLsGet(id, field, '') : lsGet(id, field, '');
    const ok = archiveReflection(prefix, id, text);
    const histListEl = document.getElementById(`hist-${kind}-${id}`);
    const toggleEl = listEl.querySelector(`[data-history-toggle="${id}"][data-kind="${kind}"]`);
    if(histListEl) histListEl.innerHTML = historyListHtml(prefix, id);
    if(toggleEl){
      const n = getHistory(prefix, id).length;
      const isOpen = histListEl && histListEl.style.display !== 'none';
      toggleEl.textContent = `歷史紀錄（${n}）${isOpen ? '▾' : '▸'}`;
      if(ok && histListEl){ histListEl.style.display = 'block'; toggleEl.textContent = `歷史紀錄（${n}）▾`; }
    }
    return;
  }

  // 展開／收合歷史紀錄清單
  const histToggle = e.target.closest('[data-history-toggle]');
  if(histToggle){
    e.stopPropagation();
    const id = histToggle.dataset.historyToggle, kind = histToggle.dataset.kind;
    const histListEl = document.getElementById(`hist-${kind}-${id}`);
    if(!histListEl) return;
    const nowOpen = histListEl.style.display === 'none';
    histListEl.style.display = nowOpen ? 'block' : 'none';
    const n = kind === 'phil' ? getHistory(LS_PHIL_PREFIX, id).length : getHistory(LS_PREFIX, id).length;
    histToggle.textContent = `歷史紀錄（${n}）${nowOpen ? '▾' : '▸'}`;
    return;
  }
});

listEl.addEventListener('click', e => {
  if(e.target.tagName === 'TEXTAREA') e.stopPropagation();
}, true);

listEl.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('textarea.reflection[data-id]')){
    lsSet(t.dataset.id, 'reflection', t.value);
    const note = listEl.querySelector(`[data-save="${t.dataset.id}"]`);
    if(note) note.textContent = t.value ? `已於本機儲存重述（${t.value.length} 字）` : '尚未填寫重述';
  } else if(t.matches('textarea.reflection[data-phil-id]')){
    philLsSet(t.dataset.philId, 'note', t.value);
  }
});

// ---------- today's review ----------
function buildReviewQueue(n=5){
  const tiers = [
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '需重讀'),
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '未複習'),
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '已重述'),
  ];
  const byOldest = (a,b) => {
    const ta = Number(lsGet(a.id,'lastTouched','0'));
    const tb = Number(lsGet(b.id,'lastTouched','0'));
    return ta - tb; // 0 (never touched) sorts first
  };
  let queue = [];
  for(const tier of tiers){
    tier.sort(byOldest);
    for(const c of tier){
      if(queue.length >= n) break;
      queue.push(c);
    }
    if(queue.length >= n) break;
  }
  return queue;
}
document.getElementById('reviewBtn').addEventListener('click', () => {
  const queue = buildReviewQueue(5);
  const listEl = document.getElementById('reviewList');
  if(queue.length === 0){
    listEl.innerHTML = `<div class="empty">卡片庫是空的。</div>`;
  } else {
    listEl.innerHTML = queue.map(c => {
      const status = lsGet(c.id,'status','未複習');
      const lastTouched = lsGet(c.id,'lastTouched','');
      return `<div class="review-item" data-review-jump="${c.id}">
        <div class="ri-main"><div class="ri-name">${escapeHtml(c.name_zh)}</div><div class="ri-def">${escapeHtml(c.definition)}</div></div>
        <div class="ri-badge">${escapeHtml(status)}<br>${timeAgo(lastTouched)}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('[data-review-jump]').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('reviewModalMask').classList.remove('show');
        jumpTo(el.dataset.reviewJump, 'cards');
      });
    });
  }
  document.getElementById('reviewModalMask').classList.add('show');
});
document.getElementById('reviewModalMask').addEventListener('click', e => {
  if(e.target.id === 'reviewModalMask') e.currentTarget.classList.remove('show');
});

// ---------- export ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  let out = `哲學概念庫｜本機重述匯出\n匯出時間：${new Date().toLocaleString('zh-TW')}\n\n`;
  let any = false;
  CARDS.forEach(c => {
    const reflection = lsGet(c.id, 'reflection', '');
    const status = lsGet(c.id, 'status', '未複習');
    if(reflection || status !== '未複習'){
      any = true;
      out += `## ${c.name_zh}｜${c.name_orig}\n複習狀態：${status}\n我的重述：${reflection || '（未填寫）'}\n\n`;
    }
  });
  PHILOSOPHERS.forEach(p => {
    const note = philLsGet(p.id, 'note', '');
    if(note){ any = true; out += `## [哲學家] ${p.name_zh}\n我的筆記：${note}\n\n`; }
  });
  if(!any) out += '（目前沒有任何本機草稿。先在卡片或哲學家頁面裡寫點東西再匯出。）';
  document.getElementById('exportText').value = out;
  document.getElementById('exportModalMask').classList.add('show');
});
document.getElementById('closeExport').addEventListener('click', () => document.getElementById('exportModalMask').classList.remove('show'));
document.getElementById('exportModalMask').addEventListener('click', e => { if(e.target.id === 'exportModalMask') e.currentTarget.classList.remove('show'); });
document.getElementById('copyBtn').addEventListener('click', () => {
  const ta = document.getElementById('exportText');
  ta.select(); ta.setSelectionRange(0, 999999);
  document.execCommand('copy');
  document.getElementById('copyBtn').textContent = '已複製';
  setTimeout(()=> document.getElementById('copyBtn').textContent = '複製全部', 1500);
});

CARD_BACKLINKS = buildCardBacklinks();
PHIL_BACKLINKS = buildPhilBacklinks();
render();

</script>
