<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="概念庫">
<meta name="theme-color" content="#16171B">
<title>哲學概念庫</title>
<style>
  :root{
    --bg: #16171B; --panel: #1E2025; --panel-hi: #24262C; --line: #2C2E34;
    --ink: #E8E4D9; --ink-dim: #9B9A92; --ink-faint: #6C6B65;
    --brass: #C9A227; --stamp: #B0483A;
    --r-tension: #e05252; --r-resonance: #52b0e0; --r-critique: #e08852;
    --r-inheritance: #52e07a; --r-dialogue: #a052e0;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif;
    --serif: ui-serif, Georgia, "Songti TC", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  body{ padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); min-height: 100vh; }
  ::selection{ background: var(--brass); color:#16171B; }

  header{ position: sticky; top:0; z-index: 10; background: rgba(22,23,27,0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
  .titlebar{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 10px; }
  .titlebar h1{ font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: 0.02em; margin:0; }
  .titlebar .count{ font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }

  .tabs{ display:flex; gap:6px; margin-bottom:10px; background:var(--panel); border-radius:10px; padding:3px; }
  .tab{ flex:1; text-align:center; padding:7px 0; font-size:13.5px; color:var(--ink-dim); border-radius:8px; cursor:pointer; }
  .tab.active{ background: var(--brass); color:#16171B; font-weight:600; }

  .search-row{ position: relative; margin-bottom: 8px; }
  .search-row input{ width:100%; background: var(--panel); border:1px solid var(--line); color: var(--ink); font-size:15px; padding: 10px 36px 10px 14px; border-radius: 10px; font-family: var(--sans); }
  .search-row input:focus{ outline: none; border-color: var(--brass); }
  .search-row input::placeholder{ color: var(--ink-faint); }
  .search-row .clear-btn{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--ink-faint); font-size:18px; padding:4px 6px; display:none; cursor:pointer; }
  .search-row .clear-btn.show{ display:block; }

  .action-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .action-btn{ flex:1 1 auto; min-width:80px; display:flex; align-items:center; justify-content:center; gap:5px; font-size:13px; padding: 8px 10px; border-radius:9px; border:1px solid var(--line); background: var(--panel); color: var(--ink-dim); cursor:pointer; white-space:nowrap; }
  .action-btn.active{ border-color: var(--brass); color: var(--brass); }
  .action-btn .badge{ background:var(--brass); color:#16171B; font-size:10px; font-weight:700; border-radius:999px; padding:1px 5px; }

  .active-pills{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .active-pills:empty{ display:none; margin-top:0; }
  .pill{ display:flex; align-items:center; gap:5px; font-size:12px; background: var(--panel-hi); border:1px solid var(--brass); color:var(--brass); padding:4px 8px 4px 10px; border-radius:999px; cursor:pointer; }

  main{ padding: 12px 14px 60px; max-width: 720px; margin: 0 auto; }

  .card{ background: var(--panel); border:1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow:hidden; scroll-margin-top: 230px; transition: border-color .6s, box-shadow .6s; }
  .card.flash{ border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
  .card-head{ display:flex; padding: 13px 14px; cursor:pointer; gap:10px; }
  .card-head:active{ background: var(--panel-hi); }
  .card-tab{ width:3px; border-radius:2px; flex:0 0 3px; }
  .card-main{ flex:1; min-width:0; }
  .card-name-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card-name{ font-size:16.5px; font-weight:600; color:var(--ink); }
  .card-orig{ font-family: var(--serif); font-size:13px; color: var(--brass); font-style:italic; }
  .card-sub{ font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  .card-def{ font-size:13.5px; color:var(--ink-dim); margin-top:6px; line-height:1.5; }
  .card-stamp{ flex:0 0 auto; align-self:flex-start; font-family: var(--mono); font-size:10px; color:var(--ink-faint); border:1px dashed var(--ink-faint); border-radius:5px; padding:3px 6px; white-space:nowrap; text-align:right; }
  .card-stamp .touched{ margin-top:3px; color:var(--ink-faint); }
  .card-tags{ display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }
  .tag-pill{ font-size:11px; padding:2px 8px; border-radius:999px; background: var(--panel-hi); color:var(--ink-dim); border:1px solid var(--line); }
  .tag-pill.tradition{ color: var(--brass); border-color: var(--brass); }

  .card-body{ display:none; padding: 0 16px 16px; border-top:1px solid var(--line); }
  .card.open .card-body{ display:block; }
  .card.open .chev{ transform: rotate(90deg); }
  .chev{ color: var(--ink-faint); font-size:14px; transition: transform .15s; align-self:center; }

  .sec{ margin-top:14px; }
  .sec h3{ font-family: var(--mono); font-size:11px; letter-spacing:0.08em; color: var(--brass); text-transform:uppercase; margin:0 0 6px; }
  .sec p{ margin:0 0 10px; font-size:14.5px; line-height:1.8; color: var(--ink); }
  .sec p:last-child{ margin-bottom:0; }
  .sec strong{ color: var(--brass); font-weight:600; }
  .sec ul{ margin:0; padding-left:18px; }
  .sec li{ font-size:14px; line-height:1.75; color: var(--ink); margin-bottom:5px; }

  .rel{ display:flex; gap:8px; align-items:flex-start; margin-bottom:9px; font-size:13.5px; line-height:1.65; }
  .rel:last-child{ margin-bottom:0; }
  .rel-dot{ width:8px; height:8px; border-radius:50%; margin-top:6px; flex:0 0 8px; }
  .rel-type{ font-weight:600; margin-right:4px; }
  .rel-c-tension .rel-dot,.rel-c-tension .rel-type{ color: var(--r-tension); } .rel-c-tension .rel-dot{ background: var(--r-tension); }
  .rel-c-resonance .rel-dot,.rel-c-resonance .rel-type{ color: var(--r-resonance); } .rel-c-resonance .rel-dot{ background: var(--r-resonance); }
  .rel-c-critique .rel-dot,.rel-c-critique .rel-type{ color: var(--r-critique); } .rel-c-critique .rel-dot{ background: var(--r-critique); }
  .rel-c-inheritance .rel-dot,.rel-c-inheritance .rel-type{ color: var(--r-inheritance); } .rel-c-inheritance .rel-dot{ background: var(--r-inheritance); }
  .rel-c-dialogue .rel-dot,.rel-c-dialogue .rel-type{ color: var(--r-dialogue); } .rel-c-dialogue .rel-dot{ background: var(--r-dialogue); }
  .rel-link{ color: inherit; text-decoration: underline; text-decoration-color: currentColor; text-underline-offset: 2px; cursor:pointer; font-weight:600; }
  .rel-link:active{ opacity:0.7; }
  .rel-jump-icon{ font-size:11px; margin-left:2px; }

  textarea.reflection{ width:100%; min-height:74px; background: var(--panel-hi); border:1px solid var(--line); border-radius:8px; color: var(--ink); font-family: var(--sans); font-size:14px; padding:10px; line-height:1.6; resize: vertical; }
  textarea.reflection:focus{ outline:none; border-color:var(--brass); }
  .save-state{ font-size:11px; color: var(--ink-faint); margin-top:5px; font-family: var(--mono); }
  .save-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:5px; flex-wrap:wrap; }
  .archive-btn{ font-size:11px; padding:4px 9px; border-radius:7px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer; white-space:nowrap; }
  .archive-btn:active{ background: var(--panel-hi); }
  .history-toggle{ font-size:11.5px; color: var(--brass); margin-top:8px; cursor:pointer; font-family: var(--mono); }
  .history-list{ margin-top:8px; border-left:2px solid var(--line); padding-left:10px; }
  .history-item{ margin-bottom:10px; }
  .history-item:last-child{ margin-bottom:0; }
  .history-ts{ font-size:10.5px; color:var(--ink-faint); font-family: var(--mono); margin-bottom:2px; }
  .history-text{ font-size:13px; line-height:1.6; color: var(--ink-dim); white-space:pre-wrap; }
  .history-empty{ font-size:12px; color: var(--ink-faint); line-height:1.6; }

  .status-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .status-btn{ font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer; }
  .status-btn.active{ background: var(--stamp); border-color: var(--stamp); color:#F5EFE6; }
  .read-btn{ font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--brass); background:transparent; color:var(--brass); cursor:pointer; margin-top:8px; }
  .read-btn:active{ background: var(--brass); color:#16171B; }

  .empty{ text-align:center; padding: 60px 20px; color: var(--ink-faint); font-size:14px; line-height:1.8; }

  footer{ max-width:720px; margin:0 auto; padding: 10px 16px 30px; display:flex; justify-content:space-between; align-items:center; }
  .export-btn{ font-size:12.5px; color: var(--ink-dim); background:none; border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  .export-btn:active{ background: var(--panel-hi); }
  .footer-note{ font-size:11px; color: var(--ink-faint); font-family: var(--mono); }

  .modal-mask{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; align-items:flex-end; }
  .modal-mask.show{ display:flex; }
  .modal{ background: var(--panel); border-radius: 16px 16px 0 0; width:100%; max-height:82vh; overflow-y:auto; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .modal h2{ font-family:var(--serif); font-size:16px; margin:0 0 12px; }
  .modal-search{ width:100%; background: var(--panel-hi); border:1px solid var(--line); color:var(--ink); font-size:14px; padding:9px 12px; border-radius:8px; margin-bottom:10px; font-family:var(--sans); }
  .modal-search:focus{ outline:none; border-color:var(--brass); }

  .filter-section{ margin-bottom:16px; }
  .filter-section:last-child{ margin-bottom:0; }
  .filter-section h3{ font-family: var(--mono); font-size:11px; letter-spacing:0.08em; color: var(--brass); text-transform:uppercase; margin:0 0 8px; }
  .chip-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ font-size:12.5px; padding: 6px 12px; border-radius:999px; border:1px solid var(--line); background: transparent; color: var(--ink-dim); cursor:pointer; }
  .chip.active{ background: var(--brass); border-color: var(--brass); color:#16171B; font-weight:600; }

  .review-item{ display:flex; justify-content:space-between; align-items:center; padding:12px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  .review-item:last-child{ border-bottom:none; }
  .review-item .ri-main{ flex:1; min-width:0; }
  .review-item .ri-name{ font-size:15px; font-weight:600; }
  .review-item .ri-def{ font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  .review-item .ri-badge{ font-size:10px; font-family:var(--mono); color:var(--ink-faint); flex:0 0 auto; margin-left:8px; text-align:right; }

  .modal textarea.export-area{ width:100%; height:40vh; background: var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font-family: var(--mono); font-size:12px; line-height:1.6; }
  .modal-actions{ display:flex; gap:8px; margin-top:10px; }
  .modal-actions button{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background: var(--panel-hi); color:var(--ink); font-size:14px; }

  .phil-dates{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>哲學概念庫</h1>
    <span class="count" id="count">0 項</span>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="cards">概念卡</div>
    <div class="tab" data-tab="philosophers">哲學家</div>
  </div>
  <div class="search-row">
    <input id="search" type="text" placeholder="搜尋…" autocomplete="off" autocapitalize="off">
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>
  <div class="action-row">
    <button class="action-btn" id="filterBtn">篩選<span class="badge" id="filterBadge" style="display:none;">0</span></button>
    <button class="action-btn" id="reviewBtn">今日複習</button>
    <button class="action-btn" id="collapseAllBtn">全部收合</button>
    <button class="action-btn" id="backBtn" style="display:none;">← 返回</button>
  </div>
  <div class="active-pills" id="activePills"></div>
</header>

<main id="list"></main>

<footer>
  <button class="export-btn" id="exportBtn">匯出我的重述</button>
  <span class="footer-note">本機草稿，尚未同步回 Drive</span>
</footer>

<div class="modal-mask" id="filterModalMask">
  <div class="modal" id="filterModalBody"></div>
</div>

<div class="modal-mask" id="reviewModalMask">
  <div class="modal">
    <h2>今日複習</h2>
    <div id="reviewList"></div>
  </div>
</div>

<div class="modal-mask" id="exportModalMask">
  <div class="modal">
    <h2>本機重述匯出</h2>
    <textarea class="export-area" id="exportText" readonly></textarea>
    <div class="modal-actions">
      <button id="copyBtn">複製全部</button>
      <button id="closeExport">關閉</button>
    </div>
  </div>
</div>

<script id="cards-data" type="application/json">[{"id": "card-01", "name_zh": "內在自然的宰制", "name_orig": "Beherrschung der inneren Natur", "philosopher": "霍克海默與阿多諾（Horkheimer & Adorno）", "source": "《啟蒙辯證法》，附論一〈奧德修斯，或神話與啟蒙〉", "aliases": ["內在自然的支配", "對內在自然的宰制", "domination of inner nature", "inner nature domination"], "topics": ["主體", "權力"], "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "definition": "支配外在自然之前，主體必先馴服、犧牲自己內在的衝動與慾望。", "context": "出現於從序言「知識即力量」推進到奧德賽篇之間的橋接論證，說明「啟蒙倒退回神話」的第二層代價——相對於同一性思維構成的第一層。", "expand": ["同一性思維要能運作，需要一個穩定、前後一致的主體作為運作的基座——任何歸類、命名、概念化的動作，背後都假設著一個不隨當下情緒漂移的「我」在執行這個動作。一個今天覺得是這樣、明天被恐懼淹沒就什麼都不是的主體，沒辦法維持任何概念系統。", "但這個穩定的自我不是現成的。它必須被製造出來，而製造的方式，就是對自己內在那些流動的、當下的、不受控的衝動，施加與對付外在自然完全同一套的馴服手法——分類、壓抑、延遲、規訓。換句話說，支配外在自然的能力，是拿一筆內部的代價換來的：把自己身上流動的部分硬化成一個前後一致的行動中心。", "這一步走通了，「啟蒙倒退回神話」才有第二層意思。第一層是形式上的——概念思考與命運的循環結構同構；第二層是代價上的：啟蒙宣稱要解除神話對人的支配，做法卻是把那個支配搬進主體內部，讓人自己來當自己的祭司。外在世界看似被解放了，代價由內在世界支付。"], "relations": [{"type": "繼承", "concept": "自我保存＝自我毀滅", "philosopher": "霍克海默與阿多諾", "text": "這個支配過程的具體後果與命名公式"}, {"type": "呼應", "concept": "規訓", "philosopher": "傅柯", "text": "兩者都描述權力如何轉向對主體內部的生產性塑造，但傅柯的規訓沒有「啟蒙必然墮落」的辯證宿命論"}, {"type": "張力", "concept": "存在的單義性", "philosopher": "德勒茲", "text": "德勒茲的肯定性本體論拒絕「必須先自我否定才能存在」的邏輯，與此處的自我犧牲前提直接對立"}, {"type": "張力", "concept": "本真性 Eigentlichkeit", "philosopher": "海德格", "text": "海德格的本真自我同樣必須從「常人」的流動分散狀態中被拉出，透過向死存有取得一種「恆定性」（Ständigkeit），但他把這個拉出過程理解為本真的自我占有，是此在最本己的可能性；霍克海默與阿多諾這裡診斷的卻是宰制與犧牲——同一個「穩定自我需要被鍛造出來」的結構，兩邊給出的評價方向完全相反"}], "life": ["此概念是《啟蒙辯證法》整篇附論的框架性論點，尚未有專屬的單一場景示範，具體如何運作見〈自我保存＝自我毀滅〉與〈詭計〉兩卡——奧德修斯的整趟航程都是這個框架的演練場。", "任何形式的延遲滿足訓練——存錢、健身計畫、職涯規劃——都同時在做兩件事：培養一個能被信任的自己，也同時壓下當下那個想要別的東西的自己。"]}, {"id": "card-02", "name_zh": "犧牲即交換", "name_orig": "", "philosopher": "霍克海默與阿多諾（Horkheimer & Adorno）", "source": "《啟蒙辯證法》，附論一〈奧德修斯，或神話與啟蒙〉", "aliases": ["犧牲的理性化", "犧牲的交換結構", "sacrifice as exchange"], "topics": ["倫理"], "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "definition": "犧牲不是被理性戳穿的迷信，它本身就是最早的交換與算計形式。", "context": "用來反駁「理性後來才戳破犧牲的迷信」這個常見敘事，為後面「犧牲的內轉」（見〈自我保存＝自我毀滅〉卡）鋪路。", "expand": ["一般的說法是：神話時代靠犧牲取悅神明，後來理性成熟了，人才看穿犧牲是迷信而廢除它。這個概念反過來主張：犧牲從來就不是非理性的，它本身就是最早的理性形式。獻上某個較小的東西，期待換來較大的回報——這個結構本身就是交換，而且裡面已經藏著算計，因為獻出去的永遠比想要的少。所謂「欺騙神明」不是犧牲的墮落形態，是它的原始構造。", "這個判斷的重量在於：如果犧牲已經是交換，那麼「理性戳破了神話」這個常見敘事就講不通了——理性不是從外面來破除犧牲的，它一直就在犧牲裡面運作。犧牲與理性之間，從一開始就不是取代關係，是連續關係。"], "relations": [{"type": "繼承", "concept": "自我保存＝自我毀滅", "philosopher": "霍克海默與阿多諾", "text": "犧牲的收件人從神明轉向未來的自己，是這個交換結構的內轉版本"}, {"type": "對話", "concept": "交換原則 Tauschprinzip", "philosopher": "霍克海默與阿多諾", "text": "兩者共享「先假設底下有可比較的量」的邏輯（Tauschprinzip 出現於同一性思維的討論中，尚未單獨建卡）"}], "life": ["《啟蒙辯證法》緊接著用奧德修斯的整趟航程示範這個交換結構如何從對神明的獻祭轉向對「未來的自己」的獻祭，見〈自我保存＝自我毀滅〉卡。", "尚未落地——這是對獻祭儀式起源的理論重構，不易對應到具體的日常行動，日常對應留給〈自我保存〉與〈詭計〉兩張卡處理。"]}, {"id": "card-03", "name_zh": "自我保存＝自我毀滅", "name_orig": "Selbsterhaltung", "philosopher": "霍克海默與阿多諾（Horkheimer & Adorno）", "source": "《啟蒙辯證法》，附論一〈奧德修斯，或神話與啟蒙〉", "aliases": ["自我保存的悖論", "self-preservation as self-destruction"], "topics": ["主體"], "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "definition": "被保存下來的自我，是靠不斷削去自己一部分才存在的，不是先存在後被保護。", "context": "從〈內在自然的宰制〉推進而來，透過奧德修斯自縛桅杆與「無人」之名兩個場景具體化為一句可操作的公式。", "expand": ["這個概念指向一個結構性的悖論：任何主體要維持自身的連續性與同一性，都必須透過持續地否定、壓制、延遲自己當下的衝動來完成——而這個被否定、被壓制的過程，正是那個「被保存的自我」得以存在的方式，而不是這個自我先存在、後來才被這些否定行為保護。", "換句話說，自我不是一個現成的容器，紀律與犧牲不是用來保護這個容器裡的東西——紀律與犧牲本身就是打造這個容器的工序。不是「先有一個未來的自己，然後為了他做出犧牲」，而是「透過不斷做出犧牲，才逐漸生產出一個可以被稱為『未來的自己』的東西」。", "這正是「自我保存等同於自我毀滅」這句話的第一層含義：你保存下來的那個自我，是靠不斷削去自己其他可能的樣子才存在的。它不是先有然後被保護，它是被削出來的——每一次自我保存的動作，同時也是一次自我的部分抹除。"], "relations": [{"type": "繼承", "concept": "內在自然的宰制", "philosopher": "霍克海默與阿多諾", "text": "本卡是那個支配過程的具體命題化結果"}, {"type": "呼應", "concept": "詭計 List", "philosopher": "霍克海默與阿多諾", "text": "「無人」之名是這個悖論最鋒利的文本示範"}, {"type": "張力", "concept": "死亡驅力", "philosopher": "德希達（《檔案熱病》）", "text": "兩者都處理「保存」內含的自我抹除，但德希達的死亡驅力指向遺忘與排除，這裡指向主體的自我構造——值得對讀但不可直接等同"}, {"type": "張力", "concept": "存在先於本質", "philosopher": "沙特", "text": "兩者都主張自我不是現成給定的，而是透過持續的行動被生產出來，但沙特把這個生產理解為自由的徹底開放——我可以把自己籌劃成任何樣子，這是意識虛無化結構帶來的解放；霍克海默與阿多諾這裡呈現的卻幾乎是自由的反面：生產自我的動作本身是被迫的犧牲與宰制，不是自由選擇的展現，是同一個「自我由行動生產而非現成給定」的結構被賦予完全相反的評價"}, {"type": "呼應", "concept": "展演性", "philosopher": "巴特勒", "text": "兩者結構同構——自我沒有預先給定的本質，都是透過不斷重複的行動被生產出來；差別在於巴特勒的重複是規範性言說與身體行動的展演（生產性別），這裡的重複是對內在衝動的犧牲與否定（生產可信賴的自我），一個聚焦身分如何被展演出來，一個聚焦紀律如何把自我打造出來，值得對讀但機制不同"}], "life": ["《啟蒙辯證法》用奧德修斯做了最鋒利的示範：他每一次忍住不吃、不睡、不說、不動，都是一次獻祭，而收下這筆祭品的，是那個「將來能回到伊薩卡的我」——但那個「我」在獻祭之前並不存在，是被這一連串的自我否定給造出來的。", "拿存錢當例子。今天忍住不買，是為了「未來的自己」。但「未來的自己」作為一個真的會為之打算的對象，恰恰是靠反覆忍住這個動作才慢慢變成實體的——不忍的人不是虧待了未來的自己，而是根本沒有一個未來的自己可以虧待。熬夜讀書、忍住不回一封情緒化的信，都是這個悖論活生生的演練場。"]}, {"id": "card-04", "name_zh": "詭計", "name_orig": "List", "philosopher": "霍克海默與阿多諾（Horkheimer & Adorno）", "source": "《啟蒙辯證法》，附論一〈奧德修斯，或神話與啟蒙〉", "aliases": ["狡計", "理性的狡計（對照黑格爾）", "cunning"], "topics": ["主體", "語言"], "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "definition": "不違反規則的字面，卻掏空其實質——理性最早的形狀是鑽漏洞。", "context": "以「無人」之名騙過獨眼巨人為例，說明奧德修斯的理性不是硬碰硬的英雄氣力，而是精確履行字面以掏空實質。", "expand": ["這個概念指的是一種特定形狀的理性：它不透過正面對抗規則來取勝，而是完全遵守規則的字面，同時把規則原本要保障的實質內容掏空。它從不硬碰硬——硬碰硬是英雄的、前理性的做法；它做的是找出契約條文裡的縫，用對方自己設下的規則本身，去瓦解那個規則原本要達成的目的。", "這種理性有它自己的代價，而且這個代價會回頭作用在使用者身上：為了不被規則字面上的漏洞反過來吞掉自己，行動者往往必須暫時取消或隱藏自己身分中的某個部分——用不完整或偽裝的自我去交換生存空間。守住字面、掏空實質，同時也在稀釋執行者自身的完整性：這正是「啟蒙辯證法」這個書名的濃縮版——那個要保存自己的動作，本身在執行一次自我抹除。"], "relations": [{"type": "批判", "concept": "理性的狡計 List der Vernunft", "philosopher": "黑格爾", "text": "黑格爾的狡計是歷史理性利用個人激情達成自己的目的，方向是宏觀歷史的；此處的詭計是個體用來在具體情境中脫身的技術，方向相反且更貼身——兩者是否為刻意互文待查"}, {"type": "呼應", "concept": "自我保存＝自我毀滅", "philosopher": "霍克海默與阿多諾", "text": "本卡是那個悖論最鋒利的文本示範"}], "life": ["最乾淨的例子是奧德修斯對獨眼巨人報上的名字：Udeis，「無人」。這個回答在形式上完全誠實——巨人問名字，他給了名字；神話世界裡「說出真名」這個交換動作被完整履行。但正因為履行得太精確，那個名字反過來讓求救變成一句廢話：「無人在害我。」為了活下來，他必須暫時取消自己作為一個有名字的人。", "完全符合考核標準卻讓考核失去意義的行為——嚴格達標但精神落空——是這個公式最常見的當代變體：合約條款、法規遵循、KPI 達標、稽核應對裡反覆出現。"]}, {"id": "card-05", "name_zh": "勞動與審美的分裂", "name_orig": "", "philosopher": "霍克海默與阿多諾（Horkheimer & Adorno）", "source": "《啟蒙辯證法》，附論一〈奧德修斯，或神話與啟蒙〉", "aliases": ["感官的階級分配", "誰有資格被誘惑", "division of labor and aesthetic experience"], "topics": ["美學", "政治", "權力"], "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "definition": "誰能親近美與慾望、誰只能出力，本身就是一種不需明文宣告的階級分配。", "context": "賽蓮之歌場景中兩種角色分工的具體演示，接上文化工業章的伏筆。", "expand": ["這個概念主張，審美經驗（與危險、崇高、慾望對象的直接相遇）與維持生存所需的勞動，經常在結構上被切割開來、分派給不同的人；誰能夠「被誘惑」、誰只能「出力」，本身就是一種資格分配，一種不需要被公開宣告就能運作的階級劃分。", "這個分配通常不表現為明文規則，而是嵌在誰的身體被允許保持感官開放、誰的身體被要求封閉感官以確保產出效率之中。勞動者的生存方式往往要求感官的截肢——不是他們選擇不去感受，而是那套安排從一開始就沒有把「感受」分配給他們；而被允許親近美與慾望的那一方，通常同時也是被保護、被延遲滿足、有資格活下來講述整個故事的那一方。", "這個分工模式的持久性值得注意：它不需要被重新宣告就能一路運作到當代——誰有資格去美術館、去讀難的書、去讓自己被一件作品「傷害」，誰只被要求把手上的事做完，這條線沒有消失，只是換了形式。"], "relations": [{"type": "繼承", "concept": "壓制性去昇華的雛形", "philosopher": "霍克海默與阿多諾", "text": "奧德修斯這一側的機制，是這個分裂的另一半"}, {"type": "對話", "concept": "感性分配 le partage du sensible", "philosopher": "朗西埃", "text": "兩者都在問「誰的感官被分配到什麼位置」，但朗西埃的政治任務恰恰是打破這種分配，霍克海默與阿多諾這裡只是診斷它的起源"}], "life": ["《啟蒙辯證法》用賽蓮之歌具體演示了這個分工：水手塞住耳朵划槳，連被誘惑的資格都沒有；奧德修斯耳朵開著卻被綁在桅杆上，才有資格聽見、渴望、活下來講這個故事。", "誰有時間與資格走進美術館、讀一本難的書、讓自己被一件作品「傷害」，誰只被要求把手上的事做完——這條界線至今仍在運作，只是不再需要繩索。"]}, {"id": "card-06", "name_zh": "壓制性去昇華的雛形", "name_orig": "repressive desublimation（原型）", "philosopher": "霍克海默與阿多諾（原型）；馬庫色（正式命名者，1964，《單向度的人》）", "source": "《啟蒙辯證法》，附論一〈奧德修斯，或神話與啟蒙〉", "aliases": ["repressive desublimation prototype", "壓制性去昇華的原型"], "topics": ["美學", "慾望"], "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "definition": "慾望沒有被禁止，而是被允許存在卻剝奪兌現可能，變成純粹的審美消費。", "context": "賽蓮之歌中奧德修斯耳朵開著卻被綁死一段，比馬庫色早三十年寫出同一個結構，當時尚未命名。", "expand": ["這個概念描述一種特定的慾望管理機制：慾望本身沒有被禁止或壓抑，它被允許存在、被允許被感知，但被結構性地剝奪了兌現的可能，因而轉化為一種純粹的審美消費。危險與慾望的對象被馴服到只剩觀賞價值——這正是「去昇華」的意思：原本應該被昇華、轉化為文化與藝術成就的驅力衝動，在這裡不是被真正轉化，而是被允許以一種閹割過的形式直接展示出來，同時確保它永遠碰不到真正的滿足。", "這與單純的壓抑不同：壓抑是禁止你想要，這個機制則是允許你想要、允許你享受想要本身的感覺，唯獨不允許你真正得到。享受的方式，恰恰建立在確定自己絕不會真的得到它之上。"], "relations": [{"type": "繼承", "concept": "壓制性去昇華 repressive desublimation", "philosopher": "馬庫色", "text": "馬庫色在《單向度的人》正式命名並系統化的，就是這裡的原型"}, {"type": "繼承", "concept": "勞動與審美的分裂", "philosopher": "霍克海默與阿多諾", "text": "兩張卡描述的是同一幕的兩側，水手與奧德修斯"}], "life": ["奧德修斯自願被綁在桅杆上聆聽賽蓮之歌，正是這個機制最早的文本演練——他聽見了、渴望了，但繩索保證他無論怎麼掙扎都碰不到。藝術的誕生，在這一幕裡與「危險被馴服到只剩觀賞價值」是同一件事：能被安全地欣賞的美，是已經被拔了牙的美。", "被允許談論、被允許展出、被允許消費的「批判」與「異議」——只要它不威脅到能否真正兌現——都是這個結構的當代延伸。"]}, {"id": "card-07", "name_zh": "此性", "name_orig": "heccéité", "philosopher": "德勒茲與瓜塔里（Deleuze & Guattari）", "source": "《千高原》，第10高原〈1730年：強度-生成、動物-生成、難以察覺-生成……〉", "aliases": ["haecceity", "haecceitas", "此在性（不建議，易與海德格 Dasein 混淆）", "這一個性"], "topics": ["本體論", "主體"], "traditions": ["差異與內在性哲學"], "date": "2026-08-23", "status": "定稿", "definition": "不靠主體與本質，僅由經度與緯度的關係組構而成的第三種個體化模式。", "context": "依 philosophy-reader skill 導讀此性，銜接你正在讀的《意義的邏輯》表面/事件理論，並用以測試你自己的詩歌實踐是否構成真正的德勒茲式表面操作。", "expand": ["德勒茲與瓜塔里挪用鄧斯·司各脫經院哲學裡的 haecceitas（原本用來解決「共相之內如何產生個體」的問題，個體仍是一個穩定的實體），把這個詞徹底搬離實體形上學的地基，用以命名第三種個體化模式——既非亞里斯多德式形式—質料的實體個體化（人、物），也非笛卡爾—康德式超驗主體的個體化（我思）。關鍵是：此性的個體性不是物或主體個體性的弱化版，而是更原初、不可被任何更高範疇吸收的東西——物與主體的個體性其實是從此性場域中被二次提取、被形式化／主體化出來的派生物。", "此性的公式直接挪用自史賓諾莎《倫理學》第三部對身體的定義：經度（未成形物質粒子彼此運動與靜止、快與慢的關係）＋緯度（此身體影響其他身體、被其他身體影響的能力，即情動 affect 的容量）＝此性。這套公式的效果是去人稱化、去主體化，但並不去個體化——它去除了「誰」與「什麼」（本質），卻保留了「這一個」的絕對單一性。個體性不需要主體或本質作為支撐點，可以純粹由關係組構的方式來保證。", "此性最核心的弔詭在於：邊界不確定（霧狀、無法精確劃界）卻絕對單一（無法被任何其他此性替代而不產生差異）。我們習慣把「確定性」等同於「輪廓清晰」，但此性指向另一種確定性——關係組構的不可替代性——與輪廓清晰度無關。這也解釋了為什麼此性特別適合描述「生成」（devenir）：生成本身是分子層級的、邊界模糊但強度確切的歷程，而非物種與物種之間有清晰界線的「變形」。", "此性不孤立存在，總是棲居在無器官身體之上，被組織進聚合體（agencement）之中。無器官身體是讓強度得以流通、未被層化的內存平面（plan de consistance），此性正是這個平面被填入內容之後的具體狀態——相對於透過形式與主體運作的組織平面（plan d'organisation）。所有「生成」，本質上都是從組織平面的形式/主體個體化，滑落到內存平面的此性式個體化的運動。"], "relations": [{"type": "呼應", "concept": "事件", "philosopher": "德勒茲", "text": "《意義的邏輯》的事件本體論在瓜塔里合著期被此性重寫——用史賓諾莎情動倫理學詞彙取代斯多噶邏輯學詞彙，底層的非人稱性、前個體性結構一致，此性是事件理論的去語言中心化版本"}, {"type": "呼應", "concept": "Aion與Chronos", "philosopher": "德勒茲", "text": "此性屬於 Aion 時間而非 Chronos，可以在無數個不同的 Chronos 現在中被重新激活而不失去其單一性"}, {"type": "張力", "concept": "臉孔性", "philosopher": "德勒茲與瓜塔里", "text": "生成-動物、生成-難以察覺的整個綱領正是要拆解臉孔性、讓身體重新進入此性式的非臉孔化強度場域，兩者是同一文本裡對立的兩極"}, {"type": "張力", "concept": "存在的意義（Sein／Seinsfrage）", "philosopher": "海德格", "text": "兩者都拒絕以固定本質為存在的基本單位，但海德格晚期的本是事件（Ereignis）仍需要此在作為其發生被見證的場域，此性則徹底去除這個接受結構——一陣風的此性不需要任何此在在場領會它才能完整存在"}, {"type": "張力", "concept": "虛無化與自為", "philosopher": "沙特", "text": "兩者都涉及剝除形式範疇後裸露的存在剩餘，但沙特的剝除抵達的是被負面經歷的過剩（噁心）、需要虛無化的距離才能被自為把握；此性的剝除抵達的則是可以被正面棲居、肯定性的關係叢集——這是樂觀悲觀氣質之外，兩種完全不同的存在論起手式：沙特問意識如何從存在中裂開（答案是否定），德勒茲問個體性如何不依賴主體與本質而組構（答案是肯定性的關係綜合）"}, {"type": "張力", "concept": "他者的臉", "philosopher": "列維納斯", "text": "列維納斯把倫理學的絕對起點賦予「臉」這個高度人類中心的器官，德勒茲與瓜塔里則把臉孔性分析為服務主體化計畫的歷史性層化裝置——此性式的無臉自然聚合體（風、霧、群）在列維納斯的框架裡沒有發出倫理要求的能力，兩者在最根本處互相否定彼此的起點"}], "life": ["德勒茲與瓜塔里舉的例子刻意選擇日常語言中「不太像一個東西」的存在：一個季節、一個下午五點、一陣風、一場霧、一群狼或馬。這些例子的共同點是邊界模糊、卻單一性絕對——一場特定的霧不能被任何其他霧替代而不產生差異。", "你的城市漫遊裡，真正吸引詩學注意力的往往不是「這是台北」「這是士林」這種地理識別，而是某個特定路口在某個特定光線角度下、行人流動的某種特定密度與速度——這正是一組經緯度關係，一個無法被「街景」這個概念詞窮盡的此性。長程縱走裡，某段稜線上霧氣與體感溫度的特定組構、某個爬升段落呼吸節奏與腿部負荷之間的特定關係，同樣是難以在事後完整敘述的此性時刻，因為它們不是molar敘事的「情節點」。"]}, {"id": "card-08", "name_zh": "Aion與Chronos", "name_orig": "Aion et Chronos", "philosopher": "德勒茲（Deleuze）", "source": "《意義的邏輯》", "aliases": ["永恆時間", "活現在", "事件時間", "漂浮的現在", "Aion vs Chronos"], "topics": ["時間", "本體論"], "traditions": ["差異與內在性哲學"], "date": "2026-08-23", "status": "定稿", "definition": "身體活過的可測量現在（Chronos）與無深度漂浮的純粹事件時間（Aion）的二分。", "context": "在導讀德勒茲此性概念時，用以說明此性所屬的時間性——此性屬於 Aion 而非 Chronos，這個區分直接銜接《意義的邏輯》裡的時間論述。", "expand": ["德勒茲區分兩種時間。Chronos 是身體所活的、有厚度的「活現在」——過去與未來只是被收縮進現在的兩端，是「物」與「人」的時間，可測量、可排序。Aion 則是無深度的、純粹事件的時間——永遠已經過去又永遠尚未到來，事件在其中既不在場也從不真正缺席，是不可分割地同時向前後兩端無限延伸的「漂浮的現在」。", "這個雙重結構意味著：一個事件（例如「下午五點」作為此性）不是「現在正好是下午五點」這個 Chronos 式的、被某個身體活過的時刻，而毋寧是「五點」這個事件本身的非人稱結構，可以在無數個不同的 Chronos 現在中被重新激活而不失去其單一性。這正是為什麼一場特定的霧、一個特定的下午，可以同時是絕對單一的（只發生一次）又是可以被事件性地重複召喚的（每次重新進入那個強度組構，那個此性就「再次」發生——不是回憶，而是真正的重新-事件化）。"], "relations": [{"type": "呼應", "concept": "此性", "philosopher": "德勒茲與瓜塔里", "text": "此性屬於 Aion 而非 Chronos，可以在無數個不同的 Chronos 現在中被重新激活而不失去單一性"}], "life": ["見〈此性〉卡——「下午五點」作為此性/事件的例子，正是 Aion 結構最直接的文本示範。", "每次重新走過城市漫遊中曾駐留過的某個路口強度組構，或重新踏上某段縱走稜線，若感覺是那個組構「再次發生」而非單純的回憶重溫，正是 Aion 式重新激活與 Chronos 式線性回憶之間的差別測試。"]}, {"id": "card-09", "name_zh": "臉孔性", "name_orig": "visagéité", "philosopher": "德勒茲與瓜塔里（Deleuze & Guattari）", "source": "《千高原》，第7高原〈零年：臉孔性〉", "aliases": ["面孔性", "臉孔化", "faciality", "visageity"], "topics": ["權力", "主體"], "traditions": ["差異與內在性哲學"], "date": "2026-08-23", "status": "定稿", "definition": "臉不是意義與主體性的自然界面，而是服務於主體化與規訓的歷史性抽象機器。", "context": "在對讀德勒茲此性與列維納斯他者的臉時，用以說明德勒茲與瓜塔里在《千高原》裡如何把「臉」本身分析為批判對象，而非倫理學的絕對起點。", "expand": ["德勒茲與瓜塔里把臉孔性分析為一台抽象機器（machine abstraite）的產物——一個由「白牆／黑洞系統」（le système mur blanc/trou noir）構成的層化裝置，把身體的某個部位（臉）提升為意義化（signifiance）與主體化（subjectivation）的優先界面。", "這套面孔邏輯被過度編碼到整個身體、甚至整個地景之上——風景也會被「臉孔化」。對德勒茲與瓜塔里而言，臉不是倫理的起源，而是權力的效應：是一套歷史性的、可被解構的層化技術，服務於白人／基督教／能指中心主義的主體化計畫。", "「生成-動物」「生成-難以察覺」的整個倫理-政治綱領，正是要拆掉這張臉，讓身體重新進入此性式的、非臉孔化的強度場域（風、霧、群）。"], "relations": [{"type": "張力", "concept": "此性", "philosopher": "德勒茲與瓜塔里", "text": "此性所屬的非臉孔化強度場域（風、霧、群），正是拆解臉孔性之後要抵達的地方，兩者是同一文本裡對立的兩極"}, {"type": "張力", "concept": "他者的臉", "philosopher": "列維納斯", "text": "列維納斯把臉視為倫理學無法化約的絕對起點，德勒茲與瓜塔里則把臉分析為服務主體化計畫的歷史性層化裝置——德勒茲一側質疑列維納斯是否默默排除了非人類、無臉存在的倫理資格；列維納斯一側質疑臉孔性的解構是否同時摧毀了倫理學賴以立足、無法被系譜學還原的剩餘"}], "life": ["見〈此性〉卡「文本裡」——生成-動物、生成-難以察覺穿越的正是被拆解臉孔性之後、重新進入的此性強度場域。", "尚未落地——這是對臉作為權力裝置的理論性拆解，日常對應可以留給觀看他人面容或自己面對鏡頭時的具體反思去測試。"]}, {"id": "card-10", "name_zh": "本體論的三層區分", "name_orig": "Three Senses of Ontology", "philosopher": "跨傳統（奎因、海德格、維威洛斯·德·卡斯楚等）", "source": "（綜合性閱讀框架，非單一文本）", "aliases": ["本體論的層次辨識", "ontology的A/B/C三層", "存在清單／存在方式／實在構成方式"], "topics": ["本體論", "認識論"], "traditions": [], "date": "2026-08-23", "status": "定稿", "definition": "本體論一詞在不同傳統裡指存在清單（A）、存在方式本身（B）、或實在構成方式（C）三件不同的事。", "context": "你詢問在哲學文本或展覽裡讀到「本體論」一詞時該如何詮釋，這套框架是用來建立一套可操作的辨認程序。", "expand": ["層次 A（分析傳統）：本體論問的是一個目錄學問題——一套理論承諾了哪些東西的存在？奎因〈論何物存在〉的名言「存在就是成為約束變元的值」，把本體論變成一種「本體論承諾」的盤點。共相到底存不存在、trope 算不算一種本體論節省，都是這個層次的問題。關鍵問句：作者主張清單上有什麼、又想把什麼從清單上劃掉？", "層次 B（歐陸／海德格傳統）：本體論追問「存在本身」，核心工具是海德格的存有論差異（ontologische Differenz）——存在（Sein）與存在者（Seiendes）不是同一回事，西方哲學史被指控只忙著盤點存在者，卻從不問「存在」這個動詞本身是什麼意思。由此衍生 ontic（存在者層次）／ontological（存有論層次）的區分：文本一出現 ontological 這個形容詞，就該自問——作者是在描述某物的屬性，還是在描述它的存在方式本身？這個判斷幾乎能決定一句話有沒有讀懂。", "層次 C（複數化／當代人類學-新唯物論傳統）：把 ontology 當可數名詞用，指「某個世界／文化／系統把實在組織起來的具體方式」——不說「不同文化對同一個世界有不同看法」（那是知識論），而說「不同實踐構成了不同的世界／實在」（那是本體論）。這是「本體論轉向」的用法（維威洛斯·德·卡斯楚、拉圖、巴拉德等）。", "實戰程序：讀哲學文本時依序問三題——這個 ontology 落在哪個層次（線索：出現奎因／共相／量化 → A；出現 Sein／Dasein → B；出現複數／人類學／新唯物論詞彙 → C）；主張針對的對手是誰；它在偷渡「本體論 vs 形上學」「本體論 vs 知識論」「ontological vs ontic」哪一組對立軸。展覽語言裡的「本體論」幾乎一律是層次 C，功能高度可預測：宣告一種去人類中心的實在觀，把能動性分配給原本被當成被動客體的東西——且極常把知識論問題膨脹成本體論問題，需要辨識這種修辭通膨。"], "relations": [{"type": "對話", "concept": "存在的意義（Sein／Seinsfrage）", "philosopher": "海德格", "text": "層次 B 的核心正是海德格的存有論差異，是這套三層框架裡最關鍵的一層"}, {"type": "呼應", "concept": "事件即意義的本體論身分", "philosopher": "德勒茲", "text": "德勒茲說「事件是意義的本體論身分」時，用的正是被推到極限的層次 B，不能誤讀成層次 A 的存在清單問題"}], "life": ["《存在與虛無》繁中譯本副標題「現象學存有論的嘗試」，譯者選擇「存有論」而非「本體論」，已經在暗示重心在層次 B——存在以什麼方式發生，而非有哪些東西存在。", "逛展覽時看到牆面文字寫「這件作品重新思考了影像的本體論」，先問這句話講的其實是「我們如何感知／認識影像」（知識論），還是真的在講存在方式或實在構成方式（本體論）——能識破這種修辭通膨，就比多數觀眾多看一層。"]}, {"id": "card-11", "name_zh": "事件即意義的本體論身分", "name_orig": "sens est événement", "philosopher": "德勒茲（Deleuze）", "source": "《意義的邏輯》", "aliases": ["意義即事件", "外-存有", "extra-être", "(non)-être", "Aussersein"], "topics": ["本體論", "語言"], "traditions": ["差異與內在性哲學"], "date": "2026-08-23", "status": "定稿", "definition": "意義不實存卻真實，以事件的方式在——潛存於表面而非深藏於物體內部。", "context": "你詢問德勒茲說「事件是意義的本體論身分」這句話裡的「本體論」該如何詮釋，在被術語弄糊塗後，又要求換成生活案例重講一次。", "expand": ["這句話的「本體論」屬於被推到極限的存在方式層次——不能讀成「意義存不存在」的清單問題，因為德勒茲的核心主張正是意義並不實存（n'existe pas）。這句話真正問的是：意義以什麼方式「是」？答案是：以事件的方式——一種非物體性的、潛存（subsister）卻不實存的「外-存有」（extra-être）方式。", "這個立場動用兩個資源。其一是斯多噶派的物體／非物體區分：只有物體「存在」（它們是原因，能作用與承受），事件、可表達者（lekton）、虛空、處所、時間這些「非物體者」並不存在，只「潛存」——是表面上的效果，不是深處的原因。其二是 Meinong 的「外-存有」（Aussersein）：一種既非實存、亦非不存在、對存在無動於衷的純粹對象身分——這個前綴不是少於存有（缺乏），而是外於／溢出存有。", "落地到日常：意義像欠款、像棋局裡的「將軍」——不是任何物體，不佔位置，卻百分之百真實，會逼你還錢、能決定勝負。石頭、刀子這種物體是實打實「存在」的；意義這種發生在表面的效果，是另一種比較輕的真實：它不佔位置，但它在。", "追問「一個事件的意義」不是無效疑問，但方向要對——往深處挖「背後真正藏著什麼意思」是無效的（意義根本沒有那個深處，往深處挖會挖空）；問「這次發生表達了什麼」則完全有效。事件本身有兩層：具體發生的事實（哪天哪點發生了什麼），與這次發生所表達、卻用不完的那件事（例如「告別」這件事本身，比任何一次具體的告別更大，多年後還會重新湧上來）。意義正是第二層——這不是靜態、內在的，而是永遠進行式、可被重新接起的那一層，但這個「動」不是向外造成後果的推力（那仍是物體那一側的事，純粹事件本身「中性、不結果」），而是自身作為進行式、永遠未完成、等你重新接起的那種動。"], "relations": [{"type": "呼應", "concept": "此性", "philosopher": "德勒茲與瓜塔里", "text": "《千高原》把這套表面/事件本體論重寫為此性——用史賓諾莎情動倫理學詞彙（經緯度）取代斯多噶邏輯學詞彙，底層的非人稱性、前個體性結構一致；「表面」在《千高原》被替換成沒有邊界的「一致性平面」，是拓樸學上的重鑄而非單純換詞"}, {"type": "呼應", "concept": "Aion與Chronos", "philosopher": "德勒茲", "text": "純粹事件屬於 Aion 時間而非 Chronos——這正是意義以「永遠進行式」而非「已完成事實」存在的時間性基礎"}, {"type": "對話", "concept": "本體論的三層區分", "philosopher": "跨傳統", "text": "這句話裡的「本體論」正是被推到極限的層次 B（存在方式）用法，不能誤讀為層次 A 的存在清單問題"}, {"type": "張力", "concept": "虛無化與自為", "philosopher": "沙特", "text": "兩人都需要一個「不存在卻仍起作用」的區域，卻給了它相反的價號——沙特的虛無是 pour-soi 在 en-soi 的充實中鑿出的洞、缺乏、否定性；德勒茲的外-存有則是剩餘、溢出、肯定性的 (non)-être，不是洞而是表面上多出來的生產性某物；兩種本體論都圍繞「那個不存在的東西」建立，卻給了它相反的價號"}, {"type": "對話", "concept": "巴迪歐的事件本體論", "philosopher": "巴迪歐", "text": "巴迪歐把事件奠基在虛空（le vide／空集）之上，以形式化的、減法的（soustractive）否定為地基——既不是沙特「活生生的虛無」，也不是德勒茲「肯定性表面」，是介於兩者之間的第三種事件本體論；巴迪歐在《德勒茲：存有的喧囂》裡正面攻擊德勒茲的單義性本體論"}], "life": ["一個吻、一場日落、一次「切開」——刀和蘋果是實物，「蘋果被切開」這件事不是第三個物體，而是發生在表面的一個結果。意義就是這一類：不沉在物體內部，而是浮在表面、是「發生」出來的效果。", "尚未落地——這一卡是純粹的本體論論證本身，具體的實踐落地見〈配得上事件〉卡。"]}, {"id": "card-12", "name_zh": "配得上事件", "name_orig": "être digne de ce qui nous arrive", "philosopher": "德勒茲（Deleuze）", "source": "《意義的邏輯》", "aliases": ["devenir digne de l'événement", "不要辜負發生在你身上的事", "becoming worthy of the event"], "topics": ["倫理", "時間"], "traditions": ["差異與內在性哲學"], "date": "2026-08-23", "status": "定稿", "definition": "意義不會自動交付，事件的倫理實踐是主動把發生的事接起來、做成某個東西。", "context": "你追問德勒茲對純粹事件的理論在生活中能達成什麼實踐，用以處理「往內反芻式追問意義」帶來的內耗問題。", "expand": ["純粹事件本身「中性、不結果」——它不會自己發功、自發地把意義端給你。意義一直在（在表面），但停在潛在狀態，要靠人主動去接，才變成生命裡真正起作用的意義。德勒茲要的不是消掉努力，而是把努力換方向：舊的努力是往內挖隱藏的意思（這會把人磨空——「內耗」這個詞本身就是「往內、自我消磨」）；新的努力是往外、往創造——把發生的事接起來、做成某個東西。", "實踐的核心動作是一句話：從「這件事是什麼意思」換成「我能拿這件事變成什麼」。德勒茲最愛舉的例子是詩人 Joë Bousquet——一戰中被子彈打中脊椎、下半身癱瘓、臥床一輩子，他沒有把餘生耗在「為什麼是我、這顆子彈有什麼意義」上，而是說了一句大意如此的話：這道傷在他出生前就存在，他是為了把它活出來才誕生的。重點不是他找到了傷的隱藏意義（沒有），而是他主動把一個本身毫無意義、純屬偶然的事件，接成了他的書寫、他整個人的形狀。", "一個重要防呆：這不是「凡事都有安排、接受就好」的宿命論。德勒茲沒有要人相信事件背後有天意（那又掉回「隱藏的深層意義」），也不是要人消極認命——恰恰相反，正因為事件本身沒有現成意義，才必須主動去接、去做。意義是做出來的，不是被宇宙塞給你的。這既卸掉了向內反芻的內耗，又沒讓人變被動，反而把責任放回自己身上——只是這個責任是創造性的，不是反芻性的。"], "relations": [{"type": "呼應", "concept": "事件即意義的本體論身分", "philosopher": "德勒茲", "text": "這是同一套表面事件本體論的倫理實踐面——意義不藏在事件背後，正因如此才需要主動去接、去做"}, {"type": "張力", "concept": "自由與責任", "philosopher": "沙特", "text": "兩條路徑都反內耗，方向卻相反——沙特要人自由地、當下地選擇賦予事件意義並為這個選擇負全責（往內承擔）；德勒茲要人配得上那件用不完的事、主動把它接成某個東西（往外創造）；有意思的是沙特這條反而更靠近「向內」，只是把向內的內容從「找隱藏意義」換成了「承認這是我自己的選擇」"}], "life": ["Joë Bousquet 把一戰戰傷接成畢生書寫的例子，見上方完整展開——這是德勒茲最常引用的示範案例。", "城市漫遊中把一個偶然撞見的瞬間接成一段文字，是把事件「接起來、做成東西」，不是在問街景背後藏了什麼真理，而是把那次相遇實現成作品；登山時計畫被打亂（天氣、傷、折返），內耗版是「為什麼偏偏今天」，實踐版是「我能從這個變局裡長出什麼」。"]}, {"id": "card-13", "name_zh": "哲學家的三種空間形象", "name_orig": "trois images des philosophes", "philosopher": "德勒茲（Deleuze）", "source": "《意義的邏輯》，第18系列〈諸哲學家的三種形象〉", "aliases": ["高度／深度／表面三形象", "height, depth, surface"], "topics": ["本體論", "主體"], "traditions": ["差異與內在性哲學"], "date": "2026-08-23", "status": "定稿", "definition": "哲學史可讀為空間定向的拓樸學——柏拉圖的高度、前蘇格拉底的深度、斯多噶的表面。", "context": "逐頁細讀《意義的邏輯》第18系列，用以理解德勒茲整本書「意義作為表面效應」核心命題的鋪陳邏輯。", "expand": ["德勒茲的策略不是反駁哲學史上各種學說「對不對」，而是把哲學史讀成空間定向的拓樸學——一套哲學最深層的承諾，不在它的命題，而在它朝向哪個方向。這是《差異與重複》「思想的形象」批判的延伸：在任何具體論證之前，思想已經預設了一幅它自己看不見的方位圖。", "高度（柏拉圖主義）——哲學家被定型為走出洞穴的上升存有，思想朝向「東方」（orientation 字根即 Orient）、朝向太陽／理型，運作方式是 conversion（換位，雙關幾何學迴轉與宗教皈依）。", "深度（前蘇格拉底）——反過來拒絕走出洞穴，認為人還不夠深入，運作方式是 subversion（顛覆）而非 conversion，姿態是向下鑿穿、被吞沒，而非向上飛升。恩培多克勒躍入火山、只留下涼鞋（大地原住民標誌），對比柏拉圖靈魂長出的翅膀——「柏拉圖的羽翼拍擊，與前蘇格拉底的鎚子敲擊相對立」。", "表面（斯多噶學派，第三種希臘人）——不是從深淵挖出深度，而是「由於不斷地接近淺表」所累積的深度；不再從深處或高處等待救贖，而是從事件本身出發。這是全書真正的落點：意義作為表面效應，而非高處理型或深處身體。"], "relations": [{"type": "呼應", "concept": "症狀學", "philosopher": "德勒茲", "text": "三種形象各自對應一種哲學特有的疾病，是症狀學方法在哲學史上的具體操練"}, {"type": "呼應", "concept": "Aion與Chronos", "philosopher": "德勒茲", "text": "表面形象（斯多噶）正是 Aion 時間、事件本體論登場的地方，是這套空間拓樸學與時間理論交會的節點"}, {"type": "呼應", "concept": "事件即意義的本體論身分", "philosopher": "德勒茲", "text": "三形象的終點正是這張卡所講的表面事件本體論——高度與深度都是要被繞開的定向陷阱"}], "life": ["蘇格拉底飲鴆赴死（高度定向的鬱期，「抑鬱性自殺」）與恩培多克勒躍入埃特納火山（深度定向的終極姿態），是德勒茲用來示範兩種形象的一對死法對照——兩者都是「哲學軼事」，卻屬於完全不同的空間維度。", "尚未落地——這是純粹的哲學史拓樸學重寫，具體實踐落地見〈症狀學〉卡（藥師臨床場域的接口）。"]}, {"id": "card-14", "name_zh": "症狀學", "name_orig": "symptomatologie", "philosopher": "德勒茲（Deleuze）", "source": "《意義的邏輯》第18系列；方法論見《薩克-馬索克導論》（《冷酷與殘酷》，1967）", "aliases": ["symptomatology", "批判與臨床", "critique et clinique"], "topics": ["認識論", "主體"], "traditions": ["差異與內在性哲學"], "date": "2026-08-23", "status": "定稿", "definition": "不問學說對不對，而問是哪一種生命狀態生產出了這種思想的診斷式閱讀方法。", "context": "用以說明德勒茲如何把柏拉圖主義診斷為「哲學特有的先天性疾病」，而非反駁其命題——「人們將不會把哲學和疾病進行比較，可是卻有諸多哲學特有的疾病」。", "expand": ["德勒茲明確拒絕「哲學＝疾病」這個等式——不是庸俗的心理病理學歸約（不是說「柏拉圖有精神病，所以寫出這種哲學」，那是傳記式化約，恰恰是德勒茲最厭惡的閱讀法）。他守住的是另一條路：疾病不是哲學的外因，而是哲學的內生物——「哲學特有的（propres à）疾病」，由哲學自身的定向所滋生。", "症狀學是把醫學活動拆成三層（症狀學／病因學／治療學）裡的第一層——描述、辨認、歸組諸徵候，勾勒出一張臨床圖譜，幾乎是「醫學之外」的活動，站在醫學與藝術的交界。偉大作家與哲學家做的正是這件事：為此前無名的徵候群命名，是文明的臨床家而非病人——馬索克之於「受虐」、薩德之於「施虐」，正是這種操作的範例。", "這套方法把評判的軸線從「真／假」整個挪到「健康／病態、哪一型」。柏拉圖主義的解藥因此不會是更好的論證，而只能是重新定向。最尖銳的反諷在於：柏拉圖主義把自己包裝成療法（上升「淨化」自己），德勒茲的症狀學一刀切下去揭穿的正是——那個被當成解藥的淨化動作，本身就是病灶。療法即疾病。這個方法直接繼承自尼采「文化的醫師」姿態——把虛無主義、怨恨、禁慾理想都診斷為徵候而非錯誤。"], "relations": [{"type": "繼承", "concept": "哲學家的三種空間形象", "philosopher": "德勒茲", "text": "三種形象各自的疾病診斷（唯心論的躁鬱、前蘇格拉底的思覺失調）是症狀學方法最直接的操練場"}, {"type": "呼應", "concept": "系譜學（généalogie）", "philosopher": "尼采、傅柯", "text": "症狀學的「文化醫師」姿態直接繼承尼采，評判軸線從真假挪到健康病態，與尼采系譜學、傅柯的系譜學方法在精神上高度親近，但症狀學更聚焦於「歸組徵候」這個臨床動作本身"}], "life": ["辯證法作為「諸理念的飛逝」，即臨床上的 Ideenflucht（思緒奔馳）——躁期典型徵候，是這套方法最精緻的雙關示範：哲學意義的「理念飛升」＝臨床意義的「思緒奔馳」。", "藥師臨床上天天在做的「辨認徵候群、把零散症狀歸組成一個臨床圖譜」，跟德勒茲說的症狀學是同一個動作，只是對象從病人換成了哲學、文明——這是這套方法在你自己專業場域裡最直接的接口。"]}, {"id": "card-15", "name_zh": "神秘點", "name_orig": "point mystérieux", "philosopher": "德勒茲（轉引尼采的方法）", "source": "《意義的邏輯》第18系列", "aliases": ["mysterious point", "生命與思想的接縫處"], "topics": ["認識論", "主體"], "traditions": ["差異與內在性哲學"], "date": "2026-08-23", "status": "定稿", "definition": "生命軼事與思想格言尚未分岔成兩條路、在此互為同一件事的閱讀哲學家的方法論起點。", "context": "用以說明尼采式研究哲學家的方法，如何區別於傳記解釋與純文本分析兩種讀法——「思想行為在思想中醞釀而成，和思想者在生命中孕育出來，難道這不是根據其他維度嗎？」", "expand": ["德勒茲排除兩種讀哲學家的方式：傳記（從哲學家的生平解釋他的思想——他生病，所以他悲觀；這是外因論，把思想化約成生命事件的結果）；以及參考書目（純粹在文本內部移動，只談命題、論證、影響，生命被排除在外）。神秘點在這兩者之前：一個生命和思想還沒有分岔成兩條路的地方，它們在那裡是同一件事，互相既不解釋也不化約。", "這連結到全書書名「意義的邏輯」的隱藏自我說明——「這就像意義（sens）一樣，一方面歸因於生命狀態，另一方面則在思想的命題中堅持著」。意義不在生命裡（生命是深度、身體），也不在命題裡（命題是語言、邏輯），而在兩者的接縫處——「意義」本身就是那個神秘點的別名。", "第歐根尼·拉爾修的《傑出哲學家的生平》——這本被學術界當成資料集而非嚴肅哲學文獻的軼事合集——被德勒茲翻轉評價：拉爾修直覺上先於尼采實踐了神秘點方法，因為他本能地知道哲學家的姿態（geste）本身就是哲學命題，不需要從外部附加解釋。「恩培多克勒與埃特納火山，就是一件哲學軼事，等同蘇格拉底之死，不過這恰恰在另一個維度上運作」——兩者都是「哲學軼事」，都在生命與思想的神秘點上發生，但屬於完全不同的空間維度（深度 vs 高度）。"], "relations": [{"type": "呼應", "concept": "事件即意義的本體論身分", "philosopher": "德勒茲", "text": "意義作為「神秘點」的別名——不在生命的深度裡，也不在命題的高度裡，而是兩者接縫處的表面效應，與事件本體論是同一套拓樸學的兩種表述"}, {"type": "對話", "concept": "哲學家的三種空間形象", "philosopher": "德勒茲", "text": "蘇格拉底之死與恩培多克勒躍入火山，都是神秘點式的哲學軼事，卻分屬高度與深度兩種不同的空間形象"}], "life": ["尼采本人就是神秘點方法最好的示範——《瞧，這個人》裡他的偏頭痛、失明、孤獨不是他哲學的原因；他跑到涼爽的山上才能思考，不是無關的傳記細節；這些東西與他的思想格言是同一個事件，有一個共同的強度。", "尚未落地——這一卡是純粹的方法論反思，日常對應可以留給你自己書寫哲學筆記時，測試「這段觀察與那段思考，是不是同一個神秘點的兩面」。"]}, {"id": "card-16", "name_zh": "虛無化", "name_orig": "néantisation", "philosopher": "沙特（Sartre）", "source": "《存在與虛無》，第一部分第一章〈否定的起源〉", "aliases": ["nihilation", "la néantisation", "虛無化作用"], "topics": ["主體", "本體論"], "traditions": ["現象學／存在主義／詮釋學"], "date": "2026-08-23", "status": "定稿", "definition": "意識把自己與世界拉開一道縫、藉此使「無」得以進入世界的存在論運作。", "context": "逐句細讀《存在與虛無》頁 44–46，用以理解虛無如何以焦慮的方式在世界中雙重顯現，是全章「否定的起源」核心命題的鋪陳。", "expand": ["世界全是「有」——桌子、咖啡杯、人，但日常經驗裡處處是「沒有」：朋友不在咖啡館裡的缺席、錢包裡沒錢，這些「無」不是腦中編造的句子，而是活生生被感受到的。虛無化就是要回答：這個「無」是怎麼跑進一個全是「有」的世界裡的。", "焦慮揭示了虛無的雙重顯現——意識同時虛無化兩個對象：世界（為了把世界當作世界整體來把握，意識必須從世界抽身，這個抽身本身就是對世界的虛無化），以及自己（意識無法與自身重合，總是逃離當下的自己）。而且這不是一次性事件，是「不斷的」——這正是為-己（pour-soi）的定式：意識是「它所不是、不是它所是」的存在。", "關鍵的一步在於：一般直覺以為先有世界（一堆實在的東西），然後意識在裡面挑出「沒有」；沙特反過來說——光是把世界當成「世界」來領會，這個動作本身就已經是虛無在現身了。因為「總體」不是世界裡的一個東西，要握住它只能靠一個能後退、能說「這一切」的存在，而這個後退就是虛無化。虛無不是事後補進來的，它在最基本的「世界顯現」裡就已經在運作——意識因此把自己確立為否定的起源：不是被動承接一個外來的虛無，而是在虛無化的動作中反過來把自己認出來。"], "relations": [{"type": "呼應", "concept": "事件即意義的本體論身分", "philosopher": "德勒茲", "text": "兩人都需要一個「不存在卻仍起作用」的區域，卻給了它相反的價號——沙特的虛無是意識鑿出的洞、缺乏、否定性；德勒茲的外-存有則是剩餘、溢出、肯定性的"}, {"type": "張力", "concept": "差異先於同一", "philosopher": "德勒茲", "text": "德勒茲認為否定是反應性的、次級的，是從一個更原初的肯定衍生出來的——沙特把自由建在否定上，德勒茲會說這樣自由就永遠被所否定的東西拴住，真正的自由是差異的肯定性生產而非「不」的縫"}, {"type": "對話", "concept": "減法", "philosopher": "巴迪歐", "text": "巴迪歐的減法概念嘗試在摧毀、否定、減法三種改變樣態裡，為沙特式否定與德勒茲式肯定找一個介於中間、更精緻的位置"}], "life": ["距離的分析——A 點到 B 點的距離不是兩點之間本來就擺著的正面屬性，而是一種否定性結構：沒有一個會「在意這段距離」、圖謀消除它的存在，距離就只是純粹的「有」，不會顯現為「要被克服的隔閡」。", "讀到一則新聞或問題時，不急著反應、先把自己跟它拉開一道縫，這個「拉開」本身就是虛無化——但沙特會提醒：這道縫必須是「為了某個籌畫」（pour un projet）才算數，若無限懸停在純粹否定性裡、永不承擔、永不選擇，這種懸停本身就是一種自欺，是用「清醒旁觀者」的姿態逃避不得不選、不得不行動帶來的焦慮；在高度展演化的當代，「質疑框架」甚至可能被收編成一種文類、一種人設，批判本身變成奇觀。"]}, {"id": "card-17", "name_zh": "減法", "name_orig": "soustraction", "philosopher": "巴迪歐（Badiou）", "source": "〈摧毀、否定、減法〉", "aliases": ["subtraction", "la soustraction"], "topics": ["政治", "本體論"], "traditions": ["當代左翼政治哲學"], "date": "2026-08-23", "status": "定稿", "definition": "對既存狀態只做最小的撤出、打開一個原本不被計入的空位，而非徹底否定或摧毀。", "context": "在調解沙特式否定與德勒茲式肯定的嘗試裡，巴迪歐的三分法被引為最直接的縫合路線——對現狀不滿是否必須是否定，改變是否可以是正向生成。", "expand": ["巴迪歐把「改變」拆成三種樣態。摧毀（destruction）是把舊的整個抹掉，是二十世紀革命常見的悲劇模式；否定（negation）是古典辯證法式的否定；減法（soustraction）則對既存狀態只做最小的「抽離／撤出」——不是去消滅它，而是在它裡面打開一個原本不被計入的空位。", "減法的精妙之處在於，它保留了一個必要的鬆動環節（一個極薄的負項，只負責「鬆開」既有秩序），而真正的內容——改變本身——是對「事件」保持忠誠所展開的、肯定性的真理程序（truth-procedure）。也就是說：不滿等於對現狀的減法式撤出，改變本身則是對新可能的正向建構，兩者不是同一件事，卻可以在同一個過程裡分工。"], "relations": [{"type": "對話", "concept": "事件即意義的本體論身分", "philosopher": "德勒茲", "text": "巴迪歐的減法本體論試圖在沙特式否定與德勒茲式肯定之間找第三條路，巴迪歐本人也在《德勒茲：存有的喧囂》裡與德勒茲正面交鋒"}, {"type": "呼應", "concept": "虛無化", "philosopher": "沙特", "text": "減法保留了沙特式否定的「鬆動」功能，卻不讓它像沙特那樣成為自由的全部根基，而只是真理程序展開前的必要條件"}], "life": ["尚未落地——這是巴迪歐晚期較抽象的方法論分類，本次討論停留在概念層次。", "對現狀不滿提供的不是「推力」而是一個極薄的鬆動（減法式撤出），改變真正的內容——要往哪裡去、要建構什麼——仍然需要另一層正向的、肯定性的投入，不能指望不滿本身自動生成方向。"]}, {"id": "card-18", "name_zh": "可塑性", "name_orig": "plasticité", "philosopher": "馬拉布（Catherine Malabou）", "source": "《黑格爾的未來》", "aliases": ["plasticity", "la plasticité"], "topics": ["本體論", "主體"], "traditions": [], "date": "2026-08-23", "status": "定稿", "definition": "同時意味著接受形式、給予形式、與炸毀形式的概念，讓毀形與賦形成為同一動作的兩面。", "context": "作為調解沙特式否定與德勒茲式肯定的另一條路線，馬拉布用可塑性這個概念本身同時容納兩者，而非讓兩者並排分工。", "expand": ["馬拉布玩的是 plastique 這個詞的雙關——既是「可塑形的」，也是「炸藥的」。可塑性同時意味著「接受形式」（塑形材料的被動面）、「給予形式」（主動賦形）、以及「炸毀形式」（爆破既有形式）三重意涵疊在一起。", "在《黑格爾的未來》裡，她重讀出一個非純否定的、會自我塑形的黑格爾——不必在「否定舊形式」與「生成新形式」之間二選一，因為毀形與賦形是同一個可塑性動作的兩面。這是比巴迪歐的減法更徹底的縫合方式，因為它根本拒絕承認否定與肯定之間有兩條線需要縫合——改變就是形式的爆破與再生同時發生。"], "relations": [{"type": "對話", "concept": "減法", "philosopher": "巴迪歐", "text": "兩者都是嘗試調解沙特否定與德勒茲肯定的當代路線，但巴迪歐讓兩者分工（減法式撤出＋肯定性建構），馬拉布則讓兩者根本上是同一個動作的兩面"}], "life": ["尚未落地——這是對黑格爾辯證法的當代重讀，本次討論停留在概念介紹層次。", "尚未落地——留給你之後實際讀《黑格爾的未來》時再對照具體場景。"]}]</script>
<script id="philosophers-data" type="application/json">[{"id": "phil-01", "name_zh": "霍克海默", "name_orig": "Max Horkheimer", "dates": "1895–1973", "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "intro": "法蘭克福學派的奠基者與長期領導者。1930 年接掌法蘭克福大學社會研究所所長一職後，把一個原本偏向正統馬克思主義史料研究的機構，改造成一套結合馬克思與佛洛伊德、跨越哲學、社會學、心理分析的「批判理論」計畫。與阿多諾合著《啟蒙辯證法》，是二十世紀對「理性」本身最尖銳的自我懷疑之一。", "background": ["1930 年 7 月，霍克海默受聘為法蘭克福大學社會哲學教授；同年 10 月接替葛倫柏格（Carl Grünberg）出任社會研究所所長。研究所本身創立於 1923 年，由費利克斯·魏爾（Felix Weil）出資成立，最初的取向是史料式的正統馬克思主義研究；霍克海默接手後大幅轉向，開始系統性地把精神分析、社會心理學、美學批判整合進馬克思主義框架，這個轉向後來被稱為「批判理論」，其綱領見於他 1937 年的重要論文〈傳統理論與批判理論〉——這篇文章明確區分了自居中立、價值無涉的「傳統理論」，與自覺以解放為目標、承認自身立場的「批判理論」，是整個學派的方法論宣言。", "1933 年納粹掌權後，研究所被迫關閉，霍克海默帶領核心成員流亡，先到日內瓦、巴黎，1934 年在哥倫比亞大學重新落腳紐約，研究所在此持續運作到 1949／1950 年。流亡美國期間，他與阿多諾合作最密切的階段展開，《啟蒙辯證法》（1944 年油印本，1947 年正式出版）就是這段時期的產物。1949 年研究所遷回法蘭克福，霍克海默 1950 年重新出任所長直到 1958 年卸任（影響力延續到更晚），此後阿多諾接掌實質領導。晚年的霍克海默思想趨於保守與悲觀，與馬庫色等人在政治參與上的路線分歧逐漸浮現。"], "core_concepts": ["批判理論：與自居中立的「傳統理論」相對，承認理論本身帶有解放意圖與立場，這是整個學派的方法論起點。", "工具理性：見於《啟蒙辯證法》與《理性之蝕》，指理性被化約為純粹計算手段與目的之間關係的能力，喪失了判斷目的本身是否合理的能力——這是他晚期對現代性最核心的診斷。", "啟蒙的辯證：與阿多諾共同提出，啟蒙理性宣稱要解除神話的支配，但其自身的運作邏輯（同一性思維、對自然與對自身的宰制）會辯證地倒退回它原本要克服的神話結構。見〈內在自然的宰制〉〈自我保存＝自我毀滅〉〈詭計〉等卡。"], "relations": [{"type": "對話", "name": "阿多諾", "text": "終身合作者、《啟蒙辯證法》共同作者，兩人晚年在研究所裡是被公認並列的批判理論兩大領袖，思想上高度共構，難以清楚切割誰主導了哪個論點"}, {"type": "繼承", "name": "馬庫色", "text": "霍克海默 1930 年代擔任所長期間招募進研究所的第一代核心成員之一，兩人同屬第一代法蘭克福學派，但晚年政治路線分歧明顯——馬庫色持續投入六〇年代激進學運，霍克海默轉向政治悲觀與保守"}, {"type": "繼承", "name": "哈伯瑪斯", "text": "法蘭克福學派第二代領袖，1964 年接下的正是霍克海默在法蘭克福大學留下的哲學與社會學講座教職，機構位置上的直接接班人"}, {"type": "張力", "name": "卡爾·波普", "text": "實證主義爭論（Positivismusstreit）的對手，波普代表的證偽主義科學觀，正是霍克海默「傳統理論」批判的靶子之一（此爭論後期主要由阿多諾與哈伯瑪斯出面，霍克海默本人參與較早期階段）"}, {"type": "呼應", "name": "海德格", "text": "兩人對現代性的診斷路徑截然不同（批判理論出發自馬克思與佛洛伊德，海德格出發自存在論），但工具理性批判與海德格晚期對技術本質（Ge-stell，集置）的診斷高度共鳴——兩者都認為現代理性／技術已經把世界（與人自身）化約為純粹可支配、可計算的材料，是理解「批判理論」與「存在論式技術批判」這兩條路徑殊途同歸之處的重要對照點"}], "intro_reading": ["《啟蒙辯證法》（與阿多諾合著）——整個學派最核心也最陰暗的一本書，直接對應目前已建的六張卡", "〈傳統理論與批判理論〉（收錄於《批判理論文集》）——方法論宣言，篇幅短，適合當作入口"], "advanced_reading": ["《理性之蝕》（Eclipse of Reason，1947）——工具理性批判的獨立展開，比《啟蒙辯證法》更聚焦、更易讀", "Rolf Wiggershaus，《法蘭克福學派：歷史、理論與政治意義》——學派整體的權威學術史，適合搞清楚人物關係與時間線"]}, {"id": "phil-02", "name_zh": "阿多諾", "name_orig": "Theodor W. Adorno", "dates": "1903–1969", "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "intro": "法蘭克福學派第一代最重要的思想家之一，也是霍克海默最主要的合作夥伴。橫跨哲學、社會學、音樂學、文學批評，出身受過完整的音樂訓練（曾隨阿爾班·貝爾格學作曲），這個背景直接餵養了他對「文化工業」與美學問題的敏感度，也讓他在整個學派裡顯得格外重視藝術與否定性思維，而非直接的政治行動。晚年與激進學生運動關係緊張，是理解他晚期思想與學派內部政治張力的重要線索。", "background": ["1903 年生於法蘭克福，本名 Theodor Ludwig Wiesengrund，「阿多諾」取自母系姓氏，後來因申請美國公民身分而正式改用（父姓 Wiesengrund 被拿掉）。求學階段同時走哲學與音樂兩條線：在法蘭克福大學完成哲學博士與教授資格論文（後者關於齊克果的美學），同時前往維也納師從作曲家阿爾班·貝爾格；這個音樂訓練的份量不小，終其一生他都以音樂學家的身分持續寫作，這是他與霍克海默、馬庫色最明顯不同的知識背景。", "1934 年因猶太身分流亡英國牛津，1938 年轉往美國紐約，加入研究所並參與普林斯頓廣播研究計畫，後期落腳加州。流亡美國期間與霍克海默密切合作，共同寫成《啟蒙辯證法》，同時獨立完成《最低限度的道德》（Minima Moralia，1951）——一部以格言體反思流亡經驗與「受損生活」的作品。1949 年返回法蘭克福，1958 年接替霍克海默出任研究所所長直到 1969 年猝逝。他生命的最後階段正值歐洲學運高漲，1968 年學生一度佔領研究所，阿多諾因報警處理引發爭議，這段衝突是理解他與更年輕一代激進派（包括他自己部分學生）之間真實緊張關係的重要事件，不是單純的立場分歧，而是實際發生過的公開決裂。"], "core_concepts": ["文化工業：與霍克海默共同提出，指文化產品在資本主義下被標準化、商品化生產，表面提供娛樂與慰藉，實際上壓制批判思考、鞏固既有秩序——是《啟蒙辯證法》裡最廣為人知的一章。", "否定辯證法：阿多諾最重要的獨立哲學貢獻（見同名著作，1966），拒絕黑格爾式辯證法最終導向和解、統一的「肯定性」結局，主張真正的批判思考必須停留在否定、停留在概念與對象之間永遠無法完全吻合的裂縫裡，不假裝達成綜合。", "非同一性：與否定辯證法直接相關——任何概念化都無法窮盡它所指涉的對象，總有剩餘逃出概念之外，這個剩餘正是批判思考該守護的東西，也是〈內在自然的宰制〉卡裡「同一性思維」被批判的理論根源。", "美學理論：晚年最後、身後出版的巨著（Aesthetic Theory，1970），主張藝術（尤其現代主義藝術）透過其形式上的不和諧與抗拒消費，保存了一種抵抗同一化的可能性——這與〈壓制性去昇華的雛形〉卡裡「安全的美是被拔了牙的美」形成有意思的張力，值得對讀。"], "relations": [{"type": "對話", "name": "霍克海默", "text": "終身最主要的合作者，見霍克海默主頁"}, {"type": "繼承", "name": "哈伯瑪斯", "text": "1956 年起擔任阿多諾的研究助理，是直接的師生關係，這段經歷形塑了哈伯瑪斯早期的問題意識，儘管他後來的理論方向與阿多諾產生了根本性的分歧（見下）"}, {"type": "張力", "name": "哈伯瑪斯", "text": "哈伯瑪斯後來明確認為《啟蒙辯證法》對「理性」本身的批判過於全面、幾乎自我瓦解（若理性本身已被工具化污染，批判理論賴以立論的理性基礎又從何而來），因此轉向重建一套規範性的「溝通理性」，這是法蘭克福學派內部最重要的世代轉折點之一"}, {"type": "批判", "name": "馬丁·海德格", "text": "《本真性的行話》（The Jargon of Authenticity）一書專門批判海德格式存在主義語彙裝出深刻感、實則迴避了具體的社會歷史分析"}, {"type": "批判", "name": "沙特", "text": "肯定沙特介入政治的姿態，但在《否定辯證法》裡對存在主義式的「自由」概念仍抱持懷疑，認為它未能充分正視物質社會結構對主體的實質限定——自由若只被理解為意識的虛無化結構，便有可能滑向一種抽象、未經社會歷史中介的形式主義"}, {"type": "對話", "name": "華特·班雅明", "text": "極親近的知識同盟與私交好友，阿多諾在班雅明 1940 年逃亡途中自殺身亡後，主導整理並出版了他大量未完成的遺稿；班雅明本人並非研究所正式編制成員，但與阿多諾、霍克海默的思想交流極深，常被誤認為核心成員之一——嚴格說是研究所的親近夥伴，不是機構意義上的一員"}, {"type": "張力", "name": "六〇年代激進學生運動（無單一代表人物）", "text": "1968 年學運高峰期與部分學生（包括他自己教過的學生）發生公開衝突，這是學派內部「理論與行動之間該如何取捨」這個問題最劇烈的一次現實演練，與馬庫色同期在美國積極支持學運形成鮮明對比"}, {"type": "呼應", "name": "傅柯", "text": "兩人的問題意識從未直接交會，但阿多諾對啟蒙工具理性如何轉向對主體內部宰制的辯證診斷，與傅柯對現代規訓權力生產性運作的系譜學分析，經常被後續研究者並置對讀——差別在於阿多諾保留了「啟蒙必然墮落」的辯證宿命論與烏托邦式的救贖渴望，傅柯的系譜學則拒絕任何目的論式的歷史必然性"}, {"type": "呼應", "name": "德波", "text": "文化工業理論與奇觀社會理論共享對資本主義如何透過文化與影像消費馴化批判意識的關切，兩者常被並置討論——德波受阿多諾與霍克海默的文化工業分析影響，但情境主義更強調具體的行動介入（異化、都市漂移）而非純粹的理論批判，這個差異也反映了法蘭克福學派與情境主義國際在理論與實踐關係上的不同取徑"}], "intro_reading": ["《啟蒙辯證法》（與霍克海默合著）——與已建卡片直接對應", "《最低限度的道德》——格言體，篇幅可分次讀，最能感受阿多諾的文字風格與流亡經驗"], "advanced_reading": ["《否定辯證法》——阿多諾最系統性的哲學著作，難度較高，建議先讀完《啟蒙辯證法》再進", "《美學理論》——身後出版，未完全定稿，但是理解他晚期藝術哲學的核心文本"]}, {"id": "phil-03", "name_zh": "馬庫色", "name_orig": "Herbert Marcuse", "dates": "1898–1979", "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "intro": "法蘭克福學派第一代成員中政治立場最激進、也最積極介入現實運動的一位，被廣泛稱為「新左派之父」。早年出身海德格門下的現象學訓練，後轉向法蘭克福批判理論，晚年在美國成為六〇年代學生運動最具影響力的理論代言人之一——這條路線與阿多諾、霍克海默戰後的相對保守、退回書齋，形成整個學派內部最鮮明的一組對照。", "background": ["1898 年生於柏林一個融入德國社會的猶太中產家庭。1922 年於弗萊堡大學取得文學博士後，1928 至 1933 年回到弗萊堡跟隨馬丁·海德格研讀現象學，準備教授資格論文，這段訓練是他與霍克海默、阿多諾最不同的起點——他的哲學養成底色是現象學與存在主義，不是社會學或音樂學。因不滿海德格與納粹的合作關係，他放棄了這條學術路徑，未完成教授資格論文，1933 年轉而加入法蘭克福社會研究所——加入的時間點正好是納粹掌權、研究所被迫關閉流亡的同一年，馬庫色隨即輾轉日內瓦，1934 年赴美，此後終身定居美國，是三位第一代領袖裡唯一沒有隨研究所遷回德國的一位。", "流亡期間他先在哥倫比亞、後在戰時為美國情報機構（先後隸屬戰略情報局的前身單位）工作，戰後持續留在美國學界，任教於哥倫比亞、哈佛、布蘭戴斯，最後長期落腳加州大學聖地牙哥分校。與阿多諾、霍克海默不同，他戰後從未返回德國定居，這個地理與機構上的分離，某種程度上也預示了他在思想與政治立場上與另兩人漸行漸遠——他持續自認馬克思主義者、社會主義者，六〇年代積極聲援學運，甚至一度捲入是否該為激進學運提供理論正當性的爭議（如 1965 年〈壓制性容忍〉一文），阿多諾、霍克海默晚年則明顯轉向政治悲觀與距離。他 1979 年在德國施塔恩貝格訪問期間中風過世。"], "core_concepts": ["壓制性去昇華：《單向度的人》（1964）提出，指發達工業社會允許慾望以被馴化、被商品化的形式公開展示與消費，藉此消解其顛覆潛能——這正是〈壓制性去昇華的雛形〉卡裡指出的，霍克海默與阿多諾早在 1944 年的奧德修斯分析裡就已經寫出同一個結構，只是尚未命名。", "單向度的人：晚期工業社會透過消費與大眾文化，消滅了原本能提出「這個社會本可以不同」的否定性、批判性思維向度，只剩下肯定現狀的單一維度。", "大拒絕：對整個既存秩序的根本性拒絕，不是針對個別政策的局部改良，而是對整個「這是唯一可能的現實」這個預設本身的拒絕——這個立場是他晚年積極支持激進學運的理論基礎。", "愛欲與文明：早於《單向度的人》的著作（1955），嘗試把佛洛伊德與馬克思結合，主張壓抑並非文明存續的必要代價，存在一種「非壓制性昇華」的可能——這個相對樂觀的可能性設想，與阿多諾、霍克海默在《啟蒙辯證法》裡呈現的悲觀色調構成整個學派內部一組值得對讀的張力。"], "relations": [{"type": "繼承", "name": "霍克海默", "text": "1933 年加入霍克海默領導的法蘭克福社會研究所，是第一代核心成員之一，見霍克海默主頁"}, {"type": "對話", "name": "阿多諾", "text": "長期同僚，據傳兩人私交甚篤，但晚年在政治介入的態度上分歧明顯"}, {"type": "張力", "name": "阿多諾", "text": "戰後路線分歧的核心——馬庫色持續留在美國、積極介入六〇年代學運，阿多諾與霍克海默返回德國、晚年趨向政治悲觀與對學運的疏離甚至衝突（見阿多諾主頁 1968 年報警事件），三人同屬第一代卻走上不同的政治位置，是理解「法蘭克福學派」不是鐵板一塊的關鍵案例"}, {"type": "批判", "name": "馬丁·海德格", "text": "早年業師，因海德格與納粹的合作關係而與其決裂，未完成在海德格門下的教授資格論文"}, {"type": "呼應", "name": "六〇年代新左派學運（無單一代表人物）", "text": "思想上被廣泛視為運動的理論靈感來源之一，「新左派之父」的稱號即由此而來"}, {"type": "呼應", "name": "韓炳哲", "text": "韓炳哲對「自我剝削如何在沒有外部壓迫者的情況下運作」的分析，與馬庫色壓制性去昇華——異議與慾望被允許存在卻被結構性剝奪實現可能——在方法論精神上高度呼應，兩者都試圖解釋晚期資本主義如何生產出一種不需要暴力鎮壓、甚至讓人主動配合的宰制形式，儘管韓炳哲的分析焦點是自我剝削而非慾望的馴化"}], "intro_reading": ["《單向度的人》——與已建的〈壓制性去昇華的雛形〉卡直接對應，第一、三章優先", "〈壓制性容忍〉（收錄於多種選集）——短篇論文，最能感受他晚期政治立場的鋒利與爭議性"], "advanced_reading": ["《愛欲與文明》——佛洛伊德與馬克思的綜合嘗試，理解他與阿多諾、霍克海默悲觀色調之間張力的關鍵文本", "《理性與革命：黑格爾與社會理論的興起》（1941）——他對黑格爾的系統性解讀，較早期、較學院派的一本"]}, {"id": "phil-04", "name_zh": "哈伯瑪斯", "name_orig": "Jürgen Habermas", "dates": "1929–2026", "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "intro": "法蘭克福學派第二代公認的領袖人物，也是把批判理論從第一代的悲觀基調裡拉出來、重新給它一套規範性基礎的關鍵人物。以「溝通理性」與「公共領域」概念聞名，晚年高齡仍持續公共發言，是戰後德國最具影響力的公共知識分子之一。須特別註明：哈伯瑪斯已於 2026 年 3 月 14 日在德國施塔恩貝格過世，享耆壽 96 歲——這則消息晚於 Claude 的訓練資料截止時間，是透過網路查證確認的近期事實，寫這份主頁時他剛過世不久。", "background": ["1929 年生於杜塞道夫。求學橫跨哥廷根、蘇黎世、波昂大學，1954 年於波昂取得哲學博士。1956 年進入法蘭克福社會研究所，擔任阿多諾的研究助理——這是他與第一代學派最直接的機構與師承連結。1962 年出版第一本重要著作《公共領域的結構轉型》，確立學術聲望。", "1964 年，哈伯瑪斯接下的正是霍克海默在法蘭克福大學留下的哲學與社會學講座教職，這個位置具有象徵意義：他直接接續了第一代領袖留下的機構位置。1971 至 1983 年出任研究所所長（1983 年一度短暫回任），1994 年退休。晚年持續高齡筆耕與公共發言，直到 2026 年過世前不久仍在接受公開致意（見上方近期過世的查證說明）。"], "core_concepts": ["溝通理性／溝通行動：哈伯瑪斯理論體系的核心，見於巨著《溝通行動理論》（1981）。區分「策略行動」（以達成個人目的為導向，把他人當作工具）與「溝通行動」（以達成相互理解為導向，預設參與者之間平等的論證地位），主張後者蘊藏著一種未被完全工具化、值得被重建與捍衛的理性核心。", "公共領域：《公共領域的結構轉型》提出，指涉一個介於國家與私人領域之間、公民可以透過理性論辯形成公共意見的社會空間——這個空間在他分析裡經歷了從十八世紀布爾喬亞公共領域的興起，到二十世紀被大眾媒體與商業利益侵蝕、結構轉型的過程。", "對第一代學派的重建與批判：哈伯瑪斯認為《啟蒙辯證法》對「理性」的批判過於全面——如果連理性本身都已經被工具理性徹底污染，那麼批判理論賴以立論、賴以主張「這個社會不該是這樣」的立足點又是什麼？這個自我瓦解的疑慮，是他整套「溝通理性」計畫要解決的問題：不是放棄理性，而是在理性內部找出一種沒有被工具化污染的規範性核心（溝通理性），重新給批判理論一個站得住腳的基礎。"], "relations": [{"type": "繼承", "name": "阿多諾", "text": "1956 年起的直接師生／助理關係，見阿多諾主頁"}, {"type": "張力", "name": "阿多諾", "text": "對《啟蒙辯證法》（與霍克海默合著）的全面理性批判抱持根本保留，這是法蘭克福學派內部最重要的世代轉折——哈伯瑪斯代表的是從「否定辯證法」式的悲觀，轉向一套重新肯認理性規範性核心的「重建」計畫，兩代人對「理性能不能被拯救」這個問題給出了不同答案"}, {"type": "繼承", "name": "霍克海默", "text": "1964 年接下霍克海默在法蘭克福大學留下的講座教職，機構位置上的直接接班人"}, {"type": "張力", "name": "尚-法蘭索瓦·李歐塔", "text": "與後結構主義／後現代主義陣營（尤其李歐塔對「大敘事」的懷疑）長期論辯，哈伯瑪斯捍衛啟蒙理性計畫尚未完成、不該被放棄，這場交鋒是理解「批判理論」與「後結構主義／後現代主義」這兩個傳統標籤之間根本分歧的重要參照點"}, {"type": "批判", "name": "海德格", "text": "哈伯瑪斯早年求學階段深受《存在與時間》影響，但後期在《現代性的哲學論述》裡系統性批判海德格式的存有思考——認為它以一種詩化的姿態迴避了主體際溝通與規範性論證的問題，最終仍是一種未經社會化中介的孤獨主體哲學；這場批判也是他捍衛啟蒙理性計畫、與存在論／後結構主義陣營劃清界線的重要戰線之一"}, {"type": "對話", "name": "呂格爾", "text": "兩人晚年多次公開對話交流，共享對後形上學、卻仍然堅持規範性論證可能性的哲學立場，都試圖在拒絕基礎主義的同時不放棄理性論證與倫理規範的普遍有效性主張——是「批判理論」與「詮釋學」兩個傳統少見的正面交會"}, {"type": "張力", "name": "塞荷", "text": "兩人都以溝通作為理論核心關切，但取徑截然不同——哈伯瑪斯追求溝通行動裡的理性共識與相互理解，塞荷則主張噪音、寄生、干擾才是溝通得以持續運作的構成性條件，理性共識在塞荷那裡從來不是溝通的終點或目標"}, {"type": "對話", "name": "弗雷澤", "text": "弗雷澤的批判理論方法論深受哈伯瑪斯與法蘭克福學派傳統影響，尤其在公共領域與規範性論證的問題意識上，但她對哈伯瑪斯公共領域理論提出重要的女性主義批判——指出其預設了一種去性別化、去階級化的理性溝通主體，忽略了公共領域從一開始就是透過排除女性與工人階級的參與才得以構成的"}], "intro_reading": ["《公共領域的結構轉型》——他最早也最易讀的重要著作，公共領域概念的原始出處", "相關次級導論（如 James Gordon Finlayson 的 Habermas: A Very Short Introduction）——他的系統性理論門檻較高，建議先讀導論建立地圖"], "advanced_reading": ["《溝通行動理論》（兩卷本）——他最核心也最龐大的理論工程，建議先讀完導論性文獻再進", "《現代性的哲學論述》——他對後結構主義／後現代主義陣營最系統性的批判與回應，適合對讀朗西埃、德希達等卡片時參考"]}, {"id": "phil-30", "name_zh": "弗雷澤", "name_orig": "Nancy Fraser", "dates": "1947–（仍在世）", "traditions": ["法蘭克福學派／批判理論"], "date": "2026-08-22", "status": "定稿", "intro": "美國哲學家與批判理論家，當代正義理論最重要的思想家之一。以「承認」（recognition）與「再分配」（redistribution）兩種正義訴求之間的結構性張力聞名——主張只強調文化承認（多元、包容、身分認同）而不觸及經濟再分配的「進步」論述，是一種殘缺的解放，這個分析框架成為理解晚期資本主義下身分政治與階級政治之間關係最重要的理論工具之一。近年思想持續深化，把資本主義批判擴展至涵蓋生態、社會再生產、種族壓迫等多重維度。", "background": ["1947 年生於美國馬里蘭州巴爾的摩，1969 年於布林莫爾學院取得哲學學士學位，1980 年於紐約市立大學研究生中心取得哲學博士學位。此後長期任教於西北大學哲學系，1995 年轉任紐約社會研究新學院，擔任亨利與露易絲·洛布哲學與政治學講座教授至今（近年轉為榮譽教授身分），同時是《新左評論》編輯委員會成員。", "1989 年出版《不馴的實踐》，展開對權力、話語、性別在當代社會理論裡如何被理論化的批判性檢視。1995 年發表〈從再分配到承認？後社會主義時代正義的兩難〉，這篇單篇論文後收錄於 1997 年出版的《正義中斷》，是她整個承認／再分配理論框架最精簡的原初表述，對後續學界討論產生深遠影響。2003 年與德國哲學家阿克塞爾·霍耐特合著出版《重新分配還是承認？政治哲學的交流》，透過與霍耐特承認理論的直接辯論，更完整地展開她自己的立場——弗雷澤主張承認與再分配是兩種不可化約為對方的正義向度，霍耐特則主張承認才是更根本的規範性基礎、再分配問題最終也可以被理解為一種承認的缺失。近年她的理論關注持續擴展，2018 年與哲學家拉赫爾·耶吉合著《資本主義：批判理論的對話》，2022 年出版《食人資本主義》，把資本主義批判系統性延伸至生態危機、照護工作、種族壓迫等多重維度，主張這些危機不是資本主義的外部效應，而是資本主義內在矛盾的不同展現形式。2026 年獲哈佛大學設計研究所任命為春季駐校洛布資深學者。"], "core_concepts": ["進步新自由主義：弗雷澤對當代主流自由派政治提出的重要診斷——把進步的文化政治（多樣性、包容、身分承認）與新自由主義的經濟政策（去管制、金融化、緊縮）結合，形成一種不觸及物質分配結構、卻自我標榜為「進步」的政治論述，這個組合某種程度上為右翼民粹主義的興起提供了土壤。", "承認 vs. 再分配：兩種正義訴求之間的根本張力——承認訴求要求肯認特定文化身分與差異的價值，再分配訴求要求物質資源與經濟機會的公平分配，弗雷澤主張只有承認而無再分配，是一種殘缺的解放，兩者必須整合而非彼此取代。", "代表：弗雷澤後期加入的第三個正義維度——不只是分配與承認，還有政治代表權的問題，這個維度特別關注全球化時代裡跨國正義議題的政治框架問題。", "食人資本主義：晚期理論最重要的擴展——主張資本主義體制系統性地「吞噬」它自身運作所依賴、卻不被計入生產成本的各種條件：無償的家務與照護勞動、自然生態系統的承載能力、公共財政與治理能力、種族化的剝削勞動力，資本主義對這些條件的持續侵蝕，最終也會反過來威脅資本主義自身的存續能力。"], "relations": [{"type": "對話", "name": "哈伯瑪斯", "text": "弗雷澤的批判理論方法論深受哈伯瑪斯與法蘭克福學派傳統影響，尤其在公共領域與規範性論證的問題意識上；她對哈伯瑪斯公共領域理論的女性主義批判是重要的理論延伸與修正"}, {"type": "批判", "name": "巴特勒", "text": "與巴特勒之間曾有一場重要的理論辯論——弗雷澤批評巴特勒式的展演性理論過度聚焦於文化與話語層面的性別政治，有可能淡化對物質分配不平等的關注，這場交鋒是理解承認政治與再分配政治之間張力最具體的學術案例之一"}, {"type": "呼應", "name": "哈維", "text": "兩人都關切晚期資本主義如何生產與掩蓋自身運作所依賴的隱藏條件——哈維聚焦於空間與地理層面的掠奪性積累，弗雷澤聚焦於再生產勞動、生態、種族等被資本主義系統性「吞噬」卻不被計入成本的隱藏條件，食人資本主義理論與哈維的分析在方法論精神上高度呼應"}], "intro_reading": ["〈從再分配到承認？後社會主義時代正義的兩難〉——單篇論文，是整個理論框架的精簡版，收錄於《正義中斷》", "《食人資本主義》——晚期理論的整合性總結，語言相對平易，直接對應當代多重危機的分析架構"], "advanced_reading": ["《重新分配還是承認？政治哲學的交流》（與阿克塞爾·霍耐特合著）——與霍耐特的辯論，極好的入門方式", "《資本主義：批判理論的對話》（與拉赫爾·耶吉合著）——弗雷澤對資本主義本身最新的理論化嘗試"]}, {"id": "phil-05", "name_zh": "海德格", "name_orig": "Martin Heidegger", "dates": "1889–1976", "traditions": ["現象學／存在主義／詮釋學"], "date": "2026-08-22", "status": "定稿", "intro": "20 世紀最具影響力也最具爭議的哲學家之一。用《存在與時間》（1927）重新提出了「存在的意義」這個被西方形上學遺忘的問題，將現象學方法轉向存在論，深刻影響了存在主義、詮釋學、解構主義幾乎整個歐陸傳統。1933 年短暫出任弗萊堡大學校長並加入納粹黨，這段政治汙點終身伴隨他的哲學遺產，是理解他思想時無法迴避的爭議。", "background": ["1889 年生於德國巴登邦梅斯基希一個天主教家庭，少年時原本準備成為神父，後轉向哲學，1909 年進入弗萊堡大學。1913 年取得哲學博士，1916 年完成教授資格論文。1919 年成為胡塞爾的助理，深受現象學方法薰陶，但很快開始對胡塞爾的先驗主體性轉向感到不滿，著手激進重新詮釋現象學。", "1923 年轉任馬堡大學副教授，在此期間對亞里士多德與奧古斯丁的詮釋學式重讀吸引了一批日後極具影響力的學生，包括漢娜·鄂蘭、赫伯特·馬庫色、卡爾·洛維特、漢斯·約納斯、高達美。1927 年出版《存在與時間》，一舉成名，隔年獲聘接替退休的胡塞爾，回到弗萊堡出任哲學講座教授。", "1933 年希特勒掌權後，海德格當選弗萊堡大學校長並加入納粹黨，這段歷史，加上他利用校長職權對猶太裔的胡塞爾實施圖書館禁入的具體行為，是戰後與至今持續的學術爭議焦點。戰後盟軍當局一度禁止他任教，1951 年才恢復教職與講學。1966 與 1968 年，他在法國南部小鎮勒托爾舉辦私人研討班，吸引義大利哲學家阿岡本等後進親自參與。晚年思想轉向對技術、詩、語言的沉思（所謂「轉向」Kehre），1976 年病逝於弗萊堡。"], "core_concepts": ["存在的意義（Sein／Seinsfrage）：《存在與時間》的核心提問——西方形上學自柏拉圖以來持續追問「什麼存在」，卻遺忘了追問「存在本身」是什麼意思，這個「存在論差異」是他整個思想的起點。", "此在（Dasein）：海德格拒絕用傳統「主體」「意識」談人，改用「此在」——那個唯一會追問自己存在意義的存在者，其存在方式是「在世存有」，永遠已經被拋入一個充滿意義關聯的世界。", "常人（das Man）與本真性（Eigentlichkeit）：此在日常多半沉淪於「常人」，唯有向死而生、正視自身的有限性，此在才可能奪回本真的自我籌劃。", "存在的歷史與轉向（Kehre）：1930 年代後，海德格的關注從此在的生存論分析轉向「存在本身如何在歷史中自行開顯又自行遮蔽」，林中空地（Lichtung）是這個晚期思想的核心意象。", "泰然任之（Gelassenheit）：晚期海德格對現代技術文明的診斷極為悲觀，認為技術的本質已經把萬物化約為「常備儲存」，他提出的回應是一種讓存有自行到來的、非意志性的姿態。"], "relations": [{"type": "繼承", "name": "胡塞爾", "text": "海德格早年的現象學方法直接承自胡塞爾，擔任其助理多年，但他把胡塞爾的先驗現象學徹底改造為存在論方法，兩人晚年因學術路線分歧與海德格的納粹立場而關係破裂"}, {"type": "繼承", "name": "沙特", "text": "沙特的《存在與虛無》大量借用海德格的存在論詞彙發展出自己的存在主義，但海德格本人在戰後明確與沙特式「存在主義即人道主義」的口號劃清界線"}, {"type": "批判", "name": "沙特", "text": "海德格認為沙特誤讀了他，把「存在先於本質」讀成另一種人本主義的主體哲學"}, {"type": "批判", "name": "阿多諾", "text": "阿多諾在《本真性的行話》一書專門批判海德格式的存在主義語彙裝出深刻感，實則迴避了具體的社會歷史分析"}, {"type": "繼承", "name": "馬庫色", "text": "馬庫色早年回到弗萊堡跟隨海德格研讀現象學，因不滿海德格與納粹的合作關係，最終放棄這條學術路徑"}, {"type": "繼承", "name": "列維納斯", "text": "列維納斯早年赴弗萊堡師從胡塞爾與海德格，是他將現象學引介入法國的重要橋樑，但戰後發展出對海德格存在論最根本的倫理學批判"}, {"type": "張力", "name": "列維納斯", "text": "列維納斯認為海德格式的存在論仍是一種「總體性」思維，倫理學（他者的臉）必須先於存在論"}, {"type": "呼應", "name": "德勒茲", "text": "兩人都拒絕柏拉圖式的垂直超越結構，但海德格的林中空地仍保留「存有致意、此在回應」的方向性，德勒茲的內在性平面則沒有任何等待被揭露的東西"}, {"type": "繼承", "name": "鄂蘭", "text": "鄂蘭是海德格馬堡時期的學生，她後來發展出的政治行動理論、複數性、誕生性概念，是對海德格式此在孤獨面對死亡的沉思的一種政治性回應與偏移"}, {"type": "繼承", "name": "德希達", "text": "德希達的延異概念在形式上直接承自海德格晚期存在論差異的思考"}, {"type": "批判", "name": "德希達", "text": "德希達批判海德格晚期思想裡仍殘留某種對「存有本身」的鄉愁式追尋，質疑這是否是另一種形式的在場形上學"}, {"type": "繼承", "name": "阿岡本", "text": "阿岡本兩度親自參與海德格 1966、1968 年在勒托爾舉辦的私人研討班，存在論差異、潛能與現實性的思考是阿岡本方法論的重要起點"}], "intro_reading": ["《形上學導論》——比《存在與時間》更短、更易入手的講稿，能快速抓住「為何存在有問題」這個提問方式", "《存在與時間》（上部，尤其第一篇）——繞不過去的核心文本，建議搭配二手導讀一起讀"], "advanced_reading": ["《林中路》——晚期轉向後對藝術作品、尼采、詩與語言的論文集", "《關於人道主義的信》——他對沙特存在主義最直接的回應與劃界"]}, {"id": "phil-06", "name_zh": "沙特", "name_orig": "Jean-Paul Sartre", "dates": "1905–1980", "traditions": ["現象學／存在主義／詮釋學"], "date": "2026-08-22", "status": "定稿", "intro": "二十世紀最具公眾影響力的哲學家之一，存在主義的代名詞，同時是小說家、劇作家、政治行動者。《存在與虛無》（1943）建立了一套以自由與虛無化為核心的存在主義本體論，主張「存在先於本質」——人沒有預先給定的本質，而是透過自己的選擇不斷把自己籌劃出來。1964 年獲頒諾貝爾文學獎但主動拒絕領取。", "background": ["1905 年生於巴黎，父親在他一歲多時過世，由母親與外祖父撫養長大。1924 年考入巴黎高等師範學院，1929 年以第一名通過教師資格會考，西蒙·波娃當年考第二名——兩人自此建立終身的開放伴侶關係，同期同學還包括梅洛龐蒂、雷蒙·阿隆。", "1933 年獲獎助金赴柏林研究胡塞爾與海德格的現象學一年。1938 年出版小說《嘔吐》確立文名，1940 年被德軍俘虜，在戰俘營中閱讀海德格《存在與時間》，九個月後獲釋返回巴黎。1943 年出版《存在與虛無》，奠定其存在主義哲學的系統性基礎。戰後成為法國最具公眾能見度的知識分子，主編《現代》雜誌，晚年轉向馬克思主義，嘗試在《辯證理性批判》裡調和存在主義與馬克思主義。1964 年獲諾貝爾文學獎，以「作家不應讓自己被建制化」為由主動拒領。1980 年因肺疾病逝於巴黎，葬禮有數萬人自發上街送行。"], "core_concepts": ["存在先於本質：沙特存在主義最著名的口號——人先存在，然後透過自己的行動與選擇把自己定義出來，這使人對自己的存在負有徹底的責任。", "虛無化與自為：意識總是能夠「虛無化」它所面對的東西，在自身與世界之間引入一道空無的距離，這正是自由得以可能的結構性條件。", "自由與責任：意識的虛無化結構意味著人永遠不能被任何處境完全決定，人被判了自由的刑——自由不是一種恩賜，而是意識存在方式本身無可逃避的重負。", "壞信仰：人逃避自由重負的典型策略——把自己說成像物一樣被決定，藉此否認自己作為自為存在、永遠能夠自我超越的事實。", "他人與凝視：與海德格的此在分析不同，沙特認為與他人的根本關係是衝突性的——他人的凝視把我客體化，主體際性的原初結構是鬥爭而非共在。"], "relations": [{"type": "繼承", "name": "海德格", "text": "沙特在戰俘營裡讀《存在與時間》，《存在與虛無》大量借用海德格的存在論詞彙架構自己的存在主義本體論"}, {"type": "批判", "name": "海德格", "text": "海德格本人認為沙特把他的存在論誤讀、收編進一套仍然以主體性為中心的人道主義"}, {"type": "呼應", "name": "柏格森", "text": "沙特少年時因閱讀柏格森《時間與自由意志》而對哲學產生興趣"}, {"type": "批判", "name": "柏格森", "text": "後來在《存在與虛無》〈否定的起源〉一章直接批判柏格森對「虛無」概念的處理過於實在化"}, {"type": "對話", "name": "梅洛龐蒂", "text": "ENS 同學與戰後長期合作夥伴，共同創辦《現代》雜誌，但兩人對身體現象學與馬克思主義政治立場的分歧最終導致決裂"}, {"type": "張力", "name": "德勒茲", "text": "沙特式的否定與德勒茲式的肯定本體論構成一組尚未解決的根本張力"}, {"type": "批判", "name": "阿多諾", "text": "阿多諾雖然肯定沙特介入政治的姿態，但在《否定辯證法》裡對存在主義式的「自由」概念仍抱持懷疑"}, {"type": "批判", "name": "傅柯", "text": "傅柯以「人之死」命題與反主體、反人道主義立場，對沙特式主體中心的存在主義展開世代性反叛"}, {"type": "批判", "name": "羅蘭巴特", "text": "巴特《寫作的零度》開篇即針對沙特「介入文學」的主張展開質疑"}, {"type": "對話", "name": "法農", "text": "為法農《大地上的受苦者》撰寫序言，但法農本人也批判沙特為桑戈爾詩選撰寫的序言〈黑色奧菲斯〉，認為沙特把「黑人性」運動化約為黑格爾辯證法邁向普遍人性解放過程裡的一個過渡階段"}], "intro_reading": ["《存在主義即是一種人文主義》——1945 年的公開演講整理成書，篇幅短、論證直接", "《嘔吐》——用小說形式呈現偶然性這個核心哲學經驗"], "advanced_reading": ["《存在與虛無》——他最重要也最龐大的哲學著作", "《辯證理性批判》——晚期嘗試調和存在主義與馬克思主義的系統性嘗試"]}, {"id": "phil-07", "name_zh": "列維納斯", "name_orig": "Emmanuel Levinas", "dates": "1906–1995", "traditions": ["現象學／存在主義／詮釋學"], "date": "2026-08-22", "status": "定稿", "intro": "立陶宛出生的法國猶太哲學家，把胡塞爾與海德格的現象學引介入法國的關鍵人物，但戰後基於自身猶太身分與大屠殺的切身經歷，發展出對整個西方存在論傳統最根本的倫理學挑戰——主張倫理學而非存在論才是「第一哲學」，他者的臉對我發出的無限責任要求，先於任何關於存在的認知或掌握。", "background": ["1906 年生於立陶宛考納斯一個正統猶太家庭。1923 年赴法國史特拉斯堡大學攻讀哲學，結識莫里斯·布朗肖並成為終身摯友。1928 至 1929 學年赴弗萊堡大學，親炙胡塞爾晚期講座，並接觸到剛出版的海德格《存在與時間》，深受震撼。", "二戰期間以法國籍軍官身分被俘，在德國戰俘營度過大半戰爭歲月，但留在立陶宛的家人幾乎全數死於大屠殺，這場個人與民族的雙重創傷成為他戰後思想轉向的核心動力。戰後長期擔任巴黎東方猶太師範學校校長，直到 1973 年才獲聘為索邦大學哲學教授。1961 年出版博士論文《總體與無限》，1974 年出版《超越存在或本質之外》，1995 年病逝於巴黎近郊克利希。"], "core_concepts": ["他者的臉：列維納斯倫理學的核心現象——他人的臉以一種無法被我的認知範疇收編、無法被我的權力掌控的方式向我顯現，臉本身發出「不可殺人」的無聲命令。", "倫理學作為第一哲學：存在論試圖把一切存在者納入一個可理解的總體之中，這個把握他者的衝動本身就是一種暴力；真正的第一哲學必須是對他者的無限責任。", "總體性與無限：總體是主體試圖將他者同化進自身理解視域的運動；無限則是他者始終逾越、溢出任何我能給予他的概念範疇的那個「過剩」。", "責任先於自由：主體性的原初結構是被他者的臉所質問、所召喚的責任，這個責任先於我的任何自主選擇，徹底顛倒了西方哲學以自主主體為起點的傳統。", "說與所說：晚期著作區分「說」這個朝向他者、始終在場的倫理姿態，與「所說」這個一旦被固定為命題後就已經被總體化的內容。"], "relations": [{"type": "繼承", "name": "胡塞爾", "text": "列維納斯的博士論文即以胡塞爾現象學中的直觀理論為題，終身自認是胡塞爾現象學方法的忠實但激進的改造者"}, {"type": "繼承", "name": "海德格", "text": "列維納斯早年赴弗萊堡受教於海德格，深受《存在與時間》震撼，是他後續哲學語彙的重要來源"}, {"type": "批判", "name": "海德格", "text": "戰後基於大屠殺的親身經歷，列維納斯認定海德格式存在論本質上仍是一種將他者收編進「總體」的權力運作"}, {"type": "張力", "name": "德勒茲", "text": "列維納斯把倫理學的絕對起點賦予「臉」，德勒茲一側可能反問：這是否重新引入了一套排他性位階"}, {"type": "對話", "name": "沙特", "text": "兩人同屬法國現象學世代，但列維納斯對沙特式以自由與虛無化為核心的主體哲學抱持距離"}, {"type": "呼應", "name": "鄂蘭", "text": "兩人的倫理-政治思考都試圖在海德格式此在的孤獨存在論之外，重新給「與他人共在」一個更根本的地位"}, {"type": "呼應", "name": "柏格森", "text": "列維納斯早年在史特拉斯堡求學期間深受柏格森影響，對綿延概念的興趣是他後續轉向現象學的重要早期資源"}, {"type": "對話", "name": "呂格爾", "text": "兩人同屬深受猶太教與現象學傳統影響的法國哲學家，南泰爾大學時期曾為同事"}], "intro_reading": ["《時間與他者》——篇幅短，是他從現象學過渡到倫理學思考的早期講稿", "《困難的自由》——猶太教相關文集"], "advanced_reading": ["《總體與無限》——他最重要的博士論文著作，系統性建立「臉」與「無限」的倫理學本體論", "《超越存在或本質之外》——晚期最成熟的哲學表述"]}, {"id": "phil-19", "name_zh": "呂格爾", "name_orig": "Paul Ricoeur", "dates": "1913–2005", "traditions": ["現象學／存在主義／詮釋學"], "date": "2026-08-22", "status": "定稿", "intro": "法國哲學家，二十世紀最重要的詮釋學家之一，畢生致力於把現象學的描述方法與詮釋學的意義解讀方法結合起來。以「敘事身分」理論聞名——主張自我不是一個現成、透明的實體，而是透過持續講述、重述自己生命故事而被建構出來的東西。與海德格、高達美並列詮釋現象學三大代表人物。", "background": ["1913 年生於法國瓦朗斯一個新教家庭，出生後不久母親過世，父親一戰陣亡，由祖父母與姑姑撫養長大。1935 年通過哲學教師資格會考。二戰期間 1940 年被德軍俘虜，在戰俘營中度過五年，期間與獄友組織讀書會研讀胡塞爾與雅斯培，此後花費多年時間翻譯胡塞爾《觀念一》成法文。", "戰後任教於多所學校，1970 年接替保羅·田立克，出任芝加哥大學神學院與哲學系合聘的講座教授，直到 1992 年退休。終身出版著作超過二十七本，2005 年病逝於巴黎近郊沙特奈馬拉布里。"], "core_concepts": ["懷疑的詮釋學：呂格爾將馬克思、尼采、佛洛伊德並稱為「懷疑的大師」，呂格爾接受這套懷疑方法論的必要性，但主張它必須與「恢復的詮釋學」保持辯證的張力。", "敘事身分：自我認同既不是一個現成不變的實體，也不是完全流動無形的虛無，而是透過持續把自己生命裡的片段事件組織進一個連貫敘事而構成的動態身分。", "同一與自身：idem 指涉那種要求嚴格不變的身分概念，ipse 則指涉一種即使歷經改變仍然維持「是我自己」這個自身指涉的身分形式——敘事正是能夠同時容納變化與持存的中介裝置。", "隱喻的活力：隱喻不是裝飾性的修辭手法，而是一種真正的語意創新，透過把原本不相關的語意場域並置碰撞，能夠揭示新的實在面向。", "承認的歷程：晚期倫理學核心關懷，追問承認這個概念在自我認識、對他人的辨識、以及要求他人承認自己這三個層次之間的複雜辯證關係。"], "relations": [{"type": "繼承", "name": "海德格", "text": "與高達美同屬詮釋現象學傳統的核心代表人物，方法論上承接海德格把理解視為此在存在方式而非單純認識論操作的洞見"}, {"type": "張力", "name": "傅柯、德希達", "text": "呂格爾明確將自己的立場定位為對後結構主義消解主體傾向的抗衡"}, {"type": "對話", "name": "列維納斯", "text": "兩人同屬深受猶太教與現象學傳統影響的法國哲學家，都高度重視他者與倫理關係的優先性"}, {"type": "對話", "name": "哈伯瑪斯", "text": "兩人晚年多次公開對話交流，共享對後形上學、卻仍然堅持規範性論證可能性的哲學立場"}, {"type": "張力", "name": "羅蘭巴特", "text": "呂格爾的懷疑詮釋學方法論部分正是針對結構主義將意義化約為封閉系統內部差異關係的傾向而提出"}], "intro_reading": ["《從文本到行動》——文集形式，涵蓋詮釋學方法論的核心論證", "《隱喻的活力》——語言哲學代表作，篇幅適中"], "advanced_reading": ["《時間與敘事》（三卷）——他最重要的體系性巨著，敘事身分理論最完整的展開", "《自身如同他者》——晚期倫理學與主體哲學最成熟的表述"]}, {"id": "phil-08", "name_zh": "德勒茲", "name_orig": "Gilles Deleuze", "dates": "1925–1995", "traditions": ["差異與內在性哲學"], "date": "2026-08-22", "status": "定稿", "intro": "二十世紀下半葉最具原創性的法國哲學家之一，畢生致力於建構一套徹底肯定性、拒絕匱乏與否定作為根本結構的內在性哲學。早期以尼采、柏格森、史賓諾莎的獨特重讀著稱，1969 年出版《差異與重複》與《意義的邏輯》確立自己的哲學體系，此後與精神分析學家瓜達里長期合作。1995 年因肺疾長期折磨後跳樓自殺。", "background": ["1925 年生於巴黎中產家庭，兄長參與法國抵抗運動，被捕後在押送奧許維茲集中營途中死亡。1944 年進入巴黎索邦大學攻讀哲學。早期著作是一系列對哲學史邊緣人物的重讀——休謨、尼采、柏格森、史賓諾莎。", "1969 年同時通過兩篇國家博士論文答辯，分別出版為《差異與重複》與《意義的邏輯》。同年經由傅柯引介認識瓜達里，兩人自此展開長達二十餘年的合作，1972 年出版《反伊底帕斯》，1980 年出版《千高原》。1969 年起任教於巴黎第八大學萬塞納校區，直到 1987 年退休。1995 年 11 月從巴黎公寓的窗口跳樓自盡。"], "core_concepts": ["差異先於同一：西方形上學傳統習慣把差異理解為對某個先在同一性的偏離，德勒茲主張差異本身才是本源性的。", "存在的單義性：存在以完全同一個意義述說一切存在物，這是他肯定性本體論最根本的形上學承諾。", "事件與意義的邏輯：意義不是被找到或被賦予的東西，而是在身體因果的深度與命題表達的高度之間那個「表面」上，作為非身體性效應被生產出來的純粹事件。", "無器官身體與逃逸線：欲望不是對匱乏對象的追逐，而是生產性的力量；逃逸線是任何固化系統內部總是存在的、朝向解轄域化的運動路徑。", "根莖與遊牧思想：《千高原》提出的方法論意象，對抗以樹狀階層結構組織知識的傳統思維方式。"], "relations": [{"type": "繼承", "name": "柏格森", "text": "早期專著《柏格森主義》系統性重新啟動了柏格森哲學，是他後續整個差異本體論最重要的系譜源頭"}, {"type": "呼應", "name": "尼采", "text": "《尼采與哲學》是他哲學生涯的奠基之作，永恆回歸的肯定性讀法是他終身肯定性倫理學的核心資源"}, {"type": "呼應", "name": "史賓諾莎", "text": "確立了存在的單義性、情動作為身體能力增減的核心詞彙，是《千高原》此性概念的直接母體"}, {"type": "張力", "name": "沙特", "text": "德勒茲的肯定性本體論與沙特式虛無化、以欠缺定義自由的存在論構成一組根本張力"}, {"type": "呼應", "name": "海德格", "text": "兩人都拒絕柏拉圖式的垂直超越結構，但海德格的林中空地仍保留方向性，德勒茲的內在性平面則沒有任何等待被揭露的東西"}, {"type": "批判", "name": "巴迪歐", "text": "巴迪歐系統性批判德勒茲的內在性本體論最終仍隱含某種一元論式的「一」"}, {"type": "批判", "name": "齊澤克", "text": "齊澤克批判德勒茲的欲望生產理論迴避了拉岡意義上欲望的根本匱乏結構與否定性"}, {"type": "對話", "name": "傅柯", "text": "兩人長期共事、共同參與監獄資訊小組等政治行動，傅柯曾稱「這個世紀將是德勒茲的世紀」"}, {"type": "呼應", "name": "拉圖", "text": "兩人的本體論都拒絕預先給定的固定實體，德勒茲的塊莖式思考與拉圖的行動者網絡在方法論精神上高度呼應"}], "intro_reading": ["《尼采與哲學》——公認是進入他思想體系最平易的入口", "《對話》（與 Claire Parnet 合著）——訪談體裁，語氣最貼近口語"], "advanced_reading": ["《差異與重複》——他自認最重要的哲學著作，體系性地建立差異本體論", "《千高原》（與瓜達里合著）——概念密度與寫作風格都是全然不同的一套系統"]}, {"id": "phil-09", "name_zh": "柏格森", "name_orig": "Henri Bergson", "dates": "1859–1941", "traditions": ["差異與內在性哲學"], "date": "2026-08-22", "status": "定稿", "intro": "二十世紀初法國最具公眾影響力的哲學家，第一位系統性建立「過程哲學」的思想家，主張以綿延——一種質性的、不可分割的時間經驗——取代科學與常識慣用的空間化時間觀。1927 年獲諾貝爾文學獎，是德勒茲差異本體論最重要的系譜源頭之一。", "background": ["1859 年生於巴黎，1878 年考入巴黎高等師範學院，1881 年通過哲學教師資格會考時屈居涂爾幹之後第二名。1889 年出版博士論文《論意識的直接材料》，提出綿延概念。1900 年獲聘法蘭西學院講座教授，1907 年出版《創造的進化論》，提出「生命衝力」概念。", "1914 年當選法蘭西學院院士，1922 年與愛因斯坦就相對論的時間概念展開公開辯論。1927 年獲頒諾貝爾文學獎。晚年雖然對天主教信仰日益傾心，但在納粹反猶浪潮下堅持不放棄猶太身分認同，1941 年病逝於德軍佔領下的巴黎。"], "core_concepts": ["綿延：真正的時間不是科學或常識想像的那種可以被切割成均勻單位的東西，而是一種質性的、異質的、不斷相互滲透累積的意識流動。", "空間化時間 vs. 真實綿延：柏格森認為西方哲學與科學系統性地把時間「空間化」了，這種做法從根本上扭曲了意識真正經驗到時間的方式。", "直覺作為方法：與智性相對——智性擅長分析、切割，但永遠無法把握綿延本身；直覺是一種與對象內部共感、從內部把握其綿延流動的認知方式。", "生命衝力與創造性演化：生物演化是一股不斷自我分化、不可預先計算的創造性衝力向前推進。", "虛無概念的批判：柏格森論證「絕對的虛無」是一個偽概念，虛無這個概念永遠寄生在存在概念之上，這個論證正是沙特直接交鋒批判的對象。"], "relations": [{"type": "批判", "name": "沙特", "text": "沙特年少時因閱讀柏格森而走向哲學，但在《存在與虛無》裡系統性批判柏格森對虛無的處理"}, {"type": "繼承", "name": "德勒茲", "text": "早期專著《柏格森主義》系統性重新啟動了柏格森哲學，綿延、虛擬與現實的區分是德勒茲差異本體論最重要的系譜源頭"}, {"type": "批判", "name": "海德格", "text": "海德格在《存在與時間》裡把柏格森歸入延續亞里士多德以降「將時間空間化」傳統的行列加以批判"}, {"type": "呼應", "name": "列維納斯", "text": "列維納斯早年在史特拉斯堡求學期間深受柏格森影響"}, {"type": "對話", "name": "阿多諾", "text": "柏格森的直覺方法論在阿多諾《否定辯證法》裡被列為對抗概念暴力的先行嘗試之一，但阿多諾同時對其過於信任「直接性」的傾向抱持保留"}], "intro_reading": ["《創造的進化論》——體系最完整、影響最深遠的著作", "《形上學導論》——篇幅短，直接說明直覺方法與分析方法的區別"], "advanced_reading": ["《物質與記憶》——處理身心關係與記憶理論最系統性的著作", "《道德與宗教的兩個來源》——晚年最後一部重要著作"]}, {"id": "phil-10", "name_zh": "德希達", "name_orig": "Jacques Derrida", "dates": "1930–2004", "traditions": ["後結構主義"], "date": "2026-08-22", "status": "定稿", "intro": "解構一詞的發明者，二十世紀下半葉對西方形上學最徹底的內部瓦解者之一。阿爾及利亞出生的法國猶太裔哲學家，早年以胡塞爾現象學研究起家，1967 年一年內連出三本書確立解構方法，此後畢生致力於揭露西方思想「在場的形上學」如何在文本最細密的縫隙裡自我瓦解。", "background": ["1930 年生於阿爾及利亞阿爾及爾郊區埃爾比亞一個講法語的塞法迪猶太中產家庭。1942 年維希政府反猶政策下遭學校開除。1952 年考入巴黎高等師範學院，主要研究方向是胡塞爾現象學。", "1964 至 1984 年在 ENS 任教，一度與阿圖塞共用辦公室。1967 年同時出版《書寫與差異》《論文字學》《言說與現象》三本書，確立解構方法的基本裝備。1986 年起長期任教於加州大學爾灣分校。1980 年代晚期起，寫作明確轉向倫理、政治、宗教主題，2004 年因胰臟癌病逝於巴黎。"], "core_concepts": ["延異：意義永遠處於一種既非在場、也非缺席的延宕運動中，任何符號的意義都仰賴與其他符號的差異關係。", "在場的形上學批判：整個西方哲學傳統都預設了某種可以被完整掌握的「在場」，解構的工作就是在文本內部找出這個預設如何自我瓦解的裂縫。", "蹤跡：任何在場的東西之所以能夠被辨識為「在場」，都必須依賴不在場的東西留下的痕跡作為對照。", "解構作為閱讀策略：解構不是外部強加給文本的破壞性操作，而是文本自身內部已經存在的張力被逼顯出來的過程。", "檔案熱病與死亡驅力：檔案化行為在保存記憶的同時必然生產遺忘，排除比包含更具決定性。"], "relations": [{"type": "繼承", "name": "胡塞爾", "text": "博士論文與第一本書都以胡塞爾現象學為對象"}, {"type": "批判", "name": "胡塞爾", "text": "解構計畫的起手式正是指出胡塞爾試圖用先驗現象學拯救「在場」形上學的努力必然失敗"}, {"type": "呼應", "name": "海德格", "text": "德希達的延異在形式上與海德格晚期存在論差異高度呼應"}, {"type": "批判", "name": "海德格", "text": "德希達批判海德格晚期思想裡仍殘留某種對「存有本身」的鄉愁式追尋"}, {"type": "批判", "name": "傅柯", "text": "1963 年批判傅柯《瘋狂史》試圖用理性語言為瘋狂發聲的計畫邏輯上不可能成立"}, {"type": "呼應", "name": "德勒茲", "text": "兩人同屬法國後結構主義世代，但情緒底色相反——德希達的延異是延宕，德勒茲的差異是生產性、肯定性的"}, {"type": "呼應", "name": "巴特勒", "text": "巴特勒的展演性理論直接借用德希達對奧斯汀言語行為理論的解構式重讀"}, {"type": "同事", "name": "阿圖塞", "text": "1960 年代在 ENS 任教期間一度共用辦公室"}], "intro_reading": ["《立場》——訪談集，德希達親自用相對平實的語言解釋自己的方法論", "《書寫與差異》——三本奠基作之一"], "advanced_reading": ["《論文字學》——最系統性提出延異、蹤跡等核心論證的著作", "《檔案熱病》——篇幅短、晚期文本"]}, {"id": "phil-11", "name_zh": "傅柯", "name_orig": "Michel Foucault", "dates": "1926–1984", "traditions": ["後結構主義", "生命政治"], "date": "2026-08-22", "status": "定稿", "intro": "二十世紀下半葉最具影響力的思想家之一，畢生致力於揭露瘋狂、疾病、犯罪、性等看似自然的範疇，其實是特定歷史時刻裡權力與知識共構的產物。以《規訓與懲罰》《性史》等著作徹底改寫了「權力」該如何被思考。1984 年死於愛滋病相關併發症。", "background": ["1926 年生於普瓦捷一個醫生世家。1946 年考入巴黎高等師範學院，師從喬治·岡居朗、讓·伊波利特、莫里斯·梅洛龐蒂，並受教於阿圖塞——阿圖塞說服他於 1950 年加入法國共產黨。", "1961 年博士論文出版為《瘋狂史》，1966 年《詞與物》使他聲名大噪。1968 年學運後政治態度轉趨積極，成為監獄資訊小組創始成員之一。1969 年當選法蘭西學院院士。1975 年出版《規訓與懲罰》，1976 年起陸續出版《性史》系列，1984 年因愛滋病相關敗血症病逝於巴黎。"], "core_concepts": ["知識-權力：權力是彌散在整個社會關係網絡裡的生產性運作，不只禁止，更生產知識、身體、主體性。", "規訓：現代權力的典型運作方式——透過時間表、監視、考核、空間分配等精密技術，把身體訓練成馴服而有用的個體。", "系譜學：承自尼采的方法論，主張任何看似自然、永恆的範疇都是特定歷史偶然性與權力鬥爭下的產物。", "話語與知識型：特定歷史時期存在一套決定什麼可以被說出的深層規則體系，這套規則體系本身有其歷史斷裂。", "生命權力／生命政治：現代權力的核心運作已從古典主權轉向一種「使人活、任人死」的生命權力，這個概念後來成為阿岡本等人生命政治理論的直接源頭。"], "relations": [{"type": "繼承", "name": "阿圖塞", "text": "ENS 時期的老師，說服他加入共產黨"}, {"type": "繼承", "name": "梅洛龐蒂", "text": "ENS 時期的指導教師之一，早期心理學訓練與現象學背景由此而來"}, {"type": "張力", "name": "沙特", "text": "傅柯以「人之死」命題對沙特式主體中心的存在主義展開世代性反叛"}, {"type": "批判", "name": "德希達", "text": "兩人針對《瘋狂史》展開多年知識論戰"}, {"type": "對話", "name": "德勒茲", "text": "長期共事的親密盟友，共同參與監獄資訊小組等政治行動"}, {"type": "呼應", "name": "霍克海默與阿多諾", "text": "啟蒙理性宰制自身的辯證診斷與傅柯規訓權力生產性運作分析高度呼應"}, {"type": "批判", "name": "阿岡本", "text": "阿岡本的牲人研究計畫定位為對傅柯生命政治概念的延伸與深化，也提出修正性批判"}, {"type": "批判", "name": "拉圖", "text": "行動者網絡理論隱含對傅柯權力分析方法論的批評"}, {"type": "批判", "name": "韓炳哲", "text": "韓炳哲主張當代社會已從傅柯規訓社會轉向積極性的功績社會"}, {"type": "繼承", "name": "雷克維茲", "text": "明確承認理論方法論上對傅柯的直接負債"}], "intro_reading": ["《規訓與懲罰》——公認最好讀、論證最清晰的一本", "《傅柯訪談錄》——他極擅長用清晰口語解釋自己的方法論"], "advanced_reading": ["《詞與物》——知識型概念的系統性展開", "《性史》第一卷〈知識的意志〉——知識-權力理論與生命政治概念最成熟的展開"]}, {"id": "phil-12", "name_zh": "羅蘭巴特", "name_orig": "Roland Barthes", "dates": "1915–1980", "traditions": ["後結構主義"], "date": "2026-08-22", "status": "定稿", "intro": "法國文學理論家、符號學家、隨筆作家，思想生涯橫跨結構主義的建立與後結構主義的轉向。以《神話學》分析布爾喬亞文化如何把歷史性建構包裝成「自然而然」的常識著稱，1967 年〈作者之死〉徹底改寫了文學批評傳統。1980 年因車禍傷重去世。", "background": ["1915 年生於法國瑟堡，父親海軍軍官陣亡於一戰，求學過程因肺結核反覆中斷。1952 至 1959 年任職於法國國家科學研究中心，1957 年出版《神話學》，把符號學方法應用於日常文化現象。", "1976 年成為法蘭西學院首任「文學符號學」講座教授。1980 年 2 月被一輛洗衣廠貨車撞倒，一個月後過世。"], "core_concepts": ["神話：布爾喬亞文化把歷史性、意識形態性的建構，轉化為看似自然、永恆、不言自明的「常識」。", "符號學方法：把不限於語言的各種文化現象視為由能指與所指構成的符號系統。", "作者之死：把文本意義的最終仲裁權歸於作者原初意圖，是一種為文本強加人為終點的做法，文本一旦完成，意義的生產轉移到讀者身上。", "可讀文本與可寫文本：可讀文本讀者被動接收既定意義；可寫文本邀請讀者主動參與意義的生產過程。", "文本的愉悅與極樂：plaisir 是符合文化慣例的閱讀愉悅；jouissance 則是一種擾亂主體既有認同邊界的閱讀狂喜經驗。"], "relations": [{"type": "批判", "name": "沙特", "text": "早期《寫作的零度》開篇即針對沙特「介入文學」的主張展開質疑"}, {"type": "呼應", "name": "德希達", "text": "兩人同屬法國思想從結構主義轉向後結構主義世代的核心人物，德希達在巴特過世後撰寫悼文〈羅蘭·巴特〉"}, {"type": "對話", "name": "傅柯", "text": "〈作者之死〉與傅柯隔年發表的〈何謂作者？〉構成一組緊密的理論對話"}, {"type": "呼應", "name": "德勒茲", "text": "晚期巴特的「可寫文本」與「極樂」概念，與德勒茲對慾望生產性的思考存在結構性呼應"}], "intro_reading": ["《神話學》——最好讀、最具示範性的一本", "〈作者之死〉——單篇文章，篇幅極短"], "advanced_reading": ["《S/Z》——對巴爾札克短篇小說逐句拆解的長篇分析", "《戀人絮語》——晚期風格最個人化的代表作"]}, {"id": "phil-16", "name_zh": "阿岡本", "name_orig": "Giorgio Agamben", "dates": "1942–（仍在世）", "traditions": ["生命政治"], "date": "2026-08-22", "status": "定稿", "intro": "義大利當代最具影響力的哲學家之一，橫跨法律哲學、政治哲學、美學、語言哲學與神學。以「牲人」與「例外狀態」概念聞名——追問主權權力如何透過把某些生命排除於法律保護之外，卻同時把這個排除本身納入法律運作的核心，來構成其自身的權力基礎。", "background": ["1942 年生於羅馬，1965 年於羅馬大學取得法學與哲學學位。1966 與 1968 年兩度參加海德格在勒托爾舉辦的私人研討班。1980 年代參與班雅明義大利文版全集的編輯工作。", "1995 年出版《牲人：主權權力與裸命》，開啟橫跨二十餘年的「牲人」系列研究計畫，2001 年九一一事件後這部理論著作顯得驚人地具先見之明。近年持續針對歐洲移民政策、新冠疫情期間的國家例外措施發表高度爭議性的公共介入評論。"], "core_concepts": ["牲人：一種被主權權力排除在法律的正常保護之外、卻仍然被主權權力的暴力所籠罩的赤裸生命形式，主張這正是主權權力運作的隱藏原初結構。", "例外狀態：主權者宣告法律暫停生效的權力，這個看似位於法律之外的例外性懸置，其實從一開始就內建於法律的正常運作邏輯之中。", "裸命與政治生命：zoè 是純粹的生物性生存，bios 是被政治共同體承認的生命形式，西方政治的根本運作機制正是持續生產與操縱這兩者之間的門檻。", "潛能與缺席的行動理論：試圖建構一種不預先被目的與實現所窮盡、保留自身「不去做」能力的潛能概念。", "裝置：延伸自傅柯，指涉任何能夠捕捉、引導、決定生命體行為的異質性機制網絡。"], "relations": [{"type": "繼承", "name": "海德格", "text": "親炙其晚年私人研討班，存在論差異、潛能與現實性的思考是阿岡本方法論的重要起點"}, {"type": "繼承", "name": "班雅明", "text": "終身最重要的理論資源之一，例外狀態理論直接承自班雅明對「神聖暴力」與法律暴力的區分"}, {"type": "繼承", "name": "傅柯", "text": "牲人研究計畫明確定位為對傅柯生命政治概念的延伸與深化，也提出修正性批判"}, {"type": "批判", "name": "施密特", "text": "與二十世紀最重要的主權理論家施密特展開長期批判性對話"}, {"type": "呼應", "name": "巴特勒", "text": "兩人在晚近著作裡都深入處理脆弱性、可悼念性、裸命等主題"}], "intro_reading": ["《牲人：主權權力與裸命》——整個研究計畫的奠基之作", "《例外狀態》——篇幅較短，聚焦處理主權與法律懸置的具體機制"], "advanced_reading": ["《奧許維茲的殘餘：見證人與檔案》——牲人系列裡最具倫理張力的一卷", "《王國與榮耀》——把牲人計畫延伸至神學-經濟學系譜"]}, {"id": "phil-13", "name_zh": "李歐塔", "name_orig": "Jean-François Lyotard", "dates": "1924–1998", "traditions": ["當代文化與社會批判"], "date": "2026-08-22", "status": "定稿", "intro": "「後現代」一詞在哲學語境裡最重要的理論化者。早年投身異端馬克思主義政治行動，1970 年代後轉向對「大敘事」本身的根本懷疑，主張知識碎裂成無數各自運作、彼此不可通約的局部語言遊戲。1998 年因白血病驟逝。", "background": ["1924 年生於法國凡爾賽，1950 年通過哲學教師資格會考，赴阿爾及利亞康斯坦丁的中學任教。1954 年加入「社會主義或野蠻」，長期批判法國在阿爾及利亞的殖民統治。", "1979 年出版《後現代狀況》，1984 年英譯本問世後在英語學界引爆對「後現代主義」的廣泛討論。1998 年 4 月因急性白血病驟然過世。"], "core_concepts": ["大敘事的終結：啟蒙理性的解放敘事、馬克思主義的階級解放史觀，這類試圖為知識與政治行動提供普遍正當性基礎的宏大敘事框架，在後現代狀況下已喪失可信度。", "語言遊戲與知識的合法化：知識不再能夠訴諸單一的普遍性合法化敘事，而是碎裂成無數各自遵循內部規則的局部語言遊戲。", "歧異：一種特殊的爭端形式，其中一方所受的傷害無法在既有的、雙方共享的話語規則裡被表達或見證。", "崇高：那種無法被再現、超出概念與形象所能容納的經驗，前衛藝術的任務是呈現「存在著無法被呈現之物」這個事實。", "非人：技術理性、資本主義加速邏輯下的「發展」正在系統性地生產一種與人類經驗脫節的「非人」狀態。"], "relations": [{"type": "張力", "name": "哈伯瑪斯", "text": "與哈伯瑪斯就啟蒙理性計畫是否已然完成展開長期公開論辯"}, {"type": "呼應", "name": "德希達", "text": "李歐塔的歧異與德希達的延異在方法論精神上高度呼應"}, {"type": "對話", "name": "布希亞", "text": "同屬後現代文化理論陣營的重要人物，兩人交情深厚"}], "intro_reading": ["《後現代狀況》——篇幅短、影響最廣的代表作", "〈回答問題：什麼是後現代主義？〉——他對後現代美學立場最直接精煉的自我表述"], "advanced_reading": ["《歧異》——晚期最重要的系統性哲學著作", "《話語，圖形》——博士論文原作"]}, {"id": "phil-14", "name_zh": "布希亞", "name_orig": "Jean Baudrillard", "dates": "1929–2007", "traditions": ["當代文化與社會批判"], "date": "2026-08-22", "status": "定稿", "intro": "法國社會學家、哲學家，以擬像、超真實等概念聞名，對媒體、消費社會、當代影像文化最激進的理論化者之一。主張當代社會已從「表徵」徹底轉向「擬像」，真實本身已被模型的循環運作所吞沒。", "background": ["1929 年生於法國香檳區漢斯一個農民家庭，於索邦大學攻讀德文，1956 至 1966 年在外省中學任教德文。1968 年出版第一本重要著作《物體系》，1973 年《生產之鏡》標誌他與馬克思主義傳統的正式決裂。", "1981 年出版代表作《擬像與模擬》，奠定他作為後現代理論代表人物的地位。此後持續以格言化、挑釁性的風格寫作評論當代事件的作品，2007 年病逝於巴黎。"], "core_concepts": ["擬像的三個階段：從忠實模仿真實，到真實的工業複製，到不再指涉任何真實、甚至先於並生產出人們以為的「真實」本身。", "超真實：當擬像徹底取代真實，我們所經驗到的「真實」其實是比真實更真實、更完美的模擬產物。", "內爆：原本被認為對立的範疇在媒體飽和的環境下彼此坍縮、失去區隔。", "誘惑：晚期理論核心概念，操作於表面，不追求真理或深度意義的揭露。", "符號政治經濟學批判：當代資本主義的核心運作已不只是使用價值與交換價值，而是符號價值。"], "relations": [{"type": "批判", "name": "傅柯", "text": "1977 年出版《忘掉傅柯》，主張傅柯的權力分析理論已經被他所描述的那個微觀權力社會超越"}, {"type": "批判", "name": "馬克思", "text": "早期著作延伸馬克思商品分析方法，但《生產之鏡》正式與馬克思主義傳統決裂"}, {"type": "對話", "name": "李歐塔", "text": "兩人私交深厚，同屬法國後現代理論代表人物"}, {"type": "呼應", "name": "德波", "text": "擬像理論與德波「奇觀社會」的分析共享對當代資本主義表象邏輯的批判關切"}], "intro_reading": ["《消費社會》——早期著作，論證清晰，符號價值理論的最佳入口", "《擬像與模擬》——代表作，篇幅不長"], "advanced_reading": ["《象徵交換與死亡》——他自認理論轉折最關鍵的著作", "《美國》——遊記體評論作品"]}, {"id": "phil-20", "name_zh": "塞荷", "name_orig": "Michel Serres", "dates": "1930–2019", "traditions": ["當代文化與社會批判"], "date": "2026-08-22", "status": "定稿", "intro": "法國哲學家與科學史家，法蘭西學院院士，橫跨科學與人文兩個世界最不受學科邊界拘束的思想家之一。以「寄食者」重新思考溝通與交換的本質——任何傳訊系統裡都存在一個既寄生於系統又擾動系統的第三方，噪音不是溝通的敵人，而是溝通的構成性條件。", "background": ["1930 年生於法國阿讓，父親經營疏浚船業。轉赴波爾多完成數學學位，再赴巴黎進入高等師範學院攻讀哲學，1955 年畢業。畢業後回到與傅柯同一所學院擔任哲學助理教授。1969 年獲聘為索邦大學科學史教授。", "1984 年起長期任教於史丹佛大學。1980 年出版代表作《寄食者》。1990 年當選法蘭西學院院士。2019 年因肺癌病逝於樊尚。"], "core_concepts": ["寄食者：任何溝通或交換系統都必然包含一個第三方，牠既依附於系統又擾動系統，噪音因此是溝通得以持續運作的構成性條件。", "通訊之神赫密斯：以希臘信使神赫密斯命名一系列跨學科著作，象徵科學與人文兩個看似分離的話語領域之間持續的翻譯與交流運作。", "自然契約：主張既有的社會契約傳統只處理人與人之間的關係，應該把地球本身視為契約的另一方。", "混雜的中介狀態：持續關注那些拒絕被清楚歸類、處於兩個範疇之間的混雜存在狀態。"], "relations": [{"type": "呼應", "name": "柏格森", "text": "少年時期即深受柏格森影響，對綿延、直覺方法有終身的親近感"}, {"type": "對話", "name": "傅柯", "text": "ENS 畢業後曾在與傅柯同一所學院擔任哲學助理教授"}, {"type": "師承／對話", "name": "拉圖", "text": "透過共同的科學史興趣結識並長期對話，兩人合著《關於科學、文化與時間的對話》"}, {"type": "張力", "name": "哈伯瑪斯", "text": "兩人都以溝通作為理論核心關切，但取徑截然不同——哈伯瑪斯追求理性共識，塞荷主張噪音才是溝通的構成性條件"}], "intro_reading": ["《五感》——文學性最強、最容易進入的一本", "《寄食者》——代表作，寄食者概念最完整的展開"], "advanced_reading": ["《赫密斯》系列——他跨學科方法論最系統性的展演", "《自然契約》——生態哲學核心文本"]}, {"id": "phil-21", "name_zh": "韓炳哲", "name_orig": "Byung-Chul Han", "dates": "1959–（仍在世）", "traditions": ["當代文化與社會批判"], "date": "2026-08-22", "status": "定稿", "intro": "韓裔德籍哲學家，以簡短格言化、高度可讀卻論證緊密的隨筆體著作，成為近十年歐洲最廣為閱讀的哲學家之一。核心關切是晚期現代性裡宰制如何從傅柯式的規訓權力轉向一種更隱微、以自我剝削為核心機制的「功績社會」。", "background": ["1959 年生於韓國首爾，大學階段主修冶金學，1980 年代赴德留學，轉向哲學、德國文學、天主教神學。1994 年於弗萊堡大學取得博士學位，論文以海德格為研究對象。", "2010 年起任教於卡爾斯魯厄設計學院，同年出版《倦怠社會》，迅速在德語學界與公眾間引發廣泛回響。2012 年起任教於柏林藝術大學，全球翻譯語言已超過三十五種。"], "core_concepts": ["功績社會與倦怠社會：主體不再被外部禁令支配，而是被內化激勵驅動，沒有外部壓迫者可供反抗，因為施暴者與受害者是同一個自我。", "自我剝削：當代主體把外部的績效要求內化為對自己的無止盡要求，這種自我剝削比他人施加的剝削更有效率。", "透明社會：社會要求一切都應該被展示、被量化、被公開，這個透明化要求消滅了任何值得保留的秘密、距離、否定性。", "積極性的暴力：當代暴力已不再主要表現為否定性的壓制，而是表現為一種積極性的過度，透過耗盡主體自身的內在資源運作。"], "relations": [{"type": "繼承", "name": "海德格", "text": "博士論文以海德格為研究對象，存在論思考方式與極簡格言化的寫作風格延續海德格晚期的追求"}, {"type": "批判", "name": "傅柯", "text": "《倦怠社會》開篇即以傅柯的規訓社會模型作為對照與超越對象"}, {"type": "呼應", "name": "馬庫色", "text": "對自我剝削的分析與馬庫色壓制性去昇華在方法論精神上高度呼應"}, {"type": "對話", "name": "雷克維茲", "text": "兩人同屬當代德語世界分析晚期現代性主體性狀態最受矚目的理論家"}], "intro_reading": ["《倦怠社會》——奠定他理論地位的代表作，篇幅極短", "《透明社會》——延續倦怠社會的分析脈絡"], "advanced_reading": ["《精神政治學》——把功績社會理論更系統性地連結至新自由主義治理術", "《暴力的拓撲學》——理論野心較大的一本"]}, {"id": "phil-22", "name_zh": "雷克維茲", "name_orig": "Andreas Reckwitz", "dates": "1970–（仍在世）", "traditions": ["當代文化與社會批判"], "date": "2026-08-22", "status": "定稿", "intro": "德國社會學家與文化理論家，當代最受矚目的社會理論新星之一，社會實踐理論的重要建構者。以《獨異性社會》系統性分析晚期現代性如何從強調普遍、標準化的工業社會邏輯，轉向強調獨特、本真、不可取代的「獨異性」邏輯。", "background": ["1970 年生於德國維滕，求學橫跨波昂大學、漢堡大學，並曾赴劍橋大學跟隨紀登斯研習。他自陳受法蘭克福批判理論傳統的直接繼承關係相對疏遠，反而更明確承認對傅柯系譜學方法的理論負債。", "2020 年轉任柏林洪堡大學社會理論與文化社會學教授。2017 年出版代表作《獨異性社會》，2019 年獲頒德國研究基金會最高榮譽萊布尼茲獎。"], "core_concepts": ["獨異性社會：晚期現代性的社會邏輯已系統性轉向對獨特性、本真性、不可取代之物的推崇，這個轉向牽動經濟、政治、階級結構的根本性社會轉型。", "文化化的不平等：獨異性邏輯系統性地生產出贏家全拿式的不平等，鄉村地區的被拋棄感是獨異性化的另一面。", "社會實踐理論：社會生活的基本分析單位是重複進行、有其內在邏輯與物質配置的「實踐」。", "晚期現代的主體化模式：以「本真自我實現」為核心規範的主體形式，實際上構成了一套新的、更隱微的規訓機制。"], "relations": [{"type": "繼承", "name": "傅柯", "text": "明確承認理論方法論上對傅柯的直接負債"}, {"type": "張力", "name": "霍克海默與阿多諾", "text": "公開表示自己的理論計畫刻意與德國批判理論傳統保持距離"}, {"type": "對話", "name": "韓炳哲", "text": "兩人同屬當代德語世界分析晚期現代性主體性狀態最受矚目的理論家"}], "intro_reading": ["《獨異性社會：現代性的結構轉型》——代表作，論證系統完整", "《晚期現代的危機》（與哈特穆特·羅薩合著）——訪談與對話形式"], "advanced_reading": ["《創造力的發明》——「獨異性社會」理論的重要前身著作", "相關社會實踐理論方法論文集"]}, {"id": "phil-23", "name_zh": "德波", "name_orig": "Guy Debord", "dates": "1931–1994", "traditions": ["當代文化與社會批判"], "date": "2026-08-22", "status": "定稿", "intro": "法國馬克思主義理論家、電影工作者，情境主義國際的主要創立者與理論家。以《奇觀社會》系統性分析現代資本主義如何把所有生活都轉化為表象的積累。他的思想是 1968 年五月風暴重要的理論資源之一，晚年隱居鄉間，1994 年自殺身亡。", "background": ["1931 年生於巴黎，1952 年加入字母主義國際。1957 年情境主義國際正式成立，德波是核心創始成員與長期理論領導者。1967 年出版代表作《奇觀社會》，以 221 條格言體論題構成。", "1988 年出版《評奇觀社會》。晚年因健康問題與長期孤僻，隱居於法國中部鄉間，1994 年 11 月開槍自殺身亡。"], "core_concepts": ["奇觀社會：現代資本主義社會把所有真實的生活關係都轉化為表象的積累與展示，奇觀是一種以影像為中介的社會關係。", "分離：奇觀的根本邏輯是分離——生產者與其生產物、個體與共同體、觀看者與被觀看的生活本身的分離。", "異化：挪用既有的文化材料，透過重新脈絡化、扭轉其原有意義，使其轉而對抗原本的意識形態功能。", "都市漂移：一種有意識地放棄日常慣習路徑、任由都市地景本身的心理地理效應引導自己移動的行走實踐。"], "relations": [{"type": "呼應", "name": "布希亞", "text": "布希亞的擬像理論某個意義上是奇觀理論的激進化延伸"}, {"type": "呼應", "name": "霍克海默與阿多諾", "text": "奇觀社會理論與法蘭克福學派文化工業批判共享對資本主義文化消費的關切"}, {"type": "呼應", "name": "朗西埃", "text": "朗西埃對感性分配的分析與德波對奇觀的分析在方法論精神上有值得對讀的親近性"}], "intro_reading": ["《奇觀社會》——原文由 221 條格言體論題構成", "Anselm Jappe《居伊·德波》——目前最好的學術導論之一"], "advanced_reading": ["《評奇觀社會》——二十年後的自我補充", "情境主義國際相關文獻選集"]}, {"id": "phil-17", "name_zh": "巴迪歐", "name_orig": "Alain Badiou", "dates": "1937–（仍在世）", "traditions": ["當代左翼政治哲學"], "date": "2026-08-22", "status": "定稿", "intro": "當代法國最具系統性野心的哲學家之一，公開以「柏拉圖主義者」自居，逆著整個後結構主義世代對宏大體系與普遍真理的懷疑。以集合論作為存在論的語言，發展出一套「事件」哲學——真理是主體對一個打斷既有情境的斷裂事件保持忠誠、逐步建構出來的。", "background": ["1937 年生於法屬摩洛哥拉巴特，考入巴黎高等師範學院，師從喬治·岡居朗。早期思想深受阿圖塞的結構主義馬克思主義與毛派政治實踐影響，1969 至 1985 年間積極參與極左毛派組織的政治行動。", "1988 年出版代表作《存在與事件》，2006 年出版續作《世界的邏輯》。近年仍持續活躍於公共講學與政治評論。"], "core_concepts": ["事件：一個無法從既有情境的知識與規則裡被預先計算的斷裂性發生，是真理得以誕生的唯一起點。", "真理程序：真理不是被發現的既成事實，而是主體透過對事件保持「忠誠」逐步建構出來的無限過程。", "存在論即數學：「數學就是存在論」，存在本身沒有內在的統一性或本質，只有純粹的多，集合論是描述這個運作的形式語言。", "主體：主體只在真理程序展開的過程中被生產出來，主體是稀有的、事件性的。", "反哲學批判：用「反哲學家」指稱尼采、維根斯坦、拉岡等他認為攻擊哲學追求普遍真理之權利的思想家。"], "relations": [{"type": "繼承", "name": "阿圖塞", "text": "巴黎高師時期深受其結構主義馬克思主義影響"}, {"type": "批判", "name": "德勒茲", "text": "系統性批判德勒茲的多重性內在性哲學最終仍隱含某種一元論式的「一」"}, {"type": "批判", "name": "海德格", "text": "明確自我定位為「後海德格」哲學家，主張數學而非詩才是存在論真正該使用的話語"}, {"type": "對話", "name": "齊澤克", "text": "長期親密的思想盟友，共同發展「共產主義假設」的當代政治哲學計畫"}, {"type": "批判", "name": "李歐塔", "text": "對後結構主義／後現代主義陣營的懷疑論立場整體上抱持批判態度"}], "intro_reading": ["《倫理學：論惡的理解》——篇幅短、論證直接", "《哲學宣言》——簡短申明他整個哲學計畫的立場"], "advanced_reading": ["《存在與事件》——他最重要也最艱澀的體系性巨著", "《世界的邏輯》——《存在與事件》的續篇"]}, {"id": "phil-18", "name_zh": "齊澤克", "name_orig": "Slavoj Žižek", "dates": "1949–（仍在世）", "traditions": ["當代左翼政治哲學"], "date": "2026-08-22", "status": "定稿", "intro": "斯洛維尼亞哲學家與文化批評家，以黑格爾辯證法、拉岡精神分析、馬克思主義意識形態批判三者的獨特綜合著稱，是當代最具公眾能見度也最具爭議性的哲學家之一。核心關切是意識形態如何透過「享樂」的結構運作。", "background": ["1949 年生於盧比安納，成長於相對開放的南斯拉夫「自我管理式社會主義」文化氛圍。1981 年赴巴黎跟隨拉岡的女婿雅克-阿蘭·米勒研習。是「盧比安納學派」的核心人物。", "1989 年出版第一本英文著作《意識形態的崇高客體》，開啟他在英語學界的國際聲望。此後
