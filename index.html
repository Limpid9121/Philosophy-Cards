<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="概念庫">
<meta name="theme-color" content="#16171B">
<title>哲學概念庫</title>
<style>
  :root{
    --bg: #16171B; --panel: #1E2025; --panel-hi: #24262C; --line: #2C2E34;
    --ink: #E8E4D9; --ink-dim: #9B9A92; --ink-faint: #6C6B65;
    --brass: #C9A227; --stamp: #B0483A;
    --r-tension: #e05252; --r-resonance: #52b0e0; --r-critique: #e08852;
    --r-inheritance: #52e07a; --r-dialogue: #a052e0;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif;
    --serif: ui-serif, Georgia, "Songti TC", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  body{ padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); min-height: 100vh; }
  ::selection{ background: var(--brass); color:#16171B; }

  header{ position: sticky; top:0; z-index: 10; background: rgba(22,23,27,0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
  .titlebar{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 10px; }
  .titlebar h1{ font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: 0.02em; margin:0; }
  .titlebar .count{ font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }

  .tabs{ display:flex; gap:6px; margin-bottom:10px; background:var(--panel); border-radius:10px; padding:3px; }
  .tab{ flex:1; text-align:center; padding:7px 0; font-size:13.5px; color:var(--ink-dim); border-radius:8px; cursor:pointer; }
  .tab.active{ background: var(--brass); color:#16171B; font-weight:600; }

  .search-row{ position: relative; margin-bottom: 8px; }
  .search-row input{ width:100%; background: var(--panel); border:1px solid var(--line); color: var(--ink); font-size:15px; padding: 10px 36px 10px 14px; border-radius: 10px; font-family: var(--sans); }
  .search-row input:focus{ outline: none; border-color: var(--brass); }
  .search-row input::placeholder{ color: var(--ink-faint); }
  .search-row .clear-btn{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--ink-faint); font-size:18px; padding:4px 6px; display:none; cursor:pointer; }
  .search-row .clear-btn.show{ display:block; }

  .action-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .action-btn{ flex:1 1 auto; min-width:80px; display:flex; align-items:center; justify-content:center; gap:5px; font-size:13px; padding: 8px 10px; border-radius:9px; border:1px solid var(--line); background: var(--panel); color: var(--ink-dim); cursor:pointer; white-space:nowrap; }
  .action-btn.active{ border-color: var(--brass); color: var(--brass); }
  .action-btn .badge{ background:var(--brass); color:#16171B; font-size:10px; font-weight:700; border-radius:999px; padding:1px 5px; }

  .active-pills{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .active-pills:empty{ display:none; margin-top:0; }
  .pill{ display:flex; align-items:center; gap:5px; font-size:12px; background: var(--panel-hi); border:1px solid var(--brass); color:var(--brass); padding:4px 8px 4px 10px; border-radius:999px; cursor:pointer; }

  main{ padding: 12px 14px 60px; max-width: 720px; margin: 0 auto; }

  .card{ background: var(--panel); border:1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow:hidden; scroll-margin-top: 230px; transition: border-color .6s, box-shadow .6s; }
  .card.flash{ border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
  .card-head{ display:flex; padding: 13px 14px; cursor:pointer; gap:10px; }
  .card-head:active{ background: var(--panel-hi); }
  .card-tab{ width:3px; border-radius:2px; flex:0 0 3px; }
  .card-main{ flex:1; min-width:0; }
  .card-name-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card-name{ font-size:16.5px; font-weight:600; color:var(--ink); }
  .card-orig{ font-family: var(--serif); font-size:13px; color: var(--brass); font-style:italic; }
  .card-sub{ font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  .card-def{ font-size:13.5px; color:var(--ink-dim); margin-top:6px; line-height:1.5; }
  .card-stamp{ flex:0 0 auto; align-self:flex-start; font-family: var(--mono); font-size:10px; color:var(--ink-faint); border:1px dashed var(--ink-faint); border-radius:5px; padding:3px 6px; white-space:nowrap; text-align:right; }
  .card-stamp .touched{ margin-top:3px; color:var(--ink-faint); }
  .card-tags{ display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }
  .tag-pill{ font-size:11px; padding:2px 8px; border-radius:999px; background: var(--panel-hi); color:var(--ink-dim); border:1px solid var(--line); }
  .tag-pill.tradition{ color: var(--brass); border-color: var(--brass); }

  .card-body{ display:none; padding: 0 16px 16px; border-top:1px solid var(--line); }
  .card.open .card-body{ display:block; }
  .card.open .chev{ transform: rotate(90deg); }
  .chev{ color: var(--ink-faint); font-size:14px; transition: transform .15s; align-self:center; }

  .sec{ margin-top:14px; }
  .sec h3{ font-family: var(--mono); font-size:11px; letter-spacing:0.08em; color: var(--brass); text-transform:uppercase; margin:0 0 6px; }
  .sec p{ margin:0 0 10px; font-size:14.5px; line-height:1.8; color: var(--ink); }
  .sec p:last-child{ margin-bottom:0; }
  .sec strong{ color: var(--brass); font-weight:600; }
  .sec ul{ margin:0; padding-left:18px; }
  .sec li{ font-size:14px; line-height:1.75; color: var(--ink); margin-bottom:5px; }

  .rel{ display:flex; gap:8px; align-items:flex-start; margin-bottom:9px; font-size:13.5px; line-height:1.65; }
  .rel:last-child{ margin-bottom:0; }
  .rel-dot{ width:8px; height:8px; border-radius:50%; margin-top:6px; flex:0 0 8px; }
  .rel-type{ font-weight:600; margin-right:4px; }
  .rel-c-tension .rel-dot,.rel-c-tension .rel-type{ color: var(--r-tension); } .rel-c-tension .rel-dot{ background: var(--r-tension); }
  .rel-c-resonance .rel-dot,.rel-c-resonance .rel-type{ color: var(--r-resonance); } .rel-c-resonance .rel-dot{ background: var(--r-resonance); }
  .rel-c-critique .rel-dot,.rel-c-critique .rel-type{ color: var(--r-critique); } .rel-c-critique .rel-dot{ background: var(--r-critique); }
  .rel-c-inheritance .rel-dot,.rel-c-inheritance .rel-type{ color: var(--r-inheritance); } .rel-c-inheritance .rel-dot{ background: var(--r-inheritance); }
  .rel-c-dialogue .rel-dot,.rel-c-dialogue .rel-type{ color: var(--r-dialogue); } .rel-c-dialogue .rel-dot{ background: var(--r-dialogue); }
  .rel-link{ color: inherit; text-decoration: underline; text-decoration-color: currentColor; text-underline-offset: 2px; cursor:pointer; font-weight:600; }
  .rel-link:active{ opacity:0.7; }
  .rel-jump-icon{ font-size:11px; margin-left:2px; }

  textarea.reflection{ width:100%; min-height:74px; background: var(--panel-hi); border:1px solid var(--line); border-radius:8px; color: var(--ink); font-family: var(--sans); font-size:14px; padding:10px; line-height:1.6; resize: vertical; }
  textarea.reflection:focus{ outline:none; border-color:var(--brass); }
  .save-state{ font-size:11px; color: var(--ink-faint); margin-top:5px; font-family: var(--mono); }
  .save-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:5px; flex-wrap:wrap; }
  .archive-btn{ font-size:11px; padding:4px 9px; border-radius:7px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer; white-space:nowrap; }
  .archive-btn:active{ background: var(--panel-hi); }
  .history-toggle{ font-size:11.5px; color: var(--brass); margin-top:8px; cursor:pointer; font-family: var(--mono); }
  .history-list{ margin-top:8px; border-left:2px solid var(--line); padding-left:10px; }
  .history-item{ margin-bottom:10px; }
  .history-item:last-child{ margin-bottom:0; }
  .history-ts{ font-size:10.5px; color:var(--ink-faint); font-family: var(--mono); margin-bottom:2px; }
  .history-text{ font-size:13px; line-height:1.6; color: var(--ink-dim); white-space:pre-wrap; }
  .history-empty{ font-size:12px; color: var(--ink-faint); line-height:1.6; }

  .status-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .status-btn{ font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer; }
  .status-btn.active{ background: var(--stamp); border-color: var(--stamp); color:#F5EFE6; }
  .read-btn{ font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--brass); background:transparent; color:var(--brass); cursor:pointer; margin-top:8px; }
  .read-btn:active{ background: var(--brass); color:#16171B; }

  .empty{ text-align:center; padding: 60px 20px; color: var(--ink-faint); font-size:14px; line-height:1.8; }

  footer{ max-width:720px; margin:0 auto; padding: 10px 16px 30px; display:flex; justify-content:space-between; align-items:center; }
  .export-btn{ font-size:12.5px; color: var(--ink-dim); background:none; border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  .export-btn:active{ background: var(--panel-hi); }
  .footer-note{ font-size:11px; color: var(--ink-faint); font-family: var(--mono); }

  .modal-mask{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; align-items:flex-end; }
  .modal-mask.show{ display:flex; }
  .modal{ background: var(--panel); border-radius: 16px 16px 0 0; width:100%; max-height:82vh; overflow-y:auto; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .modal h2{ font-family:var(--serif); font-size:16px; margin:0 0 12px; }
  .modal-search{ width:100%; background: var(--panel-hi); border:1px solid var(--line); color:var(--ink); font-size:14px; padding:9px 12px; border-radius:8px; margin-bottom:10px; font-family:var(--sans); }
  .modal-search:focus{ outline:none; border-color:var(--brass); }

  .filter-section{ margin-bottom:16px; }
  .filter-section:last-child{ margin-bottom:0; }
  .filter-section h3{ font-family: var(--mono); font-size:11px; letter-spacing:0.08em; color: var(--brass); text-transform:uppercase; margin:0 0 8px; }
  .chip-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ font-size:12.5px; padding: 6px 12px; border-radius:999px; border:1px solid var(--line); background: transparent; color: var(--ink-dim); cursor:pointer; }
  .chip.active{ background: var(--brass); border-color: var(--brass); color:#16171B; font-weight:600; }

  .review-item{ display:flex; justify-content:space-between; align-items:center; padding:12px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  .review-item:last-child{ border-bottom:none; }
  .review-item .ri-main{ flex:1; min-width:0; }
  .review-item .ri-name{ font-size:15px; font-weight:600; }
  .review-item .ri-def{ font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  .review-item .ri-badge{ font-size:10px; font-family:var(--mono); color:var(--ink-faint); flex:0 0 auto; margin-left:8px; text-align:right; }

  .modal textarea.export-area{ width:100%; height:40vh; background: var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font-family: var(--mono); font-size:12px; line-height:1.6; }
  .modal-actions{ display:flex; gap:8px; margin-top:10px; }
  .modal-actions button{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background: var(--panel-hi); color:var(--ink); font-size:14px; }

  .phil-dates{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>哲學概念庫</h1>
    <span class="count" id="count">0 項</span>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="cards">概念卡</div>
    <div class="tab" data-tab="philosophers">哲學家</div>
  </div>
  <div class="search-row">
    <input id="search" type="text" placeholder="搜尋…" autocomplete="off" autocapitalize="off">
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>
  <div class="action-row">
    <button class="action-btn" id="filterBtn">篩選<span class="badge" id="filterBadge" style="display:none;">0</span></button>
    <button class="action-btn" id="reviewBtn">今日複習</button>
    <button class="action-btn" id="collapseAllBtn">全部收合</button>
    <button class="action-btn" id="backBtn" style="display:none;">← 返回</button>
  </div>
  <div class="active-pills" id="activePills"></div>
</header>

<main id="list"></main>

<footer>
  <button class="export-btn" id="exportBtn">匯出我的重述</button>
  <span class="footer-note">本機草稿，尚未同步回 Drive</span>
</footer>

<div class="modal-mask" id="filterModalMask">
  <div class="modal" id="filterModalBody"></div>
</div>

<div class="modal-mask" id="reviewModalMask">
  <div class="modal">
    <h2>今日複習</h2>
    <div id="reviewList"></div>
  </div>
</div>

<div class="modal-mask" id="exportModalMask">
  <div class="modal">
    <h2>本機重述匯出</h2>
    <textarea class="export-area" id="exportText" readonly></textarea>
    <div class="modal-actions">
      <button id="copyBtn">複製全部</button>
      <button id="closeExport">關閉</button>
    </div>
  </div>
</div>

      "同一性思維要能運作，需要一個穩定、前後一致的主體作為運作的基座——任何歸類、命名、概念化的動作，背後都假設著一個不隨當下情緒漂移的「我」在執行這個動作。一個今天覺得是這樣、明天被恐懼淹沒就什麼都不是的主體，沒辦法維持任何概念系統。",
      "但這個穩定的自我不是現成的。它必須被製造出來，而製造的方式，就是對自己內在那些流動的、當下的、不受控的衝動，施加與對付外在自然完全同一套的馴服手法——分類、壓抑、延遲、規訓。換句話說，支配外在自然的能力，是拿一筆內部的代價換來的：把自己身上流動的部分硬化成一個前後一致的行動中心。",
      "這一步走通了，「啟蒙倒退回神話」才有第二層意思。第一層是形式上的——概念思考與命運的循環結構同構；第二層是代價上的：啟蒙宣稱要解除神話對人的支配，做法卻是把那個支配搬進主體內部，讓人自己來當自己的祭司。外在世界看似被解放了，代價由內在世界支付。"

  {

    "context": "用來反駁「理性後來才戳破犧牲的迷信」這個常見敘事，為後面「犧牲的內轉」（見〈自我保存＝自我毀滅〉卡）鋪路。",
    "expand": [

      "1932 年的醫學博士論文以偏執型精神病與人格關係為題，使其精神分析始終保留精神病理學與臨床個案背景。1936 年鏡像階段報告、1953 年〈言說與語言的功能與場域〉及其後研討班，標誌由影像認同轉向結構語言學。1964 年成立巴黎佛洛伊德學院，1980 年解散；1981 年創立的 École de la Cause freudienne 是其最後制度倡議。晚期从能指結構轉向數理圖式、性化公式與 Borromean knot，不能把「拉岡理論」固定在 1950 年代。",
      "拉岡思想可粗分三個重心而不能彼此取代：早期以鏡像、妄想與侵略性處理自我認同；中期以能指、象徵秩序與大他者重讀佛洛伊德；晚期以享樂、性化公式、話語與拓撲處理象徵秩序自身的不完備。小客體 a 也隨之由想像性對象的殘餘轉為欲望原因與享樂餘剩。其臨床制度爭議包括短時段分析與訓練授權，理論爭議則包括語言學挪用、性別公式及經驗可檢驗性。女性主義與酷兒理論既批判其陽具中心詞彙，也利用「性關係不存在」與主體非整體性鬆動本質主義；因此拉岡的後續影響本身是一個充滿內部張力的傳統。"
    ],
    "core_concepts": [
      "鏡像階段／想像界：自我是對完整身體影像的認同，具有先天誤認結構。",
      "象徵界：語言、親屬與法律的能指秩序，主體在其中取得位置也被分裂。",
      "真實界：無法被象徵化吸收、卻以創傷或僵局回返者。",
      "大他者：語言與規範被假定為保證意義的位置；「大他者不存在」指此保證自身不完整。",
      "欲望／需求／要求：需求經語言化成要求後留下不可化約餘差，即欲望。",
      "小客體 a：不是欲望對象，而是使欲望循環的原因與失落餘剩。",
      "享樂：越過快感原則、兼具痛苦與固著的滿足。",
      "acting out／passage à l’acte：前者是在他者舞台上展示有待解讀的訊息；後者是主體從象徵場景墜出。此區分不是臨床風險分級，也不能替代危機評估。"

    "intro": "以色列出生的學者、策展人與影像理論家，將攝影重新界定為政治關係與公民實踐，而非相機產出的單一物件。她批判帝國透過檔案、博物館、國籍與時間敘事，把暴力切割成已完成的過去。",
    "background": [
      "Azoulay 的工作從以巴政治、攝影與公民身分交會處出發。《The Civil Contract of Photography》（2008 英譯）主張被攝者、攝影者與觀看者共享一個不等同國家主權的公民關係。《Civil Imagination》（2012）擴充非主權式公民概念；《Potential History》（2019）把「去學習帝國主義」推進到檔案與博物館，反對將掠奪物、被統治者與觀看者分割。她後來加入 Aïsha 之名，亦標示對殖民身分分類的反思。",
      "Azoulay 目前任 Brown University 現代文化與媒體、比較文學教授，並以電影論述、策展與檔案實作延伸寫作。2008 年《The Civil Contract of Photography》建立非主權的攝影公民關係；2012 年《Civil Imagination》把公民概念推向政治存有論；2019 年《Potential History》則將問題擴大到博物館、掠奪、檔案與帝國時間。她的方法不是把照片當插圖，而是把理論、展示、重新標註與拒絕帝國分類視為同一研究實踐。",
      "Azoulay 將攝影史的基本單位由「照片／作者」改成「攝影事件／多方參與者」，又把事件的時間延長到檔案保存、重新觀看與未來主張。這使被攝者不再只是已發生暴力的證物，而是可能透過鏡頭向尚未到場的公眾提出要求。其後的 potential history 不是虛構另一個過去，而是拒絕接受帝國暴力製造的既成事實與時間斷裂；unlearning imperialism 也不只是更換觀點，而是重組物件、文件、人與機構的關係。批評者可能追問觀看者義務是否過度擴張、影像是否真能支持特定權利主張；她的回應方向則是：公民閱讀不宣稱照片自證，而要求連同檔案制度、命名、掠奪與不可見條件一起判讀。"

};
const navHistory = []; // stack of {tab, scrollY, filters, query} — 支援多層跳轉逐層返回

// ---------- localStorage helpers ----------
function lsKey(id, field){ return `${LS_PREFIX}${id}:${field}`; }
function lsGet(id, field, fallback=''){ return localStorage.getItem(lsKey(id, field)) ?? fallback; }
function lsSet(id, field, val){ localStorage.setItem(lsKey(id, field), val); }
function touch(id){ lsSet(id, 'lastTouched', String(Date.now())); }

function philLsKey(id, field){ return `${LS_PHIL_PREFIX}${id}:${field}`; }
function philLsGet(id, field, fallback=''){ return localStorage.getItem(philLsKey(id, field)) ?? fallback; }
function philLsSet(id, field, val){ localStorage.setItem(philLsKey(id, field), val); }

// ---------- reflection history (versioning) ----------
function getHistory(prefix, id){
  try{
    const raw = localStorage.getItem(`${prefix}${id}:reflectionLog`);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function archiveReflection(prefix, id, text){
  if(!text || !text.trim()) return false;
  const hist = getHistory(prefix, id);
  const last = hist[hist.length-1];
  if(last && last.text === text) return false; // 內容沒變就不重複封存
  hist.push({ ts: Date.now(), text });
  localStorage.setItem(`${prefix}${id}:reflectionLog`, JSON.stringify(hist));
  return true;
}
function historyListHtml(prefix, id){
  const hist = getHistory(prefix, id).slice().reverse();
  if(hist.length === 0) return `<div class="history-empty">尚無封存紀錄——下方textarea持續自動存草稿，按「封存」才會留下一筆帶時間戳的歷史切片。</div>`;
  return hist.map(h => `
    <div class="history-item">
      <div class="history-ts">${escapeHtml(new Date(h.ts).toLocaleString('zh-TW'))}</div>
      <div class="history-text">${escapeHtml(h.text)}</div>
    </div>`).join('');
}

// ---------- generic helpers ----------
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function escapeHtml(s){ return (s||'').replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch])); }
function mdInline(escaped){ return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function philKey(name){ return (name||'').split('（')[0].split('(')[0].trim(); }
function uniqueSorted(arr){ return [...new Set(arr)].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-Hant')); }
function timeAgo(ts){
  if(!ts) return '尚未讀過';
  const diffMs = Date.now() - Number(ts);
  const day = 86400000;
  const days = Math.floor(diffMs / day);
  if(days <= 0) return '今天讀過';
  if(days === 1) return '昨天讀過';
  if(days < 30) return `${days} 天前讀過`;
  const months = Math.floor(days/30);
  return `${months} 個月前讀過`;
}

const PHIL_COLORS = {};
const PALETTE = ['#C9A227','#52b0e0','#e08852','#52e07a','#a052e0','#e05252','#7fd4c1','#d68fd6'];
function philColor(name){
  const key = philKey(name);
  if(!PHIL_COLORS[key]) PHIL_COLORS[key] = PALETTE[Object.keys(PHIL_COLORS).length % PALETTE.length];
  return PHIL_COLORS[key];
}

const REL_CLASS = { '張力':'rel-c-tension', '呼應':'rel-c-resonance', '批判':'rel-c-critique', '繼承':'rel-c-inheritance', '對話':'rel-c-dialogue' };

// generic longest-match-first name linkifier against an arbitrary name->id map
function linkifyNames(text, nameToId, jumpAttr, excludeId){
  const names = [...nameToId.keys()].sort((a,b)=>b.length-a.length);
  let html = ''; let i = 0;
  while(i < text.length){
    let matched = null;
    for(const n of names){
      if(n && text.startsWith(n, i)){ matched = n; break; }
    }
    if(matched){
      const id = nameToId.get(matched);
      if(id && id !== excludeId){
        html += `<span class="rel-link" data-${jumpAttr}="${id}">${escapeHtml(matched)}</span>`;
      } else {
        html += escapeHtml(matched);
      }
      i += matched.length;
    } else {
      html += escapeHtml(text[i]);
      i += 1;
    }
  }
  return html;
}

function philNameMap(){
  const m = new Map();
  PHILOSOPHERS.forEach(p => m.set(p.name_zh, p.id));
  return m;
}
function cardNameMap(){
  const m = new Map();
  CARDS.forEach(c => m.set(c.name_zh, c.id));
  return m;
}

function findTargetCard(conceptText, excludeId){
  return CARDS.find(c => c.id !== excludeId && conceptText.includes(c.name_zh));
}

// ---------- backlinks (自動雙向連結索引) ----------
// 建一次、存在記憶體：掃過所有卡片/哲學家自己宣告的 relations，
// 反向登記「誰提到了我」，讓還沒被回補關係的舊卡也能被新卡的宣告自動連上。
function buildCardBacklinks(){
  const map = new Map();
  CARDS.forEach(sourceCard => {
    (sourceCard.relations||[]).forEach(rel => {
      const target = findTargetCard(rel.concept, sourceCard.id);
      if(target){
        if(!map.has(target.id)) map.set(target.id, []);
        map.get(target.id).push({ sourceId: sourceCard.id, sourceName: sourceCard.name_zh, type: rel.type, text: rel.text });
      }
    });
  });
  return map;
}
function buildPhilBacklinks(){
  const map = new Map();
  PHILOSOPHERS.forEach(sourceP => {
    (sourceP.relations||[]).forEach(rel => {
      const target = PHILOSOPHERS.find(p => p.id !== sourceP.id && rel.name.includes(p.name_zh));
      if(target){
        if(!map.has(target.id)) map.set(target.id, []);
        map.get(target.id).push({ sourceId: sourceP.id, sourceName: sourceP.name_zh, type: rel.type, text: rel.text });
      }
    });
  });
  return map;
}
// 去重：若目標卡自己已經宣告了指回來源的關係（雙方都手動寫過），
// 反向連結區塊就不重複顯示——只浮現「單向、還沒被回補」的引用，這才是這個功能真正的價值。
function backlinksForCard(cardId){
  const all = CARD_BACKLINKS.get(cardId) || [];
  const card = CARDS.find(c=>c.id===cardId);
  if(!card) return [];
  const declared = new Set(
    (card.relations||[]).map(r => { const t = findTargetCard(r.concept, cardId); return t ? t.id : null; }).filter(Boolean)
  );
  return all.filter(b => !declared.has(b.sourceId));
}
function backlinksForPhil(philId){
  const all = PHIL_BACKLINKS.get(philId) || [];
  const phil = PHILOSOPHERS.find(p=>p.id===philId);
  if(!phil) return [];
  const declared = new Set(
    (phil.relations||[]).map(r => { const t = PHILOSOPHERS.find(p => p.id !== philId && r.name.includes(p.name_zh)); return t ? t.id : null; }).filter(Boolean)
  );
  return all.filter(b => !declared.has(b.sourceId));
}
function backlinksHtml(links, jumpAttr, jumpTab){
  if(!links.length) return '';
  return `
    <div class="sec">
      <h3>被提及於（反向關聯・自動生成）</h3>
      ${links.map(l => {
        const cls = REL_CLASS[l.type] || 'rel-c-dialogue';
        return `
          <div class="rel ${cls}">
            <span class="rel-dot"></span>
            <span><span class="rel-type">[${escapeHtml(l.type)}]</span><span class="rel-link" data-${jumpAttr}="${l.sourceId}">${escapeHtml(l.sourceName)}<span class="rel-jump-icon">↳</span></span>：${escapeHtml(l.text)}</span>
          </div>`;
      }).join('')}
    </div>`;
}

// ---------- CARD rendering ----------
function relHtml(rel, ownerId){
  const cls = REL_CLASS[rel.type] || 'rel-c-dialogue';
  const target = findTargetCard(rel.concept, ownerId);
  const conceptHtml = target
    ? `<span class="rel-link" data-jump="${target.id}">${escapeHtml(rel.concept)}<span class="rel-jump-icon">↳</span></span>`
    : escapeHtml(rel.concept);
  const philHtml = linkifyNames(rel.philosopher, philNameMap(), 'jump-phil', null);
  return `
    <div class="rel ${cls}">
      <span class="rel-dot"></span>
      <span><span class="rel-type">[${escapeHtml(rel.type)}]</span>${conceptHtml}${rel.philosopher ? `／${philHtml}` : ''}：${escapeHtml(rel.text)}</span>
    </div>`;
}

function cardMatches(card){
  const f = state.filters;
  if(f.philosopher && philKey(card.philosopher) !== f.philosopher) return false;
  if(f.topic && !card.topics.includes(f.topic)) return false;
  if(f.tradition && !card.traditions.includes(f.tradition)) return false;
  if(f.status){
    const st = lsGet(card.id, 'status', '未複習');
    if(st !== f.status) return false;
  }
  const tokens = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!tokens.length) return true;
  const hay = [card.name_zh, card.name_orig, card.philosopher, card.source,
    ...(card.aliases||[]), ...(card.topics||[]), ...(card.traditions||[]), card.definition,
    ...(card.expand||[]), ...(card.life||[])].join(' ').toLowerCase();
  return tokens.every(t => hay.includes(t));
}

    const topicCounts = {}; CARDS.forEach(c => c.topics.forEach(t => topicCounts[t]=(topicCounts[t]||0)+1));
    const tradCounts = {}; CARDS.forEach(c => c.traditions.forEach(t => tradCounts[t]=(tradCounts[t]||0)+1));
    const statusCounts = {'未複習':0,'已重述':0,'需重讀':0};
    CARDS.forEach(c => { const s = lsGet(c.id,'status','未複習'); statusCounts[s] = (statusCounts[s]||0)+1; });

    const section = (title, key, counts) => `

          `).join('')}

      <h2>篩選</h2>

      ${section('主題', 'topic', topicCounts)}
      ${section('傳統', 'tradition', tradCounts)}

    body.innerHTML = `
      <h2>篩選</h2>

        <div class="chip-wrap">
          ${uniqueSorted(Object.keys(tradCounts)).map(v => `

}
function win_scrollY(){ return (typeof window !== 'undefined' && window.scrollY) || 0; }
document.getElementById('backBtn').addEventListener('click', () => {

  document.getElementById('clearBtn').classList.toggle('show', !!prev.query);
  state.filters = prev.filters;
  render();
  updateBackButton();
  requestAnimationFrame(() => { window.scrollTo(0, prev.scrollY); });
});

// ---------- jump ----------
function switchTab(tab){
  if(state.tab === tab) return;
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===tab));
  document.getElementById('search').placeholder = tab==='cards' ? '搜尋概念、別名、哲學家、標籤…' : '搜尋哲學家姓名、傳統…';
  document.getElementById('reviewBtn').style.display = tab==='cards' ? '' : 'none';
}

function jumpTo(targetId, targetTab){
  pushHistory();
  switchTab(targetTab);
  state.query = ''; document.getElementById('search').value = '';
  document.getElementById('clearBtn').classList.remove('show');
  if(targetTab === 'cards'){
    state.filters = { philosopher:null, topic:null, tradition:null, status:null, philTradition: state.filters.philTradition };
  } else {
    state.filters = { philosopher:null, topic:null, tradition:null, status:null, philTradition:null };
  }
  state.open[targetId] = true;
  render();
  updateBackButton();
  requestAnimationFrame(() => {
    const el = document.getElementById(targetId);
    if(el){
      if(typeof el.scrollIntoView === 'function') el.scrollIntoView({behavior:'smooth', block:'start'});
      el.classList.add('flash');
      setTimeout(()=> el.classList.remove('flash'), 1200);
    }
  });
}

// ---------- render ----------
function render(){
  updateFilterUI();
  const items = state.tab === 'cards' ? CARDS.filter(cardMatches) : PHILOSOPHERS.filter(philMatches);
  document.getElementById('count').textContent = `${items.length} 項`;
  const list = document.getElementById('list');
  if(items.length === 0){
    list.innerHTML = `<div class="empty">沒有項目符合目前的搜尋與篩選。<br>試試看拿掉一個篩選條件，或換個關鍵字。</div>`;
    return;
  }
  list.innerHTML = items.map(state.tab==='cards' ? cardHtml : philHtml).join('');
  // 事件綁定改為委派（見下方 #list 的單一委派監聽器），這裡不再逐一綁定。
}

// ---------- 事件委派：整個 #list 只掛一組監聽器 ----------
// 展開/收合、狀態切換、封存、歷史紀錄開關都走局部 DOM 更新，不觸發 render()；
// 只有真正需要換一批項目的操作（跳轉、篩選、搜尋）才呼叫 render()。
const listEl = document.getElementById('list');

listEl.addEventListener('click', e => {
  // 展開／收合：只切 class，不重繪
  const head = e.target.closest('[data-toggle]');
  if(head){
    const id = head.dataset.toggle;
    const cardEl = document.getElementById(id);
    state.open[id] = !state.open[id];
    if(cardEl) cardEl.classList.toggle('open', state.open[id]);
    return;
  }

  // 概念卡跳轉
  const jumpEl = e.target.closest('[data-jump]');
  if(jumpEl){ e.stopPropagation(); jumpTo(jumpEl.dataset.jump, 'cards'); return; }

  // 哲學家跳轉
  const jumpPhilEl = e.target.closest('[data-jump-phil]');
  if(jumpPhilEl){ e.stopPropagation(); jumpTo(jumpPhilEl.dataset.jumpPhil, 'philosophers'); return; }

  // 哲學家主頁裡「相關概念卡」跳轉
  const jumpToCardEl = e.target.closest('[data-jump-to-card]');
  if(jumpToCardEl){ e.stopPropagation(); jumpTo(jumpToCardEl.dataset.jumpToCard, 'cards'); return; }

  // 複習狀態按鈕：局部更新同一組按鈕的 active 樣式 + 卡片右上角時間戳
  const statusBtn = e.target.closest('[data-status]');
  if(statusBtn){
    e.stopPropagation();
    const id = statusBtn.dataset.status, val = statusBtn.dataset.value;
    lsSet(id, 'status', val);
    touch(id);
    statusBtn.parentElement.querySelectorAll('.status-btn').forEach(b => b.classList.toggle('active', b.dataset.value === val));
    const cardEl = document.getElementById(id);
    const touchedEl = cardEl && cardEl.querySelector('.touched');
    if(touchedEl) touchedEl.textContent = timeAgo(lsGet(id,'lastTouched',''));
    return;
  }

  // 「我剛讀過」：局部更新時間戳
  const touchBtn = e.target.closest('[data-touch]');
  if(touchBtn){
    e.stopPropagation();
    const id = touchBtn.dataset.touch;
    touch(id);
    const cardEl = document.getElementById(id);
    const touchedEl = cardEl && cardEl.querySelector('.touched');
    if(touchedEl) touchedEl.textContent = timeAgo(lsGet(id,'lastTouched',''));
    return;
  }

  // 封存重述為歷史紀錄：局部更新歷史清單與筆數
  const archiveBtn = e.target.closest('[data-archive]');
  if(archiveBtn){
    e.stopPropagation();
    const id = archiveBtn.dataset.archive;
    const kind = archiveBtn.dataset.kind; // 'card' | 'phil'
    const prefix = kind === 'phil' ? LS_PHIL_PREFIX : LS_PREFIX;
    const field = kind === 'phil' ? 'note' : 'reflection';
    const text = kind === 'phil' ? philLsGet(id, field, '') : lsGet(id, field, '');
    const ok = archiveReflection(prefix, id, text);
    const histListEl = document.getElementById(`hist-${kind}-${id}`);
    const toggleEl = listEl.querySelector(`[data-history-toggle="${id}"][data-kind="${kind}"]`);
    if(histListEl) histListEl.innerHTML = historyListHtml(prefix, id);
    if(toggleEl){
      const n = getHistory(prefix, id).length;
      const isOpen = histListEl && histListEl.style.display !== 'none';
      toggleEl.textContent = `歷史紀錄（${n}）${isOpen ? '▾' : '▸'}`;
      if(ok && histListEl){ histListEl.style.display = 'block'; toggleEl.textContent = `歷史紀錄（${n}）▾`; }
    }
    return;
  }

  // 展開／收合歷史紀錄清單
  const histToggle = e.target.closest('[data-history-toggle]');
  if(histToggle){
    e.stopPropagation();
    const id = histToggle.dataset.historyToggle, kind = histToggle.dataset.kind;
    const histListEl = document.getElementById(`hist-${kind}-${id}`);
    if(!histListEl) return;
    const nowOpen = histListEl.style.display === 'none';
    histListEl.style.display = nowOpen ? 'block' : 'none';
    const n = kind === 'phil' ? getHistory(LS_PHIL_PREFIX, id).length : getHistory(LS_PREFIX, id).length;
    histToggle.textContent = `歷史紀錄（${n}）${nowOpen ? '▾' : '▸'}`;
    return;
  }
});

listEl.addEventListener('click', e => {
  if(e.target.tagName === 'TEXTAREA') e.stopPropagation();
}, true);

listEl.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('textarea.reflection[data-id]')){
    lsSet(t.dataset.id, 'reflection', t.value);
    const note = listEl.querySelector(`[data-save="${t.dataset.id}"]`);
    if(note) note.textContent = t.value ? `已於本機儲存重述（${t.value.length} 字）` : '尚未填寫重述';
  } else if(t.matches('textarea.reflection[data-phil-id]')){
    philLsSet(t.dataset.philId, 'note', t.value);
  }
});

// ---------- today's review ----------
function buildReviewQueue(n=5){
  const tiers = [
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '需重讀'),
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '未複習'),
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '已重述'),
  ];
  const byOldest = (a,b) => {
    const ta = Number(lsGet(a.id,'lastTouched','0'));
    const tb = Number(lsGet(b.id,'lastTouched','0'));
    return ta - tb; // 0 (never touched) sorts first
  };
  let queue = [];
  for(const tier of tiers){
    tier.sort(byOldest);
    for(const c of tier){
      if(queue.length >= n) break;
      queue.push(c);
    }
    if(queue.length >= n) break;
  }
  return queue;
}
document.getElementById('reviewBtn').addEventListener('click', () => {
  const queue = buildReviewQueue(5);
  const listEl = document.getElementById('reviewList');
  if(queue.length === 0){
    listEl.innerHTML = `<div class="empty">卡片庫是空的。</div>`;
  } else {
    listEl.innerHTML = queue.map(c => {
      const status = lsGet(c.id,'status','未複習');
      const lastTouched = lsGet(c.id,'lastTouched','');
      return `<div class="review-item" data-review-jump="${c.id}">
        <div class="ri-main"><div class="ri-name">${escapeHtml(c.name_zh)}</div><div class="ri-def">${escapeHtml(c.definition)}</div></div>
        <div class="ri-badge">${escapeHtml(status)}<br>${timeAgo(lastTouched)}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('[data-review-jump]').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('reviewModalMask').classList.remove('show');
        jumpTo(el.dataset.reviewJump, 'cards');
      });
    });
  }
  document.getElementById('reviewModalMask').classList.add('show');
});
document.getElementById('reviewModalMask').addEventListener('click', e => {
  if(e.target.id === 'reviewModalMask') e.currentTarget.classList.remove('show');
});

// ---------- export ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  let out = `哲學概念庫｜本機重述匯出\n匯出時間：${new Date().toLocaleString('zh-TW')}\n\n`;
  let any = false;
  CARDS.forEach(c => {
    const reflection = lsGet(c.id, 'reflection', '');
    const status = lsGet(c.id, 'status', '未複習');
    if(reflection || status !== '未複習'){
      any = true;
      out += `## ${c.name_zh}｜${c.name_orig}\n複習狀態：${status}\n我的重述：${reflection || '（未填寫）'}\n\n`;
    }
  });
  PHILOSOPHERS.forEach(p => {
    const note = philLsGet(p.id, 'note', '');
    if(note){ any = true; out += `## [哲學家] ${p.name_zh}\n我的筆記：${note}\n\n`; }
  });
  if(!any) out += '（目前沒有任何本機草稿。先在卡片或哲學家頁面裡寫點東西再匯出。）';
  document.getElementById('exportText').value = out;
  document.getElementById('exportModalMask').classList.add('show');
});
document.getElementById('closeExport').addEventListener('click', () => document.getElementById('exportModalMask').classList.remove('show'));
document.getElementById('exportModalMask').addEventListener('click', e => { if(e.target.id === 'exportModalMask') e.currentTarget.classList.remove('show'); });
document.getElementById('copyBtn').addEventListener('click', () => {
  const ta = document.getElementById('exportText');
  ta.select(); ta.setSelectionRange(0, 999999);
  document.execCommand('copy');
  document.getElementById('copyBtn').textContent = '已複製';
  setTimeout(()=> document.getElementById('copyBtn').textContent = '複製全部', 1500);
});

CARD_BACKLINKS = buildCardBacklinks();
PHIL_BACKLINKS = buildPhilBacklinks();
render();

</script>
