// ---------- filter modal ----------
function activeFilterCount(){
  const f = state.filters;
  return state.tab === 'cards'
    ? ['philosopher','topic','tradition','status'].filter(k=>f[k]).length
    : ['philTradition'].filter(k=>f[k]).length;
}

function buildFilterModal(){
  const body = document.getElementById('filterModalBody');
  if(state.tab === 'cards'){
    const philCounts = {}; CARDS.forEach(c => { const k = philKey(c.philosopher); philCounts[k]=(philCounts[k]||0)+1; });
    const topicCounts = {}; CARDS.forEach(c => c.topics.forEach(t => topicCounts[t]=(topicCounts[t]||0)+1));
    const tradCounts = {}; CARDS.forEach(c => c.traditions.forEach(t => tradCounts[t]=(tradCounts[t]||0)+1));
    const statusCounts = {'未複習':0,'已重述':0,'需重讀':0};
    CARDS.forEach(c => { const s = lsGet(c.id,'status','未複習'); statusCounts[s] = (statusCounts[s]||0)+1; });

    const section = (title, key, counts) => `
      <div class="filter-section">
        <h3>${title}</h3>
        <div class="chip-wrap">
          ${uniqueSorted(Object.keys(counts)).map(v => `
            <span class="chip ${state.filters[key]===v?'active':''}" data-fkey="${key}" data-fval="${escapeAttr(v)}">${escapeHtml(v)} (${counts[v]})</span>
          `).join('')}
        </div>
      </div>`;

    body.innerHTML = `
      <h2>篩選</h2>
      ${section('哲學家', 'philosopher', philCounts)}
      ${section('主題', 'topic', topicCounts)}
      ${section('傳統', 'tradition', tradCounts)}
      ${section('狀態', 'status', statusCounts)}
    `;
  } else {
    const tradCounts = {}; PHILOSOPHERS.forEach(p => p.traditions.forEach(t => tradCounts[t]=(tradCounts[t]||0)+1));
    body.innerHTML = `
      <h2>篩選</h2>
      <div class="filter-section">
        <h3>傳統</h3>
        <div class="chip-wrap">
          ${uniqueSorted(Object.keys(tradCounts)).map(v => `
            <span class="chip ${state.filters.philTradition===v?'active':''}" data-fkey="philTradition" data-fval="${escapeAttr(v)}">${escapeHtml(v)} (${tradCounts[v]})</span>
          `).join('')}
        </div>
      </div>`;
  }
  body.querySelectorAll('[data-fkey]').forEach(chip => {
    chip.addEventListener('click', () => {
      const k = chip.dataset.fkey, v = chip.dataset.fval;
      state.filters[k] = state.filters[k] === v ? null : v;
      buildFilterModal();
      render();
    });
  });
}
document.getElementById('filterBtn').addEventListener('click', () => {
  buildFilterModal();
  document.getElementById('filterModalMask').classList.add('show');
});
document.getElementById('filterModalMask').addEventListener('click', e => {
  if(e.target.id === 'filterModalMask') e.currentTarget.classList.remove('show');
});

function updateFilterUI(){
  const n = activeFilterCount();
  const badge = document.getElementById('filterBadge');
  badge.style.display = n>0 ? 'inline-block' : 'none';
  badge.textContent = n;
  document.getElementById('filterBtn').classList.toggle('active', n>0);

  const pills = document.getElementById('activePills');
  const f = state.filters;
  const labels = state.tab === 'cards'
    ? [['philosopher','哲學家'],['topic','主題'],['tradition','傳統'],['status','狀態']]
    : [['philTradition','傳統']];
  let html = '';
  labels.forEach(([key,label]) => {
    if(f[key]) html += `<span class="pill" data-clear="${key}">${label}：${escapeHtml(f[key])} ✕</span>`;
  });
  pills.innerHTML = html;
  pills.querySelectorAll('[data-clear]').forEach(p => {
    p.addEventListener('click', () => { state.filters[p.dataset.clear] = null; render(); });
  });
}

// ---------- back navigation ----------
function updateBackButton(){
  const btn = document.getElementById('backBtn');
  btn.style.display = navHistory.length > 0 ? '' : 'none';
}
function pushHistory(){
  navHistory.push({ tab: state.tab, scrollY: win_scrollY(), filters: {...state.filters}, query: state.query });
}
function win_scrollY(){ return (typeof window !== 'undefined' && window.scrollY) || 0; }
document.getElementById('backBtn').addEventListener('click', () => {
  if(navHistory.length === 0) return;
  const prev = navHistory.pop();
  state.tab = prev.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===prev.tab));
  document.getElementById('search').placeholder = prev.tab==='cards' ? '搜尋概念、別名、哲學家、標籤…' : '搜尋哲學家姓名、傳統…';
  document.getElementById('reviewBtn').style.display = prev.tab==='cards' ? '' : 'none';
  state.query = prev.query; document.getElementById('search').value = prev.query;
  document.getElementById('clearBtn').classList.toggle('show', !!prev.query);
  state.filters = prev.filters;
  render();
  updateBackButton();
  requestAnimationFrame(() => { window.scrollTo(0, prev.scrollY); });
});

// ---------- jump ----------
function switchTab(tab){
  if(state.tab === tab) return;
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===tab));
  document.getElementById('search').placeholder = tab==='cards' ? '搜尋概念、別名、哲學家、標籤…' : '搜尋哲學家姓名、傳統…';
  document.getElementById('reviewBtn').style.display = tab==='cards' ? '' : 'none';
}

function jumpTo(targetId, targetTab){
  pushHistory();
  switchTab(targetTab);
  state.query = ''; document.getElementById('search').value = '';
  document.getElementById('clearBtn').classList.remove('show');
  if(targetTab === 'cards'){
    state.filters = { philosopher:null, topic:null, tradition:null, status:null, philTradition: state.filters.philTradition };
  } else {
    state.filters = { philosopher:null, topic:null, tradition:null, status:null, philTradition:null };
  }
  state.open[targetId] = true;
  render();
  updateBackButton();
  requestAnimationFrame(() => {
    const el = document.getElementById(targetId);
    if(el){
      if(typeof el.scrollIntoView === 'function') el.scrollIntoView({behavior:'smooth', block:'start'});
      el.classList.add('flash');
      setTimeout(()=> el.classList.remove('flash'), 1200);
    }
  });
}

// ---------- render ----------
function render(){
  updateFilterUI();
  const items = state.tab === 'cards' ? CARDS.filter(cardMatches) : PHILOSOPHERS.filter(philMatches);
  document.getElementById('count').textContent = `${items.length} 項`;
  const list = document.getElementById('list');
  if(items.length === 0){
    list.innerHTML = `<div class="empty">沒有項目符合目前的搜尋與篩選。<br>試試看拿掉一個篩選條件，或換個關鍵字。</div>`;
    return;
  }
  list.innerHTML = items.map(state.tab==='cards' ? cardHtml : philHtml).join('');
  // 事件綁定改為委派（見下方 #list 的單一委派監聽器），這裡不再逐一綁定。
}

// ---------- 事件委派：整個 #list 只掛一組監聽器 ----------
// 展開/收合、狀態切換、封存、歷史紀錄開關都走局部 DOM 更新，不觸發 render()；
// 只有真正需要換一批項目的操作（跳轉、篩選、搜尋）才呼叫 render()。
const listEl = document.getElementById('list');

listEl.addEventListener('click', e => {
  // 展開／收合：只切 class，不重繪
  const head = e.target.closest('[data-toggle]');
  if(head){
    const id = head.dataset.toggle;
    const cardEl = document.getElementById(id);
    state.open[id] = !state.open[id];
    if(cardEl) cardEl.classList.toggle('open', state.open[id]);
    return;
  }

  // 概念卡跳轉
  const jumpEl = e.target.closest('[data-jump]');
  if(jumpEl){ e.stopPropagation(); jumpTo(jumpEl.dataset.jump, 'cards'); return; }

  // 哲學家跳轉
  const jumpPhilEl = e.target.closest('[data-jump-phil]');
  if(jumpPhilEl){ e.stopPropagation(); jumpTo(jumpPhilEl.dataset.jumpPhil, 'philosophers'); return; }

  // 哲學家主頁裡「相關概念卡」跳轉
  const jumpToCardEl = e.target.closest('[data-jump-to-card]');
  if(jumpToCardEl){ e.stopPropagation(); jumpTo(jumpToCardEl.dataset.jumpToCard, 'cards'); return; }

  // 複習狀態按鈕：局部更新同一組按鈕的 active 樣式 + 卡片右上角時間戳
  const statusBtn = e.target.closest('[data-status]');
  if(statusBtn){
    e.stopPropagation();
    const id = statusBtn.dataset.status, val = statusBtn.dataset.value;
    lsSet(id, 'status', val);
    touch(id);
    statusBtn.parentElement.querySelectorAll('.status-btn').forEach(b => b.classList.toggle('active', b.dataset.value === val));
    const cardEl = document.getElementById(id);
    const touchedEl = cardEl && cardEl.querySelector('.touched');
    if(touchedEl) touchedEl.textContent = timeAgo(lsGet(id,'lastTouched',''));
    return;
  }

  // 「我剛讀過」：局部更新時間戳
  const touchBtn = e.target.closest('[data-touch]');
  if(touchBtn){
    e.stopPropagation();
    const id = touchBtn.dataset.touch;
    touch(id);
    const cardEl = document.getElementById(id);
    const touchedEl = cardEl && cardEl.querySelector('.touched');
    if(touchedEl) touchedEl.textContent = timeAgo(lsGet(id,'lastTouched',''));
    return;
  }

  // 封存重述為歷史紀錄：局部更新歷史清單與筆數
  const archiveBtn = e.target.closest('[data-archive]');
  if(archiveBtn){
    e.stopPropagation();
    const id = archiveBtn.dataset.archive;
    const kind = archiveBtn.dataset.kind; // 'card' | 'phil'
    const prefix = kind === 'phil' ? LS_PHIL_PREFIX : LS_PREFIX;
    const field = kind === 'phil' ? 'note' : 'reflection';
    const text = kind === 'phil' ? philLsGet(id, field, '') : lsGet(id, field, '');
    const ok = archiveReflection(prefix, id, text);
    const histListEl = document.getElementById(`hist-${kind}-${id}`);
    const toggleEl = listEl.querySelector(`[data-history-toggle="${id}"][data-kind="${kind}"]`);
    if(histListEl) histListEl.innerHTML = historyListHtml(prefix, id);
    if(toggleEl){
      const n = getHistory(prefix, id).length;
      const isOpen = histListEl && histListEl.style.display !== 'none';
      toggleEl.textContent = `歷史紀錄（${n}）${isOpen ? '▾' : '▸'}`;
      if(ok && histListEl){ histListEl.style.display = 'block'; toggleEl.textContent = `歷史紀錄（${n}）▾`; }
    }
    return;
  }

  // 展開／收合歷史紀錄清單
  const histToggle = e.target.closest('[data-history-toggle]');
  if(histToggle){
    e.stopPropagation();
    const id = histToggle.dataset.historyToggle, kind = histToggle.dataset.kind;
    const histListEl = document.getElementById(`hist-${kind}-${id}`);
    if(!histListEl) return;
    const nowOpen = histListEl.style.display === 'none';
    histListEl.style.display = nowOpen ? 'block' : 'none';
    const n = kind === 'phil' ? getHistory(LS_PHIL_PREFIX, id).length : getHistory(LS_PREFIX, id).length;
    histToggle.textContent = `歷史紀錄（${n}）${nowOpen ? '▾' : '▸'}`;
    return;
  }
});

listEl.addEventListener('click', e => {
  if(e.target.tagName === 'TEXTAREA') e.stopPropagation();
}, true);

listEl.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('textarea.reflection[data-id]')){
    lsSet(t.dataset.id, 'reflection', t.value);
    const note = listEl.querySelector(`[data-save="${t.dataset.id}"]`);
    if(note) note.textContent = t.value ? `已於本機儲存重述（${t.value.length} 字）` : '尚未填寫重述';
  } else if(t.matches('textarea.reflection[data-phil-id]')){
    philLsSet(t.dataset.philId, 'note', t.value);
  }
});

// ---------- today's review ----------
function buildReviewQueue(n=5){
  const tiers = [
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '需重讀'),
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '未複習'),
    CARDS.filter(c => lsGet(c.id,'status','未複習') === '已重述'),
  ];
  const byOldest = (a,b) => {
    const ta = Number(lsGet(a.id,'lastTouched','0'));
    const tb = Number(lsGet(b.id,'lastTouched','0'));
    return ta - tb; // 0 (never touched) sorts first
  };
  let queue = [];
  for(const tier of tiers){
    tier.sort(byOldest);
    for(const c of tier){
      if(queue.length >= n) break;
      queue.push(c);
    }
    if(queue.length >= n) break;
  }
  return queue;
}
document.getElementById('reviewBtn').addEventListener('click', () => {
  const queue = buildReviewQueue(5);
  const listEl = document.getElementById('reviewList');
  if(queue.length === 0){
    listEl.innerHTML = `<div class="empty">卡片庫是空的。</div>`;
  } else {
    listEl.innerHTML = queue.map(c => {
      const status = lsGet(c.id,'status','未複習');
      const lastTouched = lsGet(c.id,'lastTouched','');
      return `<div class="review-item" data-review-jump="${c.id}">
        <div class="ri-main"><div class="ri-name">${escapeHtml(c.name_zh)}</div><div class="ri-def">${escapeHtml(c.definition)}</div></div>
        <div class="ri-badge">${escapeHtml(status)}<br>${timeAgo(lastTouched)}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('[data-review-jump]').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('reviewModalMask').classList.remove('show');
        jumpTo(el.dataset.reviewJump, 'cards');
      });
    });
  }
  document.getElementById('reviewModalMask').classList.add('show');
});
document.getElementById('reviewModalMask').addEventListener('click', e => {
  if(e.target.id === 'reviewModalMask') e.currentTarget.classList.remove('show');
});

// ---------- export ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  let out = `哲學概念庫｜本機重述匯出\n匯出時間：${new Date().toLocaleString('zh-TW')}\n\n`;
  let any = false;
  CARDS.forEach(c => {
    const reflection = lsGet(c.id, 'reflection', '');
    const status = lsGet(c.id, 'status', '未複習');
    if(reflection || status !== '未複習'){
      any = true;
      out += `## ${c.name_zh}｜${c.name_orig}\n複習狀態：${status}\n我的重述：${reflection || '（未填寫）'}\n\n`;
    }
  });
  PHILOSOPHERS.forEach(p => {
    const note = philLsGet(p.id, 'note', '');
    if(note){ any = true; out += `## [哲學家] ${p.name_zh}\n我的筆記：${note}\n\n`; }
  });
  if(!any) out += '（目前沒有任何本機草稿。先在卡片或哲學家頁面裡寫點東西再匯出。）';
  document.getElementById('exportText').value = out;
  document.getElementById('exportModalMask').classList.add('show');
});
document.getElementById('closeExport').addEventListener('click', () => document.getElementById('exportModalMask').classList.remove('show'));
document.getElementById('exportModalMask').addEventListener('click', e => { if(e.target.id === 'exportModalMask') e.currentTarget.classList.remove('show'); });
document.getElementById('copyBtn').addEventListener('click', () => {
  const ta = document.getElementById('exportText');
  ta.select(); ta.setSelectionRange(0, 999999);
  document.execCommand('copy');
  document.getElementById('copyBtn').textContent = '已複製';
  setTimeout(()=> document.getElementById('copyBtn').textContent = '複製全部', 1500);
});

CARD_BACKLINKS = buildCardBacklinks();
PHIL_BACKLINKS = buildPhilBacklinks();
render();

</script>
